# cassyx frontend — static serving + API/SSE reverse proxy.
#
# The backend host is templated from the compose service name; override with the
# CASSYX_API_UPSTREAM build arg / env if the API lives elsewhere.

upstream cassyx_api {
    server cassyx-api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. No CSP `unsafe-eval`: the bundle does not need it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Job progress streams (plan §5.5). Buffering here would hold every SSE frame until the
    # response completed, i.e. until the job finished — which defeats the entire point.
    location /api/jobs/ {
        proxy_pass http://cassyx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /api/ {
        proxy_pass http://cassyx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Secure-connect-bundle uploads and artifact downloads can be large; do not cap them
        # at nginx's 1 MB default.
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — react-router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
