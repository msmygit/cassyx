          description: UDA created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/keyspaces/{keyspace}/aggregates/{aggregateSignature}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/AggregateSignature"
    get:
      tags: [schema]
      operationId: getAggregate
      summary: Get one UDA by signature
      responses:
        "200":
          description: The UDA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedAggregate"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [schema]
      operationId: dropAggregate
      summary: Drop a UDA by signature
      parameters:
        - $ref: "#/components/parameters/IfExists"
      responses:
        "200":
          description: UDA dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/roles:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [schema]
      operationId: listRoles
      summary: List roles
      description: Requires the `rolesPermissions` capability (§7.1); Astra is partial, Keyspaces uses IAM.
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"
    post:
