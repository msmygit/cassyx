      operationId: getFunction
      summary: Get one UDF by signature
      responses:
        "200":
          description: The UDF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDefinedFunction"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [schema]
      operationId: dropFunction
      summary: Drop a UDF by signature
      parameters:
        - $ref: "#/components/parameters/IfExists"
      responses:
        "200":
          description: UDF dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/keyspaces/{keyspace}/aggregates:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
    get:
      tags: [schema]
      operationId: listAggregates
      summary: List user-defined aggregates
      responses:
        "200":
          description: UDAs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDefinedAggregate"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [schema]
      operationId: createAggregate
