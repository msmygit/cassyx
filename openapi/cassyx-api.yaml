openapi: 3.1.1

info:
  title: cassyx API
  version: 1.0.0
  summary: Self-hosted CQL IDE, data manager and bulk data mover for Cassandra / DSE / Astra.
  description: |
    The complete HTTP contract for `cassyx-api` (Spring Boot 3.5, Java 21).

    ## Conventions

    * All paths are prefixed with `/api`.
    * All request and response bodies are `application/json` unless explicitly stated
      (`multipart/form-data` for uploads, `text/event-stream` for job progress,
      `application/octet-stream` for artifact downloads).
    * **Every** error response uses the RFC 9457 `application/problem+json` media type and the
      `Problem` schema.
    * Identifiers of CQL objects are **always** carried as fully-qualified identities
      (`{keyspace, table, ...}`) on every schema node — never as a bare name. This is a hard
      requirement (plan §4) and is the fix for the keyspace-resolution bug in the prior-art
      prototype.
    * **Secrets are never present in any response schema.** Passwords, Astra tokens, SSH keys,
      keystore passwords and JDBC passwords are write-only. Responses expose presence flags only
      (`hasPassword`, `hasAstraToken`, `hasSecureConnectBundle`, ...). See `ConnectionResponse`.
    * Long-running work is always a `Job` (plan §5.5). Endpoints that start work return
      `202 Accepted` with a `Job` body; progress is consumed from
      `GET /api/jobs/{jobId}/events` (SSE).

    ## Licensing gate

    Every path is gated by the license filter (plan §9.1) **except**:
    `GET /api/health`, `GET /api/license`, `POST /api/license/activate`,
    `POST /api/billing/checkout-session`, `POST /api/billing/webhook`.
    Gated paths return `402 Payment Required` with a `Problem` body when unlicensed.
  contact:
    name: cassyx
    url: https://github.com/cassyx/cassyx
  license:
    name: Commercial — one-time purchase
    url: https://cassyx.dev/license

servers:
  - url: "{basePath}"
    description: |
      Same-origin deployment. The API is served from the same host as the UI, so a relative
      server URL is correct for every deployment shape (Docker Compose, Kubernetes, reverse
      proxy). Override `basePath` only when cassyx is mounted under a sub-path.
    variables:
      basePath:
        default: /
        description: Path prefix cassyx is mounted under, including the leading slash.

security:
  - licenseKey: []

tags:
  - name: connections
    description: |
      Workstream A — connection CRUD, secrets, SSH tunnels, SSL/mTLS material, session lifecycle
      and health (plan §3).
  - name: capabilities
    description: |
      Workstream A/Phase 2 — cluster capability probe used for feature gating (plan §7.1).
      Also carries the unauthenticated service health endpoint.
  - name: schema
    description: |
      Workstream B — schema catalog (keyspaces, tables, columns, indexes, materialized views,
      UDTs, UDFs, UDAs, roles/permissions), table info panel and DDL generate/preview/execute
      (plan §4).
  - name: query
    description: |
      Workstream C — interactive CQL execution, server-side paging via opaque page tokens,
      tracing, cancellation, CQL lexing/splitting, batches, history and saved scripts (plan §5.1).
  - name: bulk
    description: |
      Workstreams D + E — bulk unload/load/count jobs, the full DSBulk settings surface,
      derived defaults, generated command preview, job lifecycle, SSE progress, logs, artifacts
      and job templates (plan §5.2–§5.5).
  - name: vector
    description: |
      Workstream F — `vector<float, N>` columns, SAI index lifecycle with `similarity_function`,
      ANN query builder and similarity projections (plan §6).
  - name: data
    description: |
      Workstream G — row-level CRUD with TTL/timestamp and INSERT/UPDATE/DELETE statement
      generation for selected rows (plan §7).
  - name: migrate
    description: |
      Phase 2 — CQL dump/restore, keyspace copy between clusters, table duplication,
      file and JDBC import, result export (plan §8).
  - name: license
    description: |
      Workstream H — license state and offline Ed25519 activation (plan §9.1, §9.2). Ungated.
  - name: billing
    description: |
      Workstream H — Stripe Checkout session creation and the webhook receiver (plan §9.3).
      A separate surface from `license`: billing talks to the payment provider, licensing only
      ever *verifies* signatures. Ungated.

paths:

  ##########################################################################
  # health + license + billing  (the only ungated paths)
  ##########################################################################

  /api/health:
    get:
      tags: [capabilities]
      operationId: getServiceHealth
      summary: Service liveness/readiness probe
      description: Ungated. Used by Docker healthchecks and the UI's connectivity indicator.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealth"
        "4XX":
          $ref: "#/components/responses/ClientError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/license:
    get:
      tags: [license]
      operationId: getLicense
      summary: Current license state
      description: |
        Returns the verified license payload. When `cassyx.license.enforce=false` the service
        short-circuits to a synthetic license with `edition: "unlicensed-bypass"` and
        `bypass: true`; the UI must keep the bypass banner visible in that case (plan §9.2).
      security: []
      responses:
        "200":
          description: License state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "4XX":
          $ref: "#/components/responses/ClientError"

  /api/license/activate:
    post:
      tags: [license]
      operationId: activateLicense
      summary: Activate an Ed25519-signed license key
      description: |
        Verifies the detached Ed25519 signature against the embedded public key and, on success,
        persists the key. No network call is made — activation works fully air-gapped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseActivationRequest"
      responses:
        "200":
          description: License accepted and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Signature verification failed or the payload is malformed/tampered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cassyx.dev/problems/license-invalid
                title: License signature invalid
                status: 422
                detail: Ed25519 signature does not verify against the embedded public key.
                instance: /api/license/activate

  /api/license/trial:
    post:
      tags: [license]
      operationId: requestTrial
      summary: Request a time-limited trial license
      description: |
        Requests a trial key from the licensing service (plan §9.4). Nobody buys a database tool
        they have not pointed at their own cluster, so this is the first-run path: no card, no
        Stripe involvement.

        Minting requires the Ed25519 **private** key, which never ships in the self-hosted image,
        so this endpoint proxies to the operator-run `licensing/` deployment and then activates the
        returned key locally. It therefore needs egress — an air-gapped install must obtain a trial
        key out-of-band and use `/api/license/activate` instead, and this endpoint returns `503`
        with that guidance when the licensing service is unreachable.

        Trials are issued per email address; requesting a second one for an address that already
        had a trial returns `409` rather than silently re-arming the clock.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialRequest"
      responses:
        "200":
          description: Trial issued and activated. `expires` and `daysRemaining` are populated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A trial has already been issued for this email address.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cassyx.dev/problems/trial-already-used
                title: Trial already issued
                status: 409
                detail: A trial for ops@example.com was issued on 2026-08-01 and expired 2026-08-15.
                instance: /api/license/trial
        "503":
          description: Licensing service unreachable; obtain a key out-of-band and activate it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cassyx.dev/problems/licensing-service-unreachable
                title: Licensing service unreachable
                status: 503
                detail: Could not reach the licensing service. Use /api/license/activate instead.
                instance: /api/license/trial

  /api/billing/checkout-session:
    post:
      tags: [billing]
      operationId: createCheckoutSession
      summary: Create a Stripe Checkout session for the one-time purchase
      description: |
        Creates a Checkout Session with `mode: "payment"` (plan §9.3). `payment_method_types` is
        never sent, so dynamic payment methods stay enabled. Returns the hosted Checkout URL.
        Fulfillment is webhook-driven and never derived from the success page.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionRequest"
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Billing is disabled (`cassyx.billing.enabled=false`) or the provider is Noop.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/billing/webhook:
    post:
      tags: [billing]
      operationId: handleBillingWebhook
      summary: Stripe webhook receiver
      description: |
        CSRF-exempt. The **raw** request body must be preserved for
        `Webhook.constructEvent` signature verification. The handler is idempotent on `event.id`.

        Handled events (plan §9.3):

        | Event | Action |
        | --- | --- |
        | `checkout.session.completed` | fulfill only if `payment_status != "unpaid"` |
        | `checkout.session.async_payment_succeeded` | fulfill |
        | `checkout.session.async_payment_failed` | mark failed, notify |

        Any other event type is acknowledged with `200` and ignored.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe webhook signature header, verified before any processing.
          schema:
            type: string
          example: "t=1755388800,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd"
      requestBody:
        required: true
        description: Raw Stripe event JSON. Deliberately untyped — the body is verified byte-for-byte.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookEnvelope"
      responses:
        "200":
          description: Event acknowledged (processed, or ignored as an unhandled type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          description: Signature verification failed. Nothing was processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  ##########################################################################
  # connections (§3)
  ##########################################################################

  /api/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List saved connections
      description: Secrets are never included; presence flags only.
      responses:
        "200":
          description: All saved connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection
      description: |
        Creates a connection in one of three modes (plan §3): `CASSANDRA`/`DSE`, `ASTRA`,
        or `ADVANCED`. Secret fields are encrypted at rest with AES-256-GCM using
        `CASSYX_SECRET_KEY` and are never echoed back.

        For `ASTRA`, the secure connect bundle is uploaded separately via
        `POST /api/connections/{connectionId}/secure-connect-bundle` — it is a **file upload**,
        never a filesystem path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "201":
          description: Connection created.
          headers:
            Location:
              description: URI of the created connection.
              schema:
                type: string
                format: uri-reference
              example: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [connections]
      operationId: getConnection
      summary: Get one connection
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [connections]
      operationId: updateConnection
      summary: Update a connection
      description: |
        Full replacement. Secret fields left `null` are **preserved**; to clear a secret send an
        empty string. Uploaded binary material (SCB, truststore, keystore) is unaffected by this
        call and is managed through its own endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "200":
          description: Connection updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Delete a connection
      description: Closes any live `CqlSession` for this connection first.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A running job still references this connection.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/connections/{connectionId}/secure-connect-bundle:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: uploadSecureConnectBundle
      summary: Upload the Astra secure connect bundle
      description: |
        Uploads `secure-connect-<db>.zip`. The bundle is stored **encrypted in H2** and
        materialized to a temp file scoped to the session's lifetime when the session is built
        (`CqlSessionBuilder.withCloudSecureConnectBundle`). The path is never exposed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SecureConnectBundleUpload"
            encoding:
              file:
                contentType: application/zip
      responses:
        "200":
          description: Bundle stored; connection metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [connections]
      operationId: deleteSecureConnectBundle
      summary: Remove the stored secure connect bundle
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/ssl/truststore:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: uploadTruststore
      summary: Upload an SSL truststore (JKS/PKCS12)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KeystoreUpload"
      responses:
        "200":
          description: Truststore stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [connections]
      operationId: deleteTruststore
      summary: Remove the stored truststore
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/ssl/keystore:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: uploadKeystore
      summary: Upload a client keystore for mTLS (JKS/PKCS12)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KeystoreUpload"
      responses:
        "200":
          description: Keystore stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      tags: [connections]
      operationId: deleteKeystore
      summary: Remove the stored client keystore
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/connect:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: connectConnection
      summary: Open a live CqlSession for this connection
      description: |
        Builds the SSH tunnel (if configured), then the `CqlSession`, registers it in the
        `SessionRegistry` keyed by `(userId, connectionId)` with an idle-eviction TTL, and runs
        the capability probe (plan §7.1). Idempotent — connecting an already-connected
        connection returns the existing session state.
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The cluster could not be reached or authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cassyx.dev/problems/connection-failed
                title: Could not reach cluster
                status: 502
                detail: "AllNodesFailedException: Could not reach any contact point (127.0.0.1:9042)."
                instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/connect

  /api/connections/{connectionId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: disconnectConnection
      summary: Close the live session
      description: Closes the `CqlSession`, tears down the SSH tunnel and deletes materialized secrets.
      responses:
        "200":
          description: Session closed (or was already closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/test:
    post:
      tags: [connections]
      operationId: testConnection
      summary: Test connection settings without saving
      description: |
        Builds a throwaway session from the supplied settings, runs `SELECT release_version FROM
        system.local`, then closes it. Accepts a `connectionId` instead of inline settings to test
        an already-saved connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionTestRequest"
      responses:
        "200":
          description: Test result — check `success`; a failed probe is still a 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/health:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [connections]
      operationId: getConnectionHealth
      summary: Health of a connection's live session
      description: Drives the UI's connected indicator. Cheap — reads driver node state, no query.
      responses:
        "200":
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionHealth"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions:
    get:
      tags: [connections]
      operationId: listSessions
      summary: List live sessions in the registry
      description: Multiple simultaneous cluster connections are supported (plan §3).
      responses:
        "200":
          description: Live sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionState"
        "402":
          $ref: "#/components/responses/PaymentRequired"

  ##########################################################################
  # Astra DevOps API helpers — SCB auto-download (§3.1)
  ##########################################################################

  /api/astra/databases:
    get:
      tags: [connections]
      operationId: listAstraDatabases
      summary: List the caller's Astra databases (database picker)
      description: |
        Proxies `GET https://api.astra.datastax.com/v2/databases` using the supplied Astra token
        so the UI can render a **database picker** instead of making the user type a UUID
        (plan §3.1).

        **The token is passed in the `X-Astra-Token` header — never as a query parameter.**
        Tokens must not land in access logs, proxy logs, browser history or `Referer` headers.
        The token is not persisted by this call and is never echoed back in any response,
        including error responses.

        If `api.astra.datastax.com` is unreachable the call fails fast with `502` and an
        actionable message pointing at `UPLOAD` mode — it never retries silently, because many
        self-hosted installs have no egress.
      parameters:
        - $ref: "#/components/parameters/AstraTokenHeader"
      responses:
        "200":
          description: The databases visible to this token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AstraDatabase"
        "401":
          description: The Astra token was rejected by the DevOps API.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cassyx.dev/problems/astra-unauthorized
                title: Astra token rejected
                status: 401
                detail: The DevOps API rejected the supplied token. Check that it has at least
                  "Database Administrator" privileges.
                instance: /api/astra/databases
        "502":
          $ref: "#/components/responses/AstraUnreachable"

  /api/astra/databases/{databaseId}/bundles:
    parameters:
      - $ref: "#/components/parameters/AstraDatabaseId"
    get:
      tags: [connections]
      operationId: listAstraBundles
      summary: List available secure connect bundles for a database
      description: |
        Backed by `POST https://api.astra.datastax.com/v2/databases/{databaseId}/secureBundleURL?all=true`
        (bearer token, no request body), which returns a **JSON array with one element per
        datacenter**. Each element carries `region`, `downloadURL` (the `default` bundle) and,
        optionally, `customDomainBundles[]` of `{domain, downloadURL}`.

        The UI populates its **region dropdown** and **custom-domain dropdown** from this response
        rather than from free-text input.

        Note the two orthogonal selectors used downstream by `downloadAstraBundle`: `region`
        (optional, matched case-insensitively against these elements) and `scbType` ∈
        {`default`, `custom`}. See `AstraBundleDownloadRequest`.

        Download URLs in this response are short-lived pre-signed HTTPS URLs and require no auth
        header. The Astra token is passed in `X-Astra-Token` and is never echoed back.
      parameters:
        - $ref: "#/components/parameters/AstraTokenHeader"
      responses:
        "200":
          description: One entry per datacenter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AstraBundleDatacenter"
        "401":
          description: The Astra token was rejected by the DevOps API.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such database for this token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/AstraUnreachable"

  /api/astra/databases/{databaseId}/bundle/download:
    parameters:
      - $ref: "#/components/parameters/AstraDatabaseId"
    post:
      tags: [connections]
      operationId: downloadAstraBundle
      summary: Resolve and download a secure connect bundle server-side
      description: |
        Resolves the bundle using the selection algorithm of plan §3.1, downloads the zip
        **server-side** over plain HTTPS (the pre-signed URL takes no auth header), validates it
        is a readable zip containing the expected bundle entries, stores it **encrypted in H2**
        against `connectionId` with the same AES-256-GCM envelope as credentials, and returns
        **metadata only — never the bytes**.

        Selection algorithm:

        1. Match the datacenter element whose `region` equals the requested `region`
           (case-insensitive). If `region` is absent, take the first element.
        2. `scbType: "default"` → use that element's `downloadURL`.
           `scbType: "custom"` → search its `customDomainBundles[]` for the requested `domain`.

        `region` and `scbType` are **two orthogonal inputs**. `scbType` has exactly two legal
        values; `region` is not one of them. Anything else is rejected with `400`. Absent
        `scbType` defaults to `default`.

        The result is cached against `(databaseId, region, scbType, domain)`; set `force: true`
        for the explicit "re-download bundle" action, which is needed because Astra rotates
        bundles and a stale bundle surfaces as a confusing TLS failure.

        The token is write-only: it appears in the request, in no response, and in no log line.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AstraBundleDownloadRequest"
      responses:
        "200":
          description: Bundle downloaded, validated and stored encrypted against the connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecureConnectBundleInfo"
        "400":
          description: |
            Invalid selector — e.g. `scbType: "region"` (not a legal value; use the `region` field),
            or `scbType: "custom"` without `domain`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cassyx.dev/problems/invalid-scb-type
                title: Invalid scbType
                status: 400
                detail: 'scbType must be one of ["default", "custom"]. Received "region" —
                  regional selection is expressed through the separate "region" field.'
                instance: /api/astra/databases/f9a1b3c4-1111-2222-3333-444455556666/bundle/download
        "401":
          description: The Astra token was rejected by the DevOps API.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such database, region or custom domain for this token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The downloaded file is not a valid secure connect bundle zip.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/AstraUnreachable"

  ##########################################################################
  # capabilities (§7.1)
  ##########################################################################

  /api/connections/{connectionId}/capabilities:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [capabilities]
      operationId: getClusterCapabilities
      summary: Cluster capability probe result
      description: |
        Result of the `ClusterCapabilities` probe run at connect time (version +
        `system.local`/`system_schema` sniffing). The UI **hides** unsupported features with an
        explanatory tooltip rather than showing them broken. Cached for the session's lifetime;
        use `refresh=true` to re-probe.
      parameters:
        - name: refresh
          in: query
          required: false
          description: Force a re-probe instead of returning the cached result.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Capability matrix for this cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterCapabilities"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotConnected"

  ##########################################################################
  # schema catalog & DDL (§4)
  ##########################################################################

  /api/connections/{connectionId}/schema/tree:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [schema]
      operationId: getSchemaTree
      summary: Full schema tree for the object browser
      description: |
        Read from `session.getMetadata()` — the driver keeps a live, event-driven schema cache.
        The server never polls `system_schema`.

        **Every node carries its fully-qualified identity** (`SchemaNode.identity`) so that drag,
        selection and context-menu actions resolve from the node's own payload. Never resolve a
        keyspace from an ancestor node — that is exactly the prior-art bug (plan §1, §4, §7.3).
      parameters:
        - name: includeSystem
          in: query
          description: Include system keyspaces (`system`, `system_schema`, `system_auth`, ...).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The schema tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaTree"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotConnected"

  /api/connections/{connectionId}/schema/search:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [schema]
      operationId: searchSchema
      summary: Search the schema catalog
      description: Case-insensitive substring match over keyspace/table/view/column/index/type names.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: user
        - name: kinds
          in: query
          description: Restrict to the given node kinds.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SchemaNodeKind"
          style: form
          explode: false
        - name: includeSystem
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Matching nodes, each with a full identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaSearchResult"
        "409":
          $ref: "#/components/responses/NotConnected"

