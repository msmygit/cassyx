      operationId: createRole
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDefinition"
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/RoleName"
    put:
      tags: [schema]
      operationId: alterRole
      summary: Alter a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDefinition"
      responses:
        "200":
          description: Role altered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [schema]
      operationId: dropRole
      summary: Drop a role
      parameters:
        - $ref: "#/components/parameters/IfExists"
      responses:
        "200":
          description: Role dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [schema]
      operationId: listPermissions
      summary: Permission matrix
      description: |
        Reads `LIST ALL PERMISSIONS`. Optionally scoped to a role and/or a resource.
      parameters:
        - name: role
          in: query
          schema:
            type: string
          example: app_reader
        - name: resource
          in: query
          description: CQL resource string, e.g. `keyspace demo` or `table demo.users`.
          schema:
            type: string
          example: table demo.users
      responses:
        "200":
          description: Permission grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionGrant"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/permissions/grant:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [schema]
      operationId: grantPermission
      summary: GRANT a permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionChangeRequest"
      responses:
        "200":
          description: Permission granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/permissions/revoke:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [schema]
      operationId: revokePermission
      summary: REVOKE a permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionChangeRequest"
      responses:
        "200":
          description: Permission revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/ddl/generate:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [schema]
      operationId: generateDdl
      summary: Generate DDL for any object type from a structured definition
      description: |
        Pure function — never touches the cluster, never executes. Powers the "Preview CQL" pane
        that every visual editor must show. `objectType` selects the shape of `definition`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdlGenerateRequest"
      responses:
        "200":
          description: Generated, editable CQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlPreview"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/ddl/preview:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [schema]
      operationId: previewDdl
      summary: Preview DDL for an existing object (`describe`)
      description: |
        Uses `TableMetadata#describe(true)` and its siblings. Requires driver 4.19.0 for correct
        `vector<float, N>` rendering (CASSJAVA-2) — earlier 4.x patches emit invalid CQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdlDescribeRequest"
      responses:
        "200":
          description: The object's DDL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlPreview"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/ddl/execute:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [schema]
      operationId: executeDdl
      summary: Execute user-reviewed DDL
      description: |
        The escape hatch for the "edit the previewed CQL then run it" flow. The body must be CQL
        the user has seen. Statements are split with the real CQL lexer, never `split(";")`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdlExecuteRequest"
      responses:
        "200":
          description: Execution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/CqlError"

  ##########################################################################
  # query execution (§5.1)
  ##########################################################################

  /api/connections/{connectionId}/query:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [query]
      operationId: executeQuery
      summary: Execute a single CQL statement
      description: |
        Executes asynchronously on a virtual thread. The response carries the first page plus a
        `resultHandle`; further pages are fetched with `fetchNextPage` / `fetchPreviousPage` using
        the **opaque** `nextPageToken` / `previousPageToken`. Those tokens are server-side handles
        onto the driver's `PagingState` — clients must treat them as opaque and must never attempt
        to construct or decode one.

        The result handle is cached server-side with an idle TTL (default 10 minutes) and can be
        released early with `closeResultSet`.

        `[applied]` from an LWT is surfaced as a distinct top-level field, not just a column.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: First page of results (or a void result for a non-SELECT statement).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/NotConnected"
        "422":
          $ref: "#/components/responses/CqlError"
        "504":
          description: The per-query timeout elapsed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/connections/{connectionId}/query/batch:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [query]
      operationId: executeBatch
      summary: Execute a LOGGED / UNLOGGED / COUNTER batch
      description: |
        The response includes `spansMultiplePartitions`; the UI shows the multi-partition batch
        anti-pattern warning when it is `true`. Set `previewOnly` to get the assembled `BEGIN
        BATCH ... APPLY BATCH` text and the warning without executing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Batch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/CqlError"

  /api/query/results/{resultHandle}:
    parameters:
      - $ref: "#/components/parameters/ResultHandle"
    get:
      tags: [query]
      operationId: getResultSetState
      summary: Metadata about a cached result set
      description: Column definitions, page cursor position and TTL, without transferring rows.
      responses:
        "200":
          description: Result-set state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultSetState"
        "404":
          $ref: "#/components/responses/ResultHandleExpired"
    delete:
      tags: [query]
      operationId: closeResultSet
      summary: Release a cached result set and its paging state
      responses:
        "204":
          description: Released.
        "404":
          $ref: "#/components/responses/ResultHandleExpired"

  /api/query/results/{resultHandle}/next-page:
    parameters:
      - $ref: "#/components/parameters/ResultHandle"
    post:
      tags: [query]
      operationId: fetchNextPage
      summary: Fetch the next page
      description: |
        Server-side paging via the driver `PagingState`. This is the mechanism that replaces the
        prior-art prototype's hardcoded `LIMIT 100` dead end (plan §5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageRequest"
      responses:
        "200":
          description: The next page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "404":
          $ref: "#/components/responses/ResultHandleExpired"
        "409":
          description: The supplied page token does not belong to this result handle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/query/results/{resultHandle}/previous-page:
    parameters:
      - $ref: "#/components/parameters/ResultHandle"
    post:
      tags: [query]
      operationId: fetchPreviousPage
      summary: Fetch the previous page
      description: |
        Cassandra's paging state is forward-only; cassyx keeps a server-side stack of the page
        tokens already visited for this handle, so "previous" is a replay of a retained token.
        `previousPageToken` is `null` on the first page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageRequest"
      responses:
        "200":
          description: The previous page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "404":
          $ref: "#/components/responses/ResultHandleExpired"

  /api/query/executions/{queryId}/cancel:
    parameters:
      - $ref: "#/components/parameters/QueryId"
    post:
      tags: [query]
      operationId: cancelQuery
      summary: Cancel an in-flight query
      description: Cancels the underlying `CompletionStage` and interrupts the virtual thread.
      responses:
        "200":
          description: Cancellation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCancellationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/query/executions/{queryId}/trace:
    parameters:
      - $ref: "#/components/parameters/QueryId"
    get:
      tags: [query]
      operationId: getQueryTrace
      summary: Retrieve the query trace timeline
      description: |
        Only available when the query was run with `tracing: true`. Renders the full
        `system_traces.sessions` + `system_traces.events` timeline — the capability where `cqlsh`
        currently beats every GUI (plan §5.1).
      responses:
        "200":
          description: The trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTrace"
        "404":
          description: No trace for this query (tracing was disabled, or the trace has not landed yet).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/query/script/split:
    post:
      tags: [query]
      operationId: splitCqlScript
      summary: Split a multi-statement CQL script
      description: |
        Uses a real CQL lexer, **not** `split(";")` — string literals, comments and UDF bodies
        legitimately contain semicolons. Returns each statement with its source offsets so the
        editor can implement "run statement under cursor" and "run selection".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CqlScriptSplitRequest"
      responses:
        "200":
          description: Split statements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CqlScriptSplitResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/query/script/lex:
    post:
      tags: [query]
      operationId: lexCqlScript
      summary: Tokenize CQL
      description: Exposes the lexer directly for editor syntax services and for lexer test fixtures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CqlScriptSplitRequest"
      responses:
        "200":
          description: Token stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CqlLexResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/query/history:
    get:
      tags: [query]
      operationId: listQueryHistory
      summary: Query history with timings
      parameters:
        - name: connectionId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Substring filter over the statement text.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: History entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [query]
      operationId: clearQueryHistory
      summary: Clear query history
      parameters:
        - name: connectionId
          in: query
          description: Clear only this connection's history; omit to clear everything.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cleared.
        "402":
          $ref: "#/components/responses/PaymentRequired"

  /api/query/scripts:
    get:
      tags: [query]
      operationId: listSavedScripts
      summary: List saved / favourite scripts
      parameters:
        - name: folder
          in: query
          schema:
            type: string
          example: /exports
      responses:
        "200":
          description: Saved scripts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedScript"
        "402":
          $ref: "#/components/responses/PaymentRequired"
    post:
      tags: [query]
      operationId: createSavedScript
      summary: Save a script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedScriptRequest"
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScript"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/query/scripts/{scriptId}:
    parameters:
      - name: scriptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 3b6d0f9c-6d2b-4d0e-9c1a-3c7f2e1b8a90
    get:
      tags: [query]
      operationId: getSavedScript
      summary: Get a saved script
      responses:
        "200":
          description: The script.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScript"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [query]
      operationId: updateSavedScript
      summary: Update a saved script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedScriptRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedScript"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [query]
      operationId: deleteSavedScript
      summary: Delete a saved script
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  ##########################################################################
  # data browsing & editing (§7)
  ##########################################################################

  /api/connections/{connectionId}/keyspaces/{keyspace}/tables/{table}/rows:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/TableName"
    post:
      tags: [data]
      operationId: insertRow
      summary: Insert a row
      description: |
        Supports `USING TTL` and `USING TIMESTAMP`, and `IF NOT EXISTS` (LWT). Values are typed
        via `CqlValue` so `null` and *unset* are distinguishable — a distinction Cassandra cares
        about and most GUIs hide (plan §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowInsertRequest"
      responses:
        "200":
          description: Insert applied (check `applied` for LWT semantics).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/CqlError"
    patch:
      tags: [data]
      operationId: updateRow
      summary: Update a row
      description: |
        **The full primary key must be supplied in `primaryKey`.** Inline grid edits are refused
        for any result set that does not project the complete primary key, and the client is told
        exactly which key columns are missing (see `checkRowEditability`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowUpdateRequest"
      responses:
        "200":
          description: Update applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/IncompletePrimaryKey"
    delete:
      tags: [data]
      operationId: deleteRow
      summary: Delete a row (or specific columns of a row)
      description: |
        Requires the full primary key. `columns` may be supplied to delete individual
        (non-primary-key) columns rather than the whole row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowDeleteRequest"
      responses:
        "200":
          description: Delete applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/IncompletePrimaryKey"

  /api/connections/{connectionId}/keyspaces/{keyspace}/tables/{table}/rows/statements:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/TableName"
    post:
      tags: [data]
      operationId: generateRowStatements
      summary: Generate INSERT / UPDATE / DELETE for selected rows
      description: |
        Pure generation, no execution — output goes to the editor or the clipboard (plan §7).
        For `UPDATE` and `DELETE` the full primary key must be present in every row; otherwise the
        response is `422` naming the missing key columns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowStatementGenerationRequest"
      responses:
        "200":
          description: Generated statements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowStatementGenerationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/IncompletePrimaryKey"

  /api/connections/{connectionId}/keyspaces/{keyspace}/tables/{table}/rows/editability:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/TableName"
    post:
      tags: [data]
      operationId: checkRowEditability
      summary: Can this result set be edited in place?
      description: |
        Given the columns a result set projects, reports whether inline editing is permitted and,
        if not, **why** — the missing primary-key columns. The grid calls this once per result set
        and uses `reason` verbatim in the "read-only result" explanation (plan §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowEditabilityRequest"
      responses:
        "200":
          description: Editability verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowEditabilityResult"
        "404":
          $ref: "#/components/responses/NotFound"

  ##########################################################################
  # bulk jobs (§5.2 – §5.5)
  ##########################################################################

  /api/connections/{connectionId}/jobs/unload:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [bulk]
      operationId: createUnloadJob
      summary: Create an unload (export) job
      description: |
        Creates a `QUEUED` job that exports a table or query result to CSV / JSON / JSONL /
        Parquet / XML / XLSX, to a streaming download handle, a mounted volume path, or S3.

        `engine` selects the execution path:

        * `NATIVE` — the token-range parallel scan of plan §5.2 (oversplit + work-stealing,
          `unwrap()` applied to every range). Best for interactive and mid-size exports.
        * `DSBULK` — the embedded DSBulk runner of plan §5.3, executed in a **separate JVM
          process** for HOCON/classpath isolation, cancellation and memory capping.
        * `AUTO` *(default)* — the server routes by estimated row count and cluster capabilities.
          Clusters without token-range scan support (Amazon Keyspaces) always fall back to plain
          paging.

        `dsbulkSettings` is optional and fully sparse — every field is optional. Anything left
        unset is auto-derived (plan §5.3) and reported back in `Job.derivedSettings` with
        `auto: true` per entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnloadJobRequest"
      responses:
        "202":
          description: Job accepted and queued.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              example: /api/jobs/6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/NotConnected"
        "429":
          $ref: "#/components/responses/JobCapExceeded"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/jobs/load:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [bulk]
      operationId: createLoadJob
      summary: Create a load (import) job
      description: |
        Loads a previously uploaded file, a mounted path, or an S3 URL into a table via DSBulk.
        Mapping may be explicit (`dsbulkSettings.schema.mapping`) or inferred from headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadJobRequest"
      responses:
        "202":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/JobCapExceeded"

  /api/connections/{connectionId}/jobs/count:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [bulk]
      operationId: createCountJob
      summary: Create a count / statistics job
      description: |
        Runs the DSBulk `count` workflow (plan §5.4): total rows, per-replica, per-token-range and
        top-N largest partitions. On success the result is persisted and served by
        `getTableStatistics`, and is also used for pre-flight estimates on export jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountJobRequest"
      responses:
        "202":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/JobCapExceeded"

  /api/connections/{connectionId}/bulk/defaults:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [bulk]
      operationId: deriveBulkDefaults
      summary: Derive DSBulk defaults for a prospective job
      description: |
        Probes the cluster and returns every setting cassyx would apply, each marked with
        `auto: true` when derived and `auto: false` when it came from the caller's overrides
        (plan §5.3). This is what the UI renders as editable "auto" chips, with `rationale`
        as the tooltip explaining *why* the value was chosen.

        Derivations include `executor.maxPerSecond` (unthrottled for self-managed; server-side
        rate limiting left enabled on Astra), `executor.maxInFlight` / `engine.maxConcurrentQueries`
        (`nodes × 32` for unload, capped by client cores), `batch.mode`
        (`PARTITION_KEY` for load, `DISABLED` with no clustering key, batches of 1 for counters),
        `driver.basic.request.consistency` (`LOCAL_ONE` unload / `LOCAL_QUORUM` load, `LOCAL_ONE`
        for Keyspaces), `lz4` compression, `connector.csv.maxConcurrentFiles` = split count, and
        `schema.splits` = `nodes × cores × 8`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDefaultsRequest"
            examples:
              unload:
                summary: Defaults for an unload of demo.users
                value:
                  operation: UNLOAD
                  keyspace: demo
                  table: users
                  overrides:
                    batch:
                      maxBatchStatements: 64
      responses:
        "200":
          description: Derived settings with auto markers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivedSettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/NotConnected"

  /api/connections/{connectionId}/bulk/command-preview:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [bulk]
      operationId: previewBulkCommand
      summary: Preview the generated `dsbulk` invocation and HOCON file
      description: |
        Returns the exact command line and the generated per-job HOCON, copyable so the UI doubles
        as a DSBulk command builder for users who will run it elsewhere (plan §5.3). Secrets in
        the rendered output are masked (`password = ***`), and the HOCON written into the job's
        temp dir at run time is the same document with real values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCommandPreviewRequest"
      responses:
        "200":
          description: The generated command and configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCommandPreview"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/bulk/uploads:
    post:
      tags: [bulk]
      operationId: uploadBulkSourceFile
      summary: Upload a source file for a load or import job
      description: |
        Streams the file to the server's job staging area and returns a handle referenced by
        `LoadJobRequest.source.uploadId`. Large files are supported — the browser never holds the
        bytes in memory.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BulkSourceUpload"
      responses:
        "201":
          description: Upload staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpload"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/jobs:
    get:
      tags: [bulk]
      operationId: listJobs
      summary: List jobs
      parameters:
        - name: status
          in: query
          description: Filter by lifecycle state.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobStatus"
          style: form
          explode: false
        - name: type
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobType"
          style: form
          explode: false
        - name: connectionId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [bulk]
      operationId: getJob
      summary: Get one job
      description: |
        Polling fallback for clients that cannot consume SSE. `progress` here is the same payload
        delivered by the `progress` event on the SSE stream.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [bulk]
      operationId: deleteJob
      summary: Delete a finished job and its retained artifacts
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job is still `QUEUED` or `RUNNING` — cancel it first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [bulk]
      operationId: cancelJob
      summary: Cancel a queued or running job
      description: |
        For `DSBULK` jobs this kills the child JVM process; for `NATIVE` jobs it interrupts the
        work-stealing consumers. Cancellation is asynchronous — the job reaches `CANCELLED`
        shortly after this returns, and the transition is published on the SSE stream.
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job already reached a terminal state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/jobs/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [bulk]
      operationId: streamJobEvents
      summary: Server-Sent Events stream of job progress
      description: |
        A `text/event-stream` that stays open until the job reaches a terminal state, at which
        point the server emits a final `completed` event and closes the stream.

        **Named events and their `data` payloads:**

        | `event:` | `data:` schema | Cadence |
        | --- | --- | --- |
        | `status`   | `JobStatusEvent`   | on every lifecycle transition |
        | `progress` | `JobProgressEvent` | throttled, ~1/s while `RUNNING` |
        | `log`      | `JobLogEvent`      | per retained log line (tailed from the DSBulk log dir) |
        | `completed`| `JobCompletedEvent`| exactly once, last event before close |
        | `error`    | `JobErrorEvent`    | on a failure that does not terminate the stream |

        Each message carries a monotonically increasing `id:`; reconnecting clients send
        `Last-Event-ID` to resume without gaps. A `: keep-alive` comment is emitted every 15s so
        intermediary proxies do not drop the connection.

        Example frames:

        ```
        id: 41
        event: progress
        data: {"jobId":"6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44","rowsProcessed":4210000,
        data: "totalRowsEstimate":10000000,"percent":42.1,"rowsPerSecond":186420,
        data: "bytesWritten":901234567,"elapsedMillis":22580,"etaMillis":31100,
        data: "splitsCompleted":4103,"splitsTotal":10000,"failures":0}

        id: 42
        event: completed
        data: {"jobId":"6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44","status":"SUCCEEDED",
        data: "rowsProcessed":10000000,"durationMillis":53640,
        data: "artifact":{"artifactId":"a1","fileName":"users.csv","sizeBytes":2147483648,
        data: "contentType":"text/csv","downloadUrl":"/api/jobs/6c8f.../artifact"}}
        ```
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume the stream after this event id.
          schema:
            type: string
          example: "41"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/JobEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [bulk]
      operationId: getJobLogs
      summary: Retained job logs
      description: |
        For DSBulk jobs this is the tailed contents of the runner's log directory, including
        `operation.log` and any `*-errors.log` mapping/connector rejections.
      parameters:
        - name: tail
          in: query
          description: Return only the last N lines.
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1000
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/LogLevel"
      responses:
        "200":
          description: Log lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogPage"
            text/plain:
              schema:
                type: string
              example: |
                2026-08-17 12:00:03 INFO  Operation UNLOAD_20260817-120003-123456 started.
                2026-08-17 12:00:53 INFO  Operation UNLOAD_20260817-120003-123456 completed successfully in 53 seconds.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{jobId}/artifact:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [bulk]
      operationId: downloadJobArtifact
      summary: Download the job's output artifact (streaming)
      description: |
        Streams the artifact with `StreamingResponseBody` — bulk data never round-trips through
        the browser's memory (plan §2). Supports `Range` requests for resumable downloads.
        A directory-tree artifact (multi-file unload, CQL dump to a tree) is streamed as a zip.
      parameters:
        - name: artifactId
          in: query
          description: Select one artifact when the job produced several; defaults to the primary.
          schema:
            type: string
          example: a1
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: The artifact stream.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="users.csv"
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content for a `Range` request.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such job, or the job produced no artifact.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The job has not reached `SUCCEEDED` yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/job-templates:
    get:
      tags: [bulk]
      operationId: listJobTemplates
      summary: List reusable job templates
      description: Persisted DSBulk setting overrides, reusable across jobs (plan §5.3).
      parameters:
        - name: operation
          in: query
          schema:
            $ref: "#/components/schemas/BulkOperation"
      responses:
        "200":
          description: Templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobTemplate"
        "402":
          $ref: "#/components/responses/PaymentRequired"
    post:
      tags: [bulk]
      operationId: createJobTemplate
      summary: Create a job template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTemplateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/job-templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 5d1f7b22-0c33-4c9a-8b1e-9a7d6c5f4e30
    get:
      tags: [bulk]
      operationId: getJobTemplate
      summary: Get a job template
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTemplate"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [bulk]
      operationId: updateJobTemplate
      summary: Update a job template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTemplateRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTemplate"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [bulk]
      operationId: deleteJobTemplate
      summary: Delete a job template
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  ##########################################################################
  # vector / SAI / ANN (§6)
  ##########################################################################

  /api/connections/{connectionId}/keyspaces/{keyspace}/tables/{table}/vector-columns:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/TableName"
    get:
      tags: [vector]
      operationId: listVectorColumns
      summary: List `vector<float, N>` columns on a table
      description: |
        Each entry reports its dimension and the SAI index backing it, if any — that is what the
        grid needs to render a vector as a sparkline + dimension badge instead of 1536 floats.
      responses:
        "200":
          description: Vector columns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VectorColumn"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"
    post:
      tags: [vector]
      operationId: addVectorColumn
      summary: Add a `vector<float, N>` column
      description: |
        Requires `java-driver-core` 4.19.0 for correct vector DDL (CASSJAVA-2) and the `vector`
        capability (C* 5.x or Astra).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VectorColumnDefinition"
      responses:
        "201":
          description: Column added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/keyspaces/{keyspace}/tables/{table}/sai-indexes:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/TableName"
    get:
      tags: [vector]
      operationId: listSaiIndexes
      summary: List SAI indexes on a table
      description: Covers both vector and scalar SAI indexes, with the full options surface.
      responses:
        "200":
          description: SAI indexes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaiIndex"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"
    post:
      tags: [vector]
      operationId: createSaiIndex
      summary: Create an SAI index
      description: |
        On a vector column, `similarityFunction` (`cosine` | `dot_product` | `euclidean`) and
        `sourceModel` are emitted into `WITH OPTIONS`. On a scalar column, the analyzer /
        normalization / case-sensitivity options apply instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaiIndexDefinition"
      responses:
        "201":
          description: Index created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/keyspaces/{keyspace}/tables/{table}/sai-indexes/{index}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
      - $ref: "#/components/parameters/Keyspace"
      - $ref: "#/components/parameters/TableName"
      - $ref: "#/components/parameters/IndexName"
    get:
      tags: [vector]
      operationId: getSaiIndexStatus
      summary: SAI index status / build progress
      responses:
        "200":
          description: Index status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaiIndexStatus"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [vector]
      operationId: alterSaiIndex
      summary: Alter an SAI index's options
      description: |
        Cassandra has no `ALTER INDEX`; the server generates a drop-and-recreate pair and returns
        both statements for preview. Nothing is executed until the user confirms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaiIndexDefinition"
      responses:
        "200":
          description: Index recreated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [vector]
      operationId: dropSaiIndex
      summary: Drop an SAI index
      parameters:
        - $ref: "#/components/parameters/IfExists"
      responses:
        "200":
          description: Index dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdlExecutionResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/connections/{connectionId}/vector/ann-query:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [vector]
      operationId: buildAnnQuery
      summary: Build an ANN query (generate only)
      description: |
        Generates `SELECT … [similarity projections] FROM ks.tbl [WHERE <sai predicates>]
        ORDER BY <col> ANN OF [...] LIMIT k` (plan §6). Hybrid queries — SAI predicates plus ANN
        in one statement — are supported by supplying `predicates`.

        The query vector may be supplied literally (`queryVector`), by reference to an existing
        row (`queryVectorFromRow`), or by upload handle. Nothing is executed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnQueryRequest"
      responses:
        "200":
          description: The generated, editable statement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnQueryPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/vector/ann-query/execute:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [vector]
      operationId: executeAnnQuery
      summary: Build and execute an ANN query
      description: |
        Same generation as `buildAnnQuery`, then executes it. The result is a normal
        `QueryResult`, so the grid, paging and export paths are shared; similarity projections
        appear as ordinary sortable columns flagged in `QueryResult.similarityColumns`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnQueryRequest"
      responses:
        "200":
          description: ANN results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/CqlError"
        "501":
          $ref: "#/components/responses/CapabilityUnsupported"

  /api/connections/{connectionId}/vector/similarity:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [vector]
      operationId: computeSimilarity
      summary: Compare two vectors (inspector panel)
      description: |
        Client-visible arithmetic for the expandable vector inspector: magnitude of each vector
        and their similarity under each requested function. Computed server-side so the browser
        never handles large float arrays, and so results match the CQL
        `similarity_cosine` / `similarity_dot_product` / `similarity_euclidean` functions exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarityRequest"
      responses:
        "200":
          description: Similarity scores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarityResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  ##########################################################################
  # migration & advanced data operations (§8)
  ##########################################################################

  /api/connections/{connectionId}/migrate/dump:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: createCqlDumpJob
      summary: Dump a keyspace (schema DDL and/or data)
      description: |
        Backs up to a single file or a directory tree, with per-table selection and optional
        compression. Built on the native token-range unload engine (plan §5.2, §8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CqlDumpRequest"
      responses:
        "202":
          description: Dump job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/JobCapExceeded"

  /api/connections/{connectionId}/migrate/restore:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: createRestoreJob
      summary: Restore a previously created CQL dump
      description: Replays schema then data, with progress on the standard job SSE stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CqlRestoreRequest"
      responses:
        "202":
          description: Restore job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/migrate/keyspace-copy:
    post:
      tags: [migrate]
      operationId: createKeyspaceCopyJob
      summary: Copy a keyspace between two clusters
      description: |
        Streams cluster→cluster with schema recreation, replication-factor remapping (source DC
        names rarely match the target) and table selection. **Never buffers to disk** (plan §8).
        Both `sourceConnectionId` and `targetConnectionId` must have live sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyspaceCopyRequest"
      responses:
        "202":
          description: Copy job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/NotConnected"

  /api/connections/{connectionId}/migrate/duplicate-table:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: createDuplicateTableJob
      summary: Duplicate a table within or across keyspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateTableRequest"
      responses:
        "202":
          description: Duplicate job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/connections/{connectionId}/migrate/import/file/preview:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: previewFileImport
      summary: Dry-run preview of a file import
      description: |
        Sniffs the first N rows of a staged upload (CSV / JSON / Excel), infers column types,
        proposes a column mapping against the target table and reports per-row conversion errors —
        all **before** anything is written (plan §8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileImportPreviewRequest"
      responses:
        "200":
          description: Inferred mapping and sample rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/migrate/import/file:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: createFileImportJob
      summary: Import a staged CSV / JSON / Excel file into a table
      description: Backed by DSBulk load. Upload the file first with `uploadBulkSourceFile`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileImportRequest"
      responses:
        "202":
          description: Import job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/migrate/import/jdbc/inspect:
    post:
      tags: [migrate]
      operationId: inspectJdbcSource
      summary: Inspect a MySQL / SQL Server source and suggest a Cassandra schema
      description: |
        Connects over JDBC, reads the source table's columns, primary key and indexes, and
        proposes a CQL table definition — partition and clustering keys derived from the source
        primary key (plan §8). The JDBC password is write-only and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JdbcInspectRequest"
      responses:
        "200":
          description: Source schema plus the suggested CQL definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JdbcInspectResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: The JDBC source could not be reached or authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/connections/{connectionId}/migrate/import/jdbc:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: createJdbcImportJob
      summary: Import from MySQL / SQL Server via JDBC
      description: JDBC → staged extract → DSBulk load, as one job with unified progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JdbcImportRequest"
      responses:
        "202":
          description: Import job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/connections/{connectionId}/migrate/export:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [migrate]
      operationId: createResultExportJob
      summary: Export a grid result or a full table
      description: |
        `source: RESULT_HANDLE` exports exactly what the grid is showing (CSV / JSON / XML /
        XLSX); `source: TABLE` or `source: QUERY` runs a full export through the native engine
        and therefore is **not** bounded by the current page. Always returns a job — the browser
        receives a progress stream and a download handle, never the data itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultExportRequest"
      responses:
        "202":
          description: Export job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ResultHandleExpired"

components:

  securitySchemes:
    licenseKey:
      type: apiKey
      in: header
      name: X-Cassyx-License
      description: |
        The activated Ed25519-signed license key. In the default single-user self-hosted
        deployment the server reads the key from configuration and this header is optional; it
        exists so multi-tenant or proxied deployments can carry it per request. When
        `cassyx.license.enforce=false` (the documented bypass flag, plan §9.2) the scheme is not
        enforced at all.

  parameters:

    ConnectionId:
      name: connectionId
      in: path
      required: true
      description: Identifier of a saved connection.
      schema:
        type: string
        format: uuid
      example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11

    Keyspace:
      name: keyspace
      in: path
      required: true
      description: Keyspace name, case-sensitive as stored in the schema.
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: demo

    TableName:
      name: table
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: users

    ColumnName:
      name: column
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: email

    IndexName:
      name: index
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: users_email_idx

    ViewName:
      name: view
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: users_by_email

    TypeName:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: address

    RoleName:
      name: role
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CqlIdentifier"
      example: app_reader

    FunctionSignature:
      name: functionSignature
      in: path
      required: true
      description: |
        UDF signature — name plus parenthesised argument types, since CQL functions are
        overloadable. URL-encode it.
      schema:
        type: string
      example: "avg_state(double,int)"

    AggregateSignature:
      name: aggregateSignature
      in: path
      required: true
      description: UDA signature — name plus parenthesised argument types. URL-encode it.
      schema:
        type: string
      example: "average(double)"

    ResultHandle:
      name: resultHandle
      in: path
      required: true
      description: |
        Server-side handle for a cached result set and its paging state. Opaque; expires after an
        idle TTL (default 10 minutes).
      schema:
        type: string
      example: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW

    QueryId:
      name: queryId
      in: path
      required: true
      description: Identifier of a single query execution, used for cancellation and tracing.
      schema:
        type: string
        format: uuid
      example: 2c9f6a7d-4b3e-4c9d-9f21-0b7a1e5d6c33

    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44

    AstraDatabaseId:
      name: databaseId
      in: path
      required: true
      description: Astra database UUID, as returned by `listAstraDatabases`.
      schema:
        type: string
        format: uuid
      example: f9a1b3c4-1111-2222-3333-444455556666

    AstraTokenHeader:
      name: X-Astra-Token
      in: header
      required: true
      description: |
        Astra application token (`AstraCS:…`). Sent as a **header, never a query parameter**, so
        it cannot land in access logs, proxy logs, browser history or `Referer` headers. It is
        not persisted by DevOps-API proxy calls and never appears in any response body, including
        error responses.
      schema:
        type: string
        pattern: "^AstraCS:.+$"
        writeOnly: true
      example: "AstraCS:REDACTED"

    IfExists:
      name: ifExists
      in: query
      required: false
      description: Emit `IF EXISTS` so dropping a missing object is not an error.
      schema:
        type: boolean
        default: true

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:

    ClientError:
      description: |
        Any client-side error not otherwise enumerated for this operation — malformed parameters,
        an unsupported media type, or a rate limit. Always an RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/bad-request
            title: Bad request
            status: 400
            detail: The `limit` parameter must be between 1 and 500.
            instance: /api/jobs

    BadRequest:
      description: The request body or parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/validation-failed
            title: Request validation failed
            status: 400
            detail: 1 field is invalid.
            instance: /api/connections
            errors:
              - field: contactPoints
                message: at least one contact point is required

    NotFound:
      description: The referenced resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/not-found
            title: Not found
            status: 404
            detail: No table demo.userz in this cluster.
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/keyspaces/demo/tables/userz

    Conflict:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/conflict
            title: Already exists
            status: 409
            detail: Table demo.users already exists.
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/keyspaces/demo/tables

    NotConnected:
      description: No live session for this connection — call `connectConnection` first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/not-connected
            title: Not connected
            status: 409
            detail: Connection "prod-eu" has no live session. Connect it first.
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/keyspaces

    CqlError:
      description: The cluster rejected the statement.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/cql-error
            title: CQL execution failed
            status: 422
            detail: "line 1:21 no viable alternative at input 'FORM' (SELECT * [FORM]...)"
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/query
            cql: SELECT * FORM demo.users
            cqlErrorClass: com.datastax.oss.driver.api.core.servererrors.SyntaxError

    IncompletePrimaryKey:
      description: |
        The operation needs the complete primary key and it was not supplied. `missingKeyColumns`
        names exactly what is missing so the UI can explain *why* the row is not editable
        (plan §7).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/incomplete-primary-key
            title: Incomplete primary key
            status: 422
            detail: This result set does not project the full primary key, so rows cannot be
              edited in place. Add the missing columns to the SELECT clause.
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/keyspaces/demo/tables/users/rows
            missingKeyColumns: [bucket, created_at]

    ResultHandleExpired:
      description: The result handle is unknown or has expired — re-run the query.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/result-handle-expired
            title: Result set expired
            status: 404
            detail: Result handle rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW expired after 10 minutes idle.
            instance: /api/query/results/rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW/next-page

    CapabilityUnsupported:
      description: |
        The target cluster does not support this feature. The UI hides such features behind an
        explanatory tooltip; this response exists so a direct API call still fails legibly
        (plan §7.1).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/capability-unsupported
            title: Unsupported on this cluster
            status: 501
            detail: SAI indexes require Cassandra 5.x, DSE 6.8+ or Astra. This cluster reports
              Cassandra 4.1.3.
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/keyspaces/demo/tables/products/sai-indexes
            capability: sai

    PaymentRequired:
      description: |
        No valid license. Returned by every gated path when `cassyx.license.enforce=true` and no
        verified license is present.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/license-required
            title: License required
            status: 402
            detail: cassyx is unlicensed. Activate a license key or set CASSYX_LICENSE_ENFORCE=false.
            instance: /api/connections

    PayloadTooLarge:
      description: The uploaded file exceeds the configured maximum size.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    JobCapExceeded:
      description: The configured concurrent-job cap is reached; retry once a job finishes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/job-cap-exceeded
            title: Too many concurrent jobs
            status: 429
            detail: 4 of 4 concurrent job slots are in use.
            instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/jobs/unload

    AstraUnreachable:
      description: |
        `api.astra.datastax.com` could not be reached. Deliberately not retried — the message
        points the user at manual bundle upload, because many self-hosted installs have no egress.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cassyx.dev/problems/astra-unreachable
            title: Astra DevOps API unreachable
            status: 502
            detail: Could not reach api.astra.datastax.com (connect timed out). If this network
              has no egress, use scbMode UPLOAD or PATH instead.
            instance: /api/astra/databases

    ServiceUnavailable:
      description: The service is starting up or a required dependency is down.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    ########################################################################
    # common
    ########################################################################

    Problem:
      type: object
      title: Problem
      description: |
        RFC 9457 problem details. **Every** error response in this API uses this schema with the
        `application/problem+json` media type. Extension members (`errors`, `cql`,
        `missingKeyColumns`, `capability`, `jobId`, …) are optional and documented on the
        responses that use them. No extension member ever carries a secret value.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem-type URI. Clients switch on this, not on `title`.
          default: about:blank
          example: https://cassyx.dev/problems/cql-error
        title:
          type: string
          example: CQL execution failed
        status:
          type: integer
          minimum: 100
          maximum: 599
          example: 422
        detail:
          type: string
          description: Human-readable explanation, safe to show in the UI.
          example: "line 1:21 no viable alternative at input 'FORM'"
        instance:
          type: string
          format: uri-reference
          example: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/query
        traceId:
          type: string
          description: Correlates with the server log entry.
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        errors:
          type: array
          description: Per-field validation failures.
          items:
            $ref: "#/components/schemas/FieldError"
        cql:
          type: string
          description: The offending statement, when the failure came from CQL execution.
          example: SELECT * FORM demo.users
        cqlErrorClass:
          type: string
          description: Driver exception class, for precise client-side handling.
          example: com.datastax.oss.driver.api.core.servererrors.SyntaxError
        missingKeyColumns:
          type: array
          description: Primary-key columns absent from the request or projection.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [bucket, created_at]
        capability:
          allOf:
            - $ref: "#/components/schemas/CapabilityName"
          description: The capability the target cluster lacks.
        jobId:
          type: string
          format: uuid
          description: Present when the failure relates to a job.
      example:
        type: https://cassyx.dev/problems/not-connected
        title: Not connected
        status: 409
        detail: Connection "prod-eu" has no live session. Connect it first.
        instance: /api/connections/8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11/keyspaces

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: contactPoints
        message:
          type: string
          example: at least one contact point is required
        rejectedValue:
          description: Echoed only for non-secret fields; always `null` for secrets.
          example: []

    CqlIdentifier:
      type: string
      title: CqlIdentifier
      description: |
        A CQL identifier as stored in the schema. Unquoted identifiers are lower-cased by
        Cassandra; case-sensitive identifiers are transported here **without** surrounding double
        quotes and re-quoted by the server when generating CQL.
      minLength: 1
      maxLength: 48
      example: users

    ServiceHealth:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
          example: UP
        version:
          type: string
          example: 1.0.0
        buildTimestamp:
          type: string
          format: date-time
          example: "2026-08-17T09:14:02Z"
        driverVersion:
          type: string
          example: 4.19.0
        dsbulkVersion:
          type: string
          example: 1.11.1
        liveSessions:
          type: integer
          example: 2
        runningJobs:
          type: integer
          example: 1
        licenseEnforced:
          type: boolean
          description: Mirrors `cassyx.license.enforce`; `false` means the bypass flag is active.
          example: true

    ########################################################################
    # licensing & billing (§9)
    ########################################################################

    LicenseStatus:
      type: object
      description: |
        The verified license. Never contains the private key or the raw signature material beyond
        what the client already supplied.
      required: [licensed, edition, enforce, bypass]
      properties:
        licensed:
          type: boolean
          example: true
        enforce:
          type: boolean
          description: Value of `cassyx.license.enforce`.
          example: true
        bypass:
          type: boolean
          description: |
            `true` when enforcement is disabled and a synthetic license is in effect. The UI must
            keep the bypass banner visible so a bypassed instance is never mistaken for a paid one.
          example: false
        edition:
          type: string
          description: |
            `standard` (paid, perpetual), `trial` (time-limited, carries `expires`), or
            `unlicensed-bypass` when `bypass` is `true`.
          enum: [standard, trial, unlicensed-bypass, none]
          example: standard
        state:
          type: string
          description: |
            Why the license is (in)valid. Clients must branch on this rather than on `licensed`
            alone: `EXPIRED`, `ABSENT` and `UPGRADE_REQUIRED` should surface the purchase flow,
            while `INVALID_SIGNATURE` and `MALFORMED` are errors.
          enum:
            [VALID, BYPASS, EXPIRED, ABSENT, MALFORMED, INVALID_SIGNATURE, UPGRADE_REQUIRED]
          example: VALID
        expires:
          type: [string, "null"]
          format: date
          description: |
            Last day of validity, **inclusive** — a license with `expires: 2026-09-01` still works
            all day on 1 September and lapses on the 2nd. Absent/null on perpetual licenses.
          example: "2026-09-01"
        daysRemaining:
          type: [integer, "null"]
          minimum: 0
          description: |
            Whole days left including today; `0` on the final day. Null when perpetual. Drives the
            trial countdown in the UI.
          example: 14
        trial:
          type: boolean
          description: Convenience flag; equivalent to `edition == "trial"`.
          example: false
        scope:
          type: [integer, "null"]
          minimum: 1
          description: |
            Purchased major version. The license covers that major and every earlier one; a newer
            major yields `state: UPGRADE_REQUIRED`. Null means unrestricted — which is what every
            key minted before version scoping carries, so those keep working everywhere.
          example: 1
        licenseId:
          type: string
          pattern: "^CSX(-[A-Z0-9]{4}){3}$"
          example: CSX-4H7K-9QP2-M1XR
        email:
          type: string
          format: email
          example: ops@example.com
        name:
          type: string
          example: Example GmbH
        issued:
          type: string
          format: date
          example: "2026-08-17"
        seats:
          type: integer
          minimum: 1
          example: 1
        payloadVersion:
          type: integer
          description: The `ver` field of the signed payload.
          example: 1
        message:
          type: string
          description: Human-readable state, shown in the activation screen.
          example: Licensed to Example GmbH.

    TrialRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Where the trial key is sent; also the identity a trial is issued against.
          example: ops@example.com
        name:
          type: string
          description: Optional, used only to personalise the key and the checkout prefill.
          example: Example GmbH
      example:
        email: ops@example.com
        name: Example GmbH

    LicenseActivationRequest:
      type: object
      required: [licenseKey]
      properties:
        licenseKey:
          type: string
          writeOnly: true
          description: |
            Base64url payload and detached Ed25519 signature, dot-separated —
            `<base64url(payload)>.<base64url(signature)>`.
          example: eyJsaWMiOiJDU1gtNEg3Sy05UVAyLU0xWFIiLCJlbWFpbCI6Im9wc0BleGFtcGxlLmNvbSJ9.MEUCIQD_PLACEHOLDER_SIGNATURE
      example:
        licenseKey: eyJsaWMiOiJDU1gtNEg3Sy05UVAyLU0xWFIifQ.MEUCIQD_PLACEHOLDER_SIGNATURE

    CheckoutSessionRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Prefills Checkout and is the address the minted license is emailed to.
          example: ops@example.com
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        successUrl:
          type: string
          format: uri
          description: |
            Overrides `cassyx.billing.success-url`. The server appends Stripe's
            `session_id={CHECKOUT_SESSION_ID}` template parameter, so do not include it here.
            Fulfillment never depends on this page being reached — it is webhook-driven.
          example: https://cassyx.example.com/activate
        cancelUrl:
          type: string
          format: uri
          example: https://cassyx.example.com/pricing
        metadata:
          type: object
          additionalProperties:
            type: string
          example:
            deployment: self-hosted

    CheckoutSessionResponse:
      type: object
      required: [sessionId, url]
      properties:
        sessionId:
          type: string
          example: cs_test_a1PLACEHOLDER0000000000
        url:
          type: string
          format: uri
          description: Hosted Checkout URL to redirect the browser to.
          example: https://checkout.stripe.com/c/pay/cs_test_a1PLACEHOLDER0000000000
        publishableKey:
          type: string
          description: Publishable key only. The secret/restricted key never leaves the server.
          example: pk_test_PLACEHOLDER
        expiresAt:
          type: string
          format: date-time
          example: "2026-08-18T09:14:02Z"

    StripeWebhookEnvelope:
      type: object
      description: |
        Minimal shape of a Stripe event. The body is verified byte-for-byte before parsing, so
        this schema is documentation for readers, not a validation contract — unknown properties
        are expected and preserved.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Used for idempotency — a repeated `id` is acknowledged without re-fulfilling.
          example: evt_1PLACEHOLDER
        type:
          type: string
          example: checkout.session.completed
        created:
          type: integer
          format: int64
          example: 1755388800
        data:
          type: object
          additionalProperties: true

    WebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          example: true
        eventId:
          type: string
          example: evt_1PLACEHOLDER
        handled:
          type: boolean
          description: '`false` for event types this service deliberately ignores.'
          example: true
        duplicate:
          type: boolean
          description: '`true` when this `event.id` was already processed (idempotent replay).'
          example: false
        action:
          type: string
          enum: [FULFILLED, IGNORED_UNPAID, MARKED_FAILED, IGNORED_UNHANDLED_TYPE, DUPLICATE]
          example: FULFILLED

    ########################################################################
    # connections (§3, §3.1)
    ########################################################################

    ConnectionMode:
      type: string
      description: |
        * `CASSANDRA` / `DSE` — contact points, local datacenter, credentials.
        * `ASTRA` — Astra token plus a secure connect bundle acquired per `scbMode`.
        * `ADVANCED` — raw `application.conf` (HOCON) passthrough for exotic setups.
      enum: [CASSANDRA, DSE, ASTRA, ADVANCED]
      example: CASSANDRA

    ScbMode:
      type: string
      title: ScbMode
      description: |
        How the Astra secure connect bundle is acquired (plan §3).

        | Mode | Use |
        | --- | --- |
        | `AUTO_DOWNLOAD` *(default)* | normal use — token only, fetched via the DevOps API |
        | `UPLOAD` | air-gapped / restricted egress / hand-issued bundle |
        | `PATH` | Docker or K8s deployments mounting the bundle as a volume or secret |
      enum: [AUTO_DOWNLOAD, UPLOAD, PATH]
      default: AUTO_DOWNLOAD
      example: AUTO_DOWNLOAD

    ScbType:
      type: string
      title: ScbType
      description: |
        Which bundle **variant** to take from a datacenter entry. Exactly two values.

        `region` is deliberately **not** a value here: region selection is a separate, orthogonal
        input (`AstraBundleDownloadRequest.region`). The DataStax reference implementation
        documents a three-valued type but its `switch` handles only `default` and `custom`, so
        passing `region` there silently falls through and logs "Unknown SCB type". cassyx models
        the two axes separately and rejects anything outside this enum with a clear message
        (plan §3.1).

        Absent ⇒ `default`.
      enum: [default, custom]
      default: default
      example: default

    ContactPoint:
      type: object
      required: [host]
      properties:
        host:
          type: string
          example: 127.0.0.1
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9042
          example: 9042

    SshTunnelConfig:
      type: object
      description: |
        Optional local port forward established **before** the `CqlSession` is built (JSch/sshd).
        Either `password` or `privateKey` is required; both are write-only.
      required: [enabled, host, username]
      properties:
        enabled:
          type: boolean
          default: false
          example: true
        host:
          type: string
          example: bastion.example.com
        port:
          type: integer
          default: 22
          example: 22
        username:
          type: string
          example: ec2-user
        password:
          type: string
          writeOnly: true
          description: Encrypted at rest with AES-256-GCM. Never returned.
        privateKey:
          type: string
          writeOnly: true
          description: PEM-encoded private key. Encrypted at rest. Never returned.
        privateKeyPassphrase:
          type: string
          writeOnly: true
        localPort:
          type: integer
          description: Local forward port; `0` or absent lets the server pick a free one.
          example: 0
        remoteHost:
          type: string
          description: Target host as seen from the bastion.
          example: 10.0.1.20
        remotePort:
          type: integer
          default: 9042
          example: 9042
        strictHostKeyChecking:
          type: boolean
          default: true
        knownHostsEntry:
          type: string
          description: Pinned host key. Required when `strictHostKeyChecking` is `true`.
          example: "bastion.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPLACEHOLDER"

    SshTunnelInfo:
      type: object
      description: Response-side view of the SSH tunnel — no secret material.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          example: true
        host:
          type: string
          example: bastion.example.com
        port:
          type: integer
          example: 22
        username:
          type: string
          example: ec2-user
        hasPassword:
          type: boolean
          example: false
        hasPrivateKey:
          type: boolean
          example: true
        remoteHost:
          type: string
          example: 10.0.1.20
        remotePort:
          type: integer
          example: 9042
        strictHostKeyChecking:
          type: boolean
          example: true

    SslConfig:
      type: object
      description: |
        SSL / mTLS settings. The truststore and keystore themselves are uploaded through their own
        endpoints; only their passwords live here, and they are write-only.
      properties:
        enabled:
          type: boolean
          default: false
          example: true
        hostnameValidation:
          type: boolean
          default: true
          example: true
        truststorePassword:
          type: string
          writeOnly: true
        keystorePassword:
          type: string
          writeOnly: true
        cipherSuites:
          type: array
          items:
            type: string
          example: [TLS_AES_256_GCM_SHA384]

    SslInfo:
      type: object
      description: Response-side view of the SSL configuration — presence flags only.
      properties:
        enabled:
          type: boolean
          example: true
        hostnameValidation:
          type: boolean
          example: true
        hasTruststore:
          type: boolean
          example: true
        truststoreFileName:
          type: string
          example: truststore.jks
        hasTruststorePassword:
          type: boolean
          example: true
        hasKeystore:
          type: boolean
          example: false
        keystoreFileName:
          type: [string, "null"]
          example: null
        hasKeystorePassword:
          type: boolean
          example: false
        cipherSuites:
          type: array
          items:
            type: string

    AstraSettings:
      type: object
      description: |
        Astra-specific settings (plan §3, §3.1). The token is **write-only** and appears in no
        response schema; `ConnectionResponse.astra` reports `hasAstraToken` instead.
      required: [scbMode]
      properties:
        astraToken:
          type: string
          writeOnly: true
          pattern: "^AstraCS:.+$"
          description: |
            Full-privilege Astra application token. Encrypted at rest with AES-256-GCM, masked in
            the UI, never logged — including on DevOps API error paths, which is exactly where
            tokens usually leak.
          example: "AstraCS:REDACTED"
        scbMode:
          $ref: "#/components/schemas/ScbMode"
        databaseId:
          type: string
          format: uuid
          description: Required for `AUTO_DOWNLOAD`. Chosen from the database picker, not typed.
          example: f9a1b3c4-1111-2222-3333-444455556666
        region:
          type: string
          description: |
            Optional datacenter region, matched case-insensitively against the
            `secureBundleURL` response. Absent ⇒ the first datacenter is used. Orthogonal to
            `scbType`.
          example: us-east1
        scbType:
          $ref: "#/components/schemas/ScbType"
        domain:
          type: string
          description: |
            Custom bundle domain. **Required when and only when `scbType` is `custom`**; rejected
            otherwise.
          example: cassandra.example.com
        scbPath:
          type: string
          description: |
            Required for `PATH` mode. Resolved **on the backend host**, so the file must be
            visible to the *server* container, not the user's laptop.

            The path is resolved against the allow-list root `CASSYX_SCB_PATH_ROOT`
            (default `/etc/cassyx/scb`); any path that escapes that root after canonicalization —
            including via `..`, symlinks or absolute paths outside it — is rejected with `400`.
            An unrestricted server-side path parameter is an arbitrary-file-read primitive, so
            this constraint is part of the contract, not merely an implementation detail.

            The file is validated as a readable zip containing the expected bundle entries before
            any connection attempt, so a wrong path fails with a clear message rather than an
            opaque TLS error.
          example: /etc/cassyx/scb/secure-connect-prod.zip
      example:
        astraToken: "AstraCS:REDACTED"
        scbMode: AUTO_DOWNLOAD
        databaseId: f9a1b3c4-1111-2222-3333-444455556666
        region: us-east1
        scbType: default

    AstraInfo:
      type: object
      description: Response-side view of the Astra settings — never contains the token.
      required: [scbMode, hasAstraToken]
      properties:
        hasAstraToken:
          type: boolean
          example: true
        scbMode:
          $ref: "#/components/schemas/ScbMode"
        databaseId:
          type: string
          format: uuid
          example: f9a1b3c4-1111-2222-3333-444455556666
        databaseName:
          type: string
          example: prod-eu
        region:
          type: string
          example: us-east1
        scbType:
          $ref: "#/components/schemas/ScbType"
        domain:
          type: [string, "null"]
          example: null
        scbPath:
          type: [string, "null"]
          description: Server-side path, only populated in `PATH` mode.
          example: null
        secureConnectBundle:
          oneOf:
            - $ref: "#/components/schemas/SecureConnectBundleInfo"
            - type: "null"
          description: Metadata about the stored bundle, or `null` if none is stored yet.

    SecureConnectBundleInfo:
      type: object
      description: |
        Metadata about the stored secure connect bundle. The bundle bytes are stored encrypted in
        H2 and are **never** returned by the API; they are materialized to a session-scoped temp
        file at connect time and the temp path is never exposed.
      required: [fileName, sizeBytes, storedAt, source]
      properties:
        fileName:
          type: string
          example: secure-connect-prod-eu.zip
        sizeBytes:
          type: integer
          format: int64
          example: 12483
        sha256:
          type: string
          description: Integrity digest, useful for spotting a rotated bundle.
          example: 9f2c7d1e4b6a8c0f3e5d7b9a1c3e5f7092a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2
        storedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:22:14Z"
        source:
          type: string
          enum: [AUTO_DOWNLOAD, UPLOAD, PATH]
          example: AUTO_DOWNLOAD
        region:
          type: string
          example: us-east1
        scbType:
          $ref: "#/components/schemas/ScbType"
        domain:
          type: [string, "null"]
          example: null
        cacheKey:
          type: string
          description: |
            Cache identity — `(databaseId, region, scbType, domain)`. Astra rotates bundles, so an
            explicit re-download is offered rather than letting a stale bundle surface as a
            confusing TLS failure.
          example: f9a1b3c4-1111-2222-3333-444455556666|us-east1|default|
        validated:
          type: boolean
          description: '`true` once the zip has been verified to contain the expected entries.'
          example: true

    AstraDatabase:
      type: object
      description: One entry of the Astra database picker (`GET /v2/databases`).
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
          example: f9a1b3c4-1111-2222-3333-444455556666
        name:
          type: string
          example: prod-eu
        status:
          type: string
          description: Astra lifecycle status; only `ACTIVE` databases can be connected to.
          enum: [ACTIVE, PENDING, INITIALIZING, HIBERNATED, PARKED, MAINTENANCE, TERMINATING, TERMINATED, ERROR, UNKNOWN]
          example: ACTIVE
        cloudProvider:
          type: string
          enum: [AWS, GCP, AZURE, UNKNOWN]
          example: GCP
        regions:
          type: array
          description: Regions this database is deployed in — populates the region dropdown.
          items:
            type: string
          example: [us-east1, europe-west1]
        defaultKeyspace:
          type: string
          example: demo
        keyspaces:
          type: array
          items:
            type: string
          example: [demo, analytics]
      example:
        id: f9a1b3c4-1111-2222-3333-444455556666
        name: prod-eu
        status: ACTIVE
        cloudProvider: GCP
        regions: [us-east1, europe-west1]
        defaultKeyspace: demo
        keyspaces: [demo, analytics]

    AstraBundleDatacenter:
      type: object
      description: |
        One element of the `POST /v2/databases/{id}/secureBundleURL?all=true` response array —
        one node per datacenter. `downloadURL` is the `default` bundle for that region;
        `customDomainBundles` carries the `custom` variants.

        Download URLs are short-lived pre-signed HTTPS URLs and require **no** authorization
        header. They are surfaced so the UI can display what exists; the actual download is
        performed server-side by `downloadAstraBundle`.
      required: [region, downloadURL]
      properties:
        region:
          type: string
          description: Matched case-insensitively against the requested region.
          example: us-east1
        downloadURL:
          type: string
          format: uri
          description: The `default` bundle for this datacenter.
          example: https://datastax-cluster-config-prod.s3.us-east-2.amazonaws.com/PLACEHOLDER/secure-connect-prod-eu.zip
        datacenterId:
          type: string
          example: f9a1b3c4-1111-2222-3333-444455556666-1
        customDomainBundles:
          type: array
          description: Present only when custom domains are configured for this database.
          items:
            $ref: "#/components/schemas/AstraCustomDomainBundle"
      example:
        region: us-east1
        datacenterId: f9a1b3c4-1111-2222-3333-444455556666-1
        downloadURL: https://datastax-cluster-config-prod.s3.us-east-2.amazonaws.com/PLACEHOLDER/secure-connect-prod-eu.zip
        customDomainBundles:
          - domain: cassandra.example.com
            downloadURL: https://datastax-cluster-config-prod.s3.us-east-2.amazonaws.com/PLACEHOLDER/secure-connect-custom.zip

    AstraCustomDomainBundle:
      type: object
      required: [domain, downloadURL]
      properties:
        domain:
          type: string
          example: cassandra.example.com
        downloadURL:
          type: string
          format: uri
          example: https://datastax-cluster-config-prod.s3.us-east-2.amazonaws.com/PLACEHOLDER/secure-connect-custom.zip

    AstraBundleDownloadRequest:
      type: object
      description: |
        Selection is expressed with **two orthogonal inputs**: `region` (optional) and `scbType`
        (`default` | `custom`). See `ScbType` for why there is no third `region` type value.
      required: [connectionId, astraToken]
      properties:
        connectionId:
          type: string
          format: uuid
          description: The connection the downloaded bundle is stored against, encrypted.
          example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        astraToken:
          type: string
          writeOnly: true
          pattern: "^AstraCS:.+$"
          description: |
            Write-only. Not returned in any response, including errors, and never logged.
            Supplied in the body here (rather than a header) because this call also persists the
            association; it is still never placed in a URL or query string.
          example: "AstraCS:REDACTED"
        region:
          type: string
          description: Optional. Case-insensitive match; absent ⇒ first datacenter in the array.
          example: us-east1
        scbType:
          $ref: "#/components/schemas/ScbType"
        domain:
          type: string
          description: Required if and only if `scbType` is `custom`.
          example: cassandra.example.com
        force:
          type: boolean
          default: false
          description: |
            Bypass the `(databaseId, region, scbType, domain)` cache — the explicit
            "re-download bundle" action, needed because Astra rotates bundles.
          example: false
      example:
        connectionId: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        astraToken: "AstraCS:REDACTED"
        region: us-east1
        scbType: default
        force: false

    ConnectionRequest:
      type: object
      description: |
        Write model for a connection. Every secret field is `writeOnly` and is therefore absent
        from `ConnectionResponse` by construction.

        Which fields apply depends on `mode`:

        | mode | required |
        | --- | --- |
        | `CASSANDRA`, `DSE` | `contactPoints`, `localDatacenter` |
        | `ASTRA` | `astra.astraToken` + the fields required by `astra.scbMode` |
        | `ADVANCED` | `advancedConfig` |
      required: [name, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: local-dev
        mode:
          $ref: "#/components/schemas/ConnectionMode"
        description:
          type: string
          example: Docker Compose Cassandra 5.0
        contactPoints:
          type: array
          items:
            $ref: "#/components/schemas/ContactPoint"
          example:
            - host: 127.0.0.1
              port: 9042
        localDatacenter:
          type: string
          description: Required for `CASSANDRA` / `DSE` — the driver has no safe default.
          example: datacenter1
        username:
          type: string
          example: cassandra
        password:
          type: string
          writeOnly: true
          description: |
            Encrypted at rest (AES-256-GCM, key from `CASSYX_SECRET_KEY`). Never returned.
            On update, `null` preserves the stored value and `""` clears it.
        protocolVersion:
          type: string
          description: Override the negotiated native protocol version.
          enum: [V3, V4, V5, DSE_V1, DSE_V2]
          example: V5
        defaultKeyspace:
          type: string
          example: demo
        requestTimeoutMillis:
          type: integer
          minimum: 100
          default: 10000
          example: 10000
        astra:
          $ref: "#/components/schemas/AstraSettings"
        advancedConfig:
          type: string
          description: |
            Raw `application.conf` (HOCON) passthrough for `ADVANCED` mode. May itself contain
            credentials, so it is write-only; `ConnectionResponse` reports `hasAdvancedConfig`.
          writeOnly: true
          example: |
            datastax-java-driver {
              basic.contact-points = [ "10.0.0.1:9042" ]
              basic.load-balancing-policy.local-datacenter = dc1
            }
        ssh:
          $ref: "#/components/schemas/SshTunnelConfig"
        ssl:
          $ref: "#/components/schemas/SslConfig"
        tags:
          type: array
          items:
            type: string
          example: [dev]
      example:
        name: local-dev
        mode: CASSANDRA
        description: Docker Compose Cassandra 5.0
        contactPoints:
          - host: 127.0.0.1
            port: 9042
        localDatacenter: datacenter1
        username: cassandra
        password: cassandra
        defaultKeyspace: demo

    ConnectionResponse:
      type: object
      description: |
        Read model for a connection. **This schema contains no secret values and must never be
        extended to carry one.** Presence is reported with `has*` booleans: `hasPassword`,
        `hasAdvancedConfig`, `astra.hasAstraToken`, `ssl.hasTruststore`, `ssh.hasPrivateKey`, …
      required: [id, name, mode, hasPassword, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        name:
          type: string
          example: local-dev
        mode:
          $ref: "#/components/schemas/ConnectionMode"
        description:
          type: string
          example: Docker Compose Cassandra 5.0
        contactPoints:
          type: array
          items:
            $ref: "#/components/schemas/ContactPoint"
        localDatacenter:
          type: string
          example: datacenter1
        username:
          type: string
          description: Not a secret; the password is.
          example: cassandra
        hasPassword:
          type: boolean
          example: true
        protocolVersion:
          type: [string, "null"]
          example: null
        defaultKeyspace:
          type: string
          example: demo
        requestTimeoutMillis:
          type: integer
          example: 10000
        hasAdvancedConfig:
          type: boolean
          example: false
        astra:
          oneOf:
            - $ref: "#/components/schemas/AstraInfo"
            - type: "null"
        ssh:
          $ref: "#/components/schemas/SshTunnelInfo"
        ssl:
          $ref: "#/components/schemas/SslInfo"
        tags:
          type: array
          items:
            type: string
        connected:
          type: boolean
          description: Whether a live session exists in the registry right now.
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-08-17T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:22:14Z"
        lastConnectedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-08-17T10:25:41Z"
      example:
        id: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        name: local-dev
        mode: CASSANDRA
        contactPoints:
          - host: 127.0.0.1
            port: 9042
        localDatacenter: datacenter1
        username: cassandra
        hasPassword: true
        defaultKeyspace: demo
        requestTimeoutMillis: 10000
        hasAdvancedConfig: false
        astra: null
        ssh:
          enabled: false
        ssl:
          enabled: false
          hasTruststore: false
          hasKeystore: false
        connected: true
        createdAt: "2026-08-17T09:00:00Z"

    SecureConnectBundleUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The `secure-connect-<db>.zip` bundle.
      example:
        file: (binary)

    KeystoreUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JKS or PKCS12 store.
        password:
          type: string
          writeOnly: true
          description: Store password; encrypted at rest, never returned.
        storeType:
          type: string
          enum: [JKS, PKCS12]
          default: PKCS12

    ConnectionTestRequest:
      type: object
      description: |
        Supply either `connectionId` (test a saved connection, reusing its stored secrets) or
        `connection` (test unsaved form input). Exactly one.
      oneOf:
        - required: [connectionId]
        - required: [connection]
      properties:
        connectionId:
          type: string
          format: uuid
          example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        connection:
          $ref: "#/components/schemas/ConnectionRequest"
      example:
        connectionId: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11

    ConnectionTestResult:
      type: object
      description: A failed probe is still `200` — inspect `success`.
      required: [success, elapsedMillis]
      properties:
        success:
          type: boolean
          example: true
        elapsedMillis:
          type: integer
          format: int64
          example: 412
        clusterName:
          type: string
          example: Test Cluster
        releaseVersion:
          type: string
          example: 5.0.2
        partitioner:
          type: string
          example: org.apache.cassandra.dht.Murmur3Partitioner
        datacenters:
          type: array
          items:
            type: string
          example: [datacenter1]
        nodeCount:
          type: integer
          example: 3
        protocolVersion:
          type: string
          example: V5
        capabilities:
          oneOf:
            - $ref: "#/components/schemas/ClusterCapabilities"
            - type: "null"
        problem:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
          description: Populated when `success` is `false`. Never contains credentials.

    SessionState:
      type: object
      required: [connectionId, connected]
      properties:
        connectionId:
          type: string
          format: uuid
          example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        connectionName:
          type: string
          example: local-dev
        connected:
          type: boolean
          example: true
        sessionId:
          type: string
          description: Registry key suffix; useful for correlating log output.
          example: sess_01J8Z0QF9V3TZ2H8G6M4B7K1QW
        clusterName:
          type: string
          example: Test Cluster
        releaseVersion:
          type: string
          example: 5.0.2
        connectedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:25:41Z"
        idleTimeoutSeconds:
          type: integer
          description: Idle-eviction TTL for this session (default 1800s).
          example: 1800
        expiresAt:
          type: string
          format: date-time
          description: When the session will be evicted if untouched.
          example: "2026-08-17T10:55:41Z"
        sshTunnelActive:
          type: boolean
          example: false
        capabilities:
          oneOf:
            - $ref: "#/components/schemas/ClusterCapabilities"
            - type: "null"

    ConnectionHealth:
      type: object
      required: [connectionId, status]
      properties:
        connectionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CONNECTED, DEGRADED, DISCONNECTED]
          example: CONNECTED
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeHealth"
        openConnections:
          type: integer
          example: 6
        inFlightRequests:
          type: integer
          example: 0
        checkedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:30:00Z"

    NodeHealth:
      type: object
      required: [endpoint, state]
      properties:
        endpoint:
          type: string
          example: 127.0.0.1:9042
        state:
          type: string
          enum: [UP, DOWN, UNKNOWN, FORCED_DOWN]
          example: UP
        datacenter:
          type: string
          example: datacenter1
        rack:
          type: string
          example: rack1
        cassandraVersion:
          type: string
          example: 5.0.2
        hostId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        openConnections:
          type: integer
          example: 2

    ########################################################################
    # capabilities (§7.1)
    ########################################################################

    CapabilityName:
      type: string
      enum:
        - sai
        - vector
        - materializedViews
        - udfUda
        - truncate
        - tokenRangeScan
        - dseSearch
        - rolesPermissions
        - tracing
        - lwt
        - counters
        - virtualTables
        - describeStatement
      example: sai

    CapabilitySupport:
      type: string
      description: |
        `PARTIAL` means usable with caveats (Astra roles, for instance); the UI shows the feature
        with the caveat rather than hiding it. `UNSUPPORTED` features are hidden behind an
        explanatory tooltip, never shown broken.
      enum: [SUPPORTED, PARTIAL, UNSUPPORTED, UNKNOWN]
      example: SUPPORTED

    Capability:
      type: object
      required: [name, support]
      properties:
        name:
          $ref: "#/components/schemas/CapabilityName"
        support:
          $ref: "#/components/schemas/CapabilitySupport"
        reason:
          type: string
          description: Shown verbatim as the tooltip when the feature is hidden or caveated.
          example: SAI requires Cassandra 5.x, DSE 6.8+ or Astra. This cluster reports 4.1.3.
        since:
          type: string
          description: Minimum version that provides this capability on the detected flavour.
          example: "5.0"

    ClusterFlavour:
      type: string
      enum: [CASSANDRA, DSE, ASTRA, AMAZON_KEYSPACES, SCYLLA, UNKNOWN]
      example: CASSANDRA

    ClusterCapabilities:
      type: object
      description: |
        Result of the `ClusterCapabilities` probe (plan §7.1). `capabilities` is keyed by
        `CapabilityName` so clients can look a feature up directly.
      required: [flavour, capabilities, probedAt]
      properties:
        flavour:
          $ref: "#/components/schemas/ClusterFlavour"
        clusterName:
          type: string
          example: Test Cluster
        releaseVersion:
          type: string
          example: 5.0.2
        dseVersion:
          type: [string, "null"]
          example: null
        protocolVersion:
          type: string
          example: V5
        partitioner:
          type: string
          example: org.apache.cassandra.dht.Murmur3Partitioner
        nodeCount:
          type: integer
          example: 3
        datacenters:
          type: array
          items:
            type: string
          example: [datacenter1]
        capabilities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Capability"
        bulkFallback:
          type: string
          description: |
            Which bulk read strategy applies. Amazon Keyspaces has no `token()` range scan, so it
            falls back to plain driver paging (plan §7.1).
          enum: [TOKEN_RANGE_SCAN, PLAIN_PAGING]
          example: TOKEN_RANGE_SCAN
        probedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:25:42Z"
      example:
        flavour: CASSANDRA
        clusterName: Test Cluster
        releaseVersion: 5.0.2
        protocolVersion: V5
        nodeCount: 3
        datacenters: [datacenter1]
        bulkFallback: TOKEN_RANGE_SCAN
        probedAt: "2026-08-17T10:25:42Z"
        capabilities:
          sai:
            name: sai
            support: SUPPORTED
            since: "5.0"
          vector:
            name: vector
            support: SUPPORTED
            since: "5.0"
          dseSearch:
            name: dseSearch
            support: UNSUPPORTED
            reason: DSE Search is only available on DataStax Enterprise.

    ########################################################################
    # schema catalog (§4)
    ########################################################################

    SchemaNodeKind:
      type: string
      enum: [KEYSPACE, TABLE, VIEW, COLUMN, INDEX, TYPE, FUNCTION, AGGREGATE, ROLE]
      example: TABLE

    SchemaIdentity:
      type: object
      title: SchemaIdentity
      description: |
        **The fully-qualified identity of a schema object.** Every schema node in every response
        carries one of these, and clients must resolve actions (drop, describe, select, drag) from
        the node's own `identity` — never from a parent node or from UI tree position.

        This is the contract-level fix for the prior-art bug where dropping `demo.users` generated
        `SELECT * FROM system_auth.users` because the handler read the keyspace from the wrong
        tree node (plan §1, §4).

        `keyspace` is always present. The remaining fields are populated according to `kind`:
        `TABLE` ⇒ `table`; `COLUMN`/`INDEX` ⇒ `table` + `column`/`index`; `VIEW` ⇒ `view` (plus
        `baseTable`); `TYPE`/`FUNCTION`/`AGGREGATE` ⇒ `name` (+ `signature` for overloadables).
      required: [kind, keyspace]
      properties:
        kind:
          $ref: "#/components/schemas/SchemaNodeKind"
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        view:
          $ref: "#/components/schemas/CqlIdentifier"
        column:
          $ref: "#/components/schemas/CqlIdentifier"
        index:
          $ref: "#/components/schemas/CqlIdentifier"
        name:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Name for kinds that are not table-scoped (TYPE, FUNCTION, AGGREGATE, ROLE).
        signature:
          type: string
          description: Argument-type list for overloadable objects (UDF/UDA).
          example: "(double,int)"
        qualifiedName:
          type: string
          description: |
            Convenience rendering, correctly quoted — e.g. `demo.users`, `demo."UserEvents"`.
            Never parse this; use the structured fields.
          example: demo.users
      example:
        kind: TABLE
        keyspace: demo
        table: users
        qualifiedName: demo.users

    SchemaNode:
      type: object
      description: One node of the schema tree. `children` is omitted for leaf nodes.
      required: [identity, label, kind]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        label:
          type: string
          description: Display name for the tree.
          example: users
        kind:
          $ref: "#/components/schemas/SchemaNodeKind"
        system:
          type: boolean
          description: Node belongs to a system keyspace; hidden unless "Show system" is on.
          example: false
        detail:
          type: string
          description: Secondary line in the tree — a type, an index target, a partitioner hint.
          example: "3 partition keys · 12 columns"
        children:
          type: array
          items:
            $ref: "#/components/schemas/SchemaNode"

    SchemaTree:
      type: object
      required: [connectionId, generatedAt, keyspaces]
      properties:
        connectionId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:31:00Z"
        includeSystem:
          type: boolean
          example: false
        schemaVersion:
          type: string
          description: Cluster schema agreement version; changes when DDL is applied elsewhere.
          example: 6f8a1b2c-3d4e-4f50-a617-283949506172
        keyspaces:
          type: array
          items:
            $ref: "#/components/schemas/SchemaNode"

    SchemaSearchResult:
      type: object
      required: [query, matches, truncated]
      properties:
        query:
          type: string
          example: user
        truncated:
          type: boolean
          description: '`true` when more matches exist than `limit` allowed.'
          example: false
        matches:
          type: array
          items:
            $ref: "#/components/schemas/SchemaSearchMatch"

    SchemaSearchMatch:
      type: object
      required: [identity, label, kind]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        label:
          type: string
          example: users
        kind:
          $ref: "#/components/schemas/SchemaNodeKind"
        matchedOn:
          type: string
          enum: [NAME, TYPE, COMMENT, TARGET]
          example: NAME
        context:
          type: string
          description: Where the match sits, for the result list's secondary line.
          example: demo.users

    ReplicationStrategy:
      type: string
      enum: [SimpleStrategy, NetworkTopologyStrategy, EverywhereStrategy, LocalStrategy]
      example: NetworkTopologyStrategy

    Keyspace:
      type: object
      required: [identity, name, replication, durableWrites, system]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        replication:
          $ref: "#/components/schemas/ReplicationSettings"
        durableWrites:
          type: boolean
          example: true
        system:
          type: boolean
          example: false
        tableCount:
          type: integer
          example: 12
        viewCount:
          type: integer
          example: 2
        typeCount:
          type: integer
          example: 3
        functionCount:
          type: integer
          example: 1
        aggregateCount:
          type: integer
          example: 1
      example:
        identity:
          kind: KEYSPACE
          keyspace: demo
          qualifiedName: demo
        name: demo
        replication:
          strategy: NetworkTopologyStrategy
          datacenters:
            datacenter1: 3
        durableWrites: true
        system: false
        tableCount: 12

    ReplicationSettings:
      type: object
      required: [strategy]
      properties:
        strategy:
          $ref: "#/components/schemas/ReplicationStrategy"
        replicationFactor:
          type: integer
          minimum: 1
          description: Used by `SimpleStrategy` only.
          example: 1
        datacenters:
          type: object
          description: Per-DC replication factors, used by `NetworkTopologyStrategy`.
          additionalProperties:
            type: integer
            minimum: 0
          example:
            datacenter1: 3
            datacenter2: 2

    KeyspaceDefinition:
      type: object
      required: [name, replication]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        replication:
          $ref: "#/components/schemas/ReplicationSettings"
        durableWrites:
          type: boolean
          default: true
        ifNotExists:
          type: boolean
          default: true
      example:
        name: demo
        replication:
          strategy: NetworkTopologyStrategy
          datacenters:
            datacenter1: 3
        durableWrites: true
        ifNotExists: true

    ColumnKind:
      type: string
      enum: [PARTITION_KEY, CLUSTERING, REGULAR, STATIC, COMPACT_VALUE]
      example: PARTITION_KEY

    ClusteringOrder:
      type: string
      enum: [ASC, DESC]
      example: DESC

    Column:
      type: object
      required: [identity, name, type, kind]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        type:
          type: string
          description: CQL type as rendered by the driver, including nested and frozen forms.
          example: "map<text, frozen<address>>"
        kind:
          $ref: "#/components/schemas/ColumnKind"
        position:
          type: integer
          description: Position within the partition key or clustering key; `-1` otherwise.
          example: 0
        clusteringOrder:
          oneOf:
            - $ref: "#/components/schemas/ClusteringOrder"
            - type: "null"
        frozen:
          type: boolean
          example: false
        collection:
          type: boolean
          example: true
        counter:
          type: boolean
          example: false
        vector:
          type: boolean
          example: false
        vectorDimensions:
          type: [integer, "null"]
          example: null
        comment:
          type: string
          description: Column comment, where the flavour supports one.
        indexed:
          type: boolean
          description: A convenience flag — an index targets this column.
          example: false
      example:
        identity:
          kind: COLUMN
          keyspace: demo
          table: users
          column: email
          qualifiedName: demo.users.email
        name: email
        type: text
        kind: REGULAR
        position: -1
        frozen: false
        collection: false
        counter: false
        vector: false
        indexed: true

    ColumnDefinition:
      type: object
      required: [name, type]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        type:
          type: string
          description: |
            CQL type text — scalars, `list<…>`, `set<…>`, `map<…,…>`, `tuple<…>`, `frozen<…>`,
            `counter`, a UDT name, or `vector<float, N>`.
          example: "vector<float, 1536>"
        static:
          type: boolean
          default: false
        comment:
          type: string
      example:
        name: email
        type: text
        static: false

    ColumnAlteration:
      type: object
      description: |
        Exactly one of `newName` (rename — only permitted on primary-key columns in Cassandra) or
        `newType` (retype, subject to the flavour's compatibility rules).
      properties:
        newName:
          $ref: "#/components/schemas/CqlIdentifier"
        newType:
          type: string
          example: bigint
      example:
        newName: user_email

    PrimaryKeyDefinition:
      type: object
      required: [partitionKey]
      properties:
        partitionKey:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [user_id]
        clusteringKey:
          type: array
          items:
            $ref: "#/components/schemas/ClusteringKeyColumn"

    ClusteringKeyColumn:
      type: object
      required: [column]
      properties:
        column:
          $ref: "#/components/schemas/CqlIdentifier"
        order:
          allOf:
            - $ref: "#/components/schemas/ClusteringOrder"
          default: ASC
      example:
        column: created_at
        order: DESC

    CompactionSettings:
      type: object
      description: |
        `class` plus arbitrary subproperties, passed straight through so new strategies and
        options need no API change.
      required: [class]
      properties:
        class:
          type: string
          enum:
            - SizeTieredCompactionStrategy
            - LeveledCompactionStrategy
            - TimeWindowCompactionStrategy
            - UnifiedCompactionStrategy
          example: SizeTieredCompactionStrategy
        options:
          type: object
          additionalProperties:
            type: string
          example:
            min_threshold: "4"
            max_threshold: "32"

    CompressionSettings:
      type: object
      properties:
        class:
          type: string
          enum: [LZ4Compressor, SnappyCompressor, DeflateCompressor, ZstdCompressor, none]
          example: LZ4Compressor
        chunkLengthInKb:
          type: integer
          example: 16
        crcCheckChance:
          type: number
          format: double
          example: 1.0

    CachingSettings:
      type: object
      properties:
        keys:
          type: string
          enum: [ALL, NONE]
          example: ALL
        rowsPerPartition:
          type: string
          description: '`ALL`, `NONE`, or a row count as a string.'
          example: NONE

    TableOptions:
      type: object
      description: The full `WITH` options surface (plan §4). Every field is optional.
      properties:
        comment:
          type: string
          example: Application users
        compaction:
          $ref: "#/components/schemas/CompactionSettings"
        compression:
          $ref: "#/components/schemas/CompressionSettings"
        caching:
          $ref: "#/components/schemas/CachingSettings"
        bloomFilterFpChance:
          type: number
          format: double
          example: 0.01
        gcGraceSeconds:
          type: integer
          example: 864000
        defaultTimeToLive:
          type: integer
          example: 0
        readRepair:
          type: string
          enum: [BLOCKING, NONE]
          example: BLOCKING
        readRepairChance:
          type: number
          format: double
          description: Pre-4.0 clusters only.
          example: 0.0
        dclocalReadRepairChance:
          type: number
          format: double
          example: 0.0
        speculativeRetry:
          type: string
          example: 99p
        additionalWritePolicy:
          type: string
          example: 99p
        minIndexInterval:
          type: integer
          example: 128
        maxIndexInterval:
          type: integer
          example: 2048
        memtableFlushPeriodInMs:
          type: integer
          example: 0
        crcCheckChance:
          type: number
          format: double
          example: 1.0
        cdc:
          type: boolean
          example: false
        extensions:
          type: object
          description: Passthrough for flavour-specific options not modelled above.
          additionalProperties:
            type: string

    Table:
      type: object
      required: [identity, name, keyspace, columns, primaryKey]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        primaryKey:
          $ref: "#/components/schemas/PrimaryKeyDefinition"
        options:
          $ref: "#/components/schemas/TableOptions"
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/Index"
        viewNames:
          type: array
          description: Materialized views built on this table.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        virtual:
          type: boolean
          example: false
        system:
          type: boolean
          example: false
        hasCounters:
          type: boolean
          description: Counter tables need `batch.maxBatchStatements = 1` in bulk load (§5.3).
          example: false
        hasVectorColumns:
          type: boolean
          example: false

    TableDefinition:
      type: object
      required: [name, columns, primaryKey]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        columns:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ColumnDefinition"
        primaryKey:
          $ref: "#/components/schemas/PrimaryKeyDefinition"
        options:
          $ref: "#/components/schemas/TableOptions"
        ifNotExists:
          type: boolean
          default: true
      example:
        name: users
        columns:
          - name: user_id
            type: uuid
          - name: created_at
            type: timestamp
          - name: email
            type: text
          - name: profile
            type: frozen<address>
        primaryKey:
          partitionKey: [user_id]
          clusteringKey:
            - column: created_at
              order: DESC
        options:
          comment: Application users
          gcGraceSeconds: 864000
        ifNotExists: true

    TableCommentUpdate:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          example: Application users, one row per signup event.

    IndexKind:
      type: string
      description: |
        `SAI` is the primary path on C* 5.x / Astra; `COMPOSITES`/`KEYS`/`CUSTOM` are legacy 2i;
        `DSE_SEARCH` is DSE-only.
      enum: [SAI, COMPOSITES, KEYS, CUSTOM, DSE_SEARCH]
      example: SAI

    Index:
      type: object
      required: [identity, name, target, kind]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        target:
          type: string
          description: |
            Index target expression — a column name, or `keys(col)` / `values(col)` /
            `entries(col)` / `full(col)` for collections.
          example: email
        kind:
          $ref: "#/components/schemas/IndexKind"
        className:
          type: string
          description: Custom index class, for `CUSTOM` and `SAI`.
          example: org.apache.cassandra.index.sai.StorageAttachedIndex
        options:
          type: object
          additionalProperties:
            type: string
          example:
            similarity_function: cosine
      example:
        identity:
          kind: INDEX
          keyspace: demo
          table: users
          index: users_email_idx
          qualifiedName: demo.users_email_idx
        name: users_email_idx
        target: email
        kind: SAI
        className: org.apache.cassandra.index.sai.StorageAttachedIndex
        options: {}

    IndexDefinition:
      type: object
      required: [name, target, kind]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        target:
          type: string
          example: email
        kind:
          $ref: "#/components/schemas/IndexKind"
        className:
          type: string
          description: Required for `CUSTOM`; defaulted for `SAI`.
        options:
          type: object
          additionalProperties:
            type: string
        ifNotExists:
          type: boolean
          default: true
      example:
        name: users_email_idx
        target: email
        kind: SAI
        ifNotExists: true

    MaterializedView:
      type: object
      required: [identity, name, baseTable, columns, primaryKey]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        baseTable:
          allOf:
            - $ref: "#/components/schemas/SchemaIdentity"
          description: Full identity of the base table — never inferred from tree position.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        primaryKey:
          $ref: "#/components/schemas/PrimaryKeyDefinition"
        whereClause:
          type: string
          example: user_id IS NOT NULL AND email IS NOT NULL
        includesAllColumns:
          type: boolean
          example: false
        options:
          $ref: "#/components/schemas/TableOptions"

    MaterializedViewDefinition:
      type: object
      required: [name, baseTable, selectedColumns, primaryKey]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        baseTable:
          $ref: "#/components/schemas/CqlIdentifier"
        selectedColumns:
          type: array
          description: Empty or omitted means `SELECT *`.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        primaryKey:
          $ref: "#/components/schemas/PrimaryKeyDefinition"
        whereClause:
          type: string
          description: |
            Auto-generated as `<col> IS NOT NULL` for every primary-key column if omitted.
          example: user_id IS NOT NULL AND email IS NOT NULL
        options:
          $ref: "#/components/schemas/TableOptions"
        ifNotExists:
          type: boolean
          default: true
      example:
        name: users_by_email
        baseTable: users
        selectedColumns: [user_id, email, created_at]
        primaryKey:
          partitionKey: [email]
          clusteringKey:
            - column: user_id
        ifNotExists: true

    UserDefinedTypeField:
      type: object
      required: [name, type]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        type:
          type: string
          example: text

    UserDefinedType:
      type: object
      required: [identity, name, fields]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/UserDefinedTypeField"
        usedBy:
          type: array
          description: Tables and columns referencing this type — why a drop may be refused.
          items:
            $ref: "#/components/schemas/SchemaIdentity"
      example:
        identity:
          kind: TYPE
          keyspace: demo
          name: address
          qualifiedName: demo.address
        name: address
        fields:
          - name: street
            type: text
          - name: city
            type: text
          - name: postcode
            type: text

    UserDefinedTypeDefinition:
      type: object
      required: [name, fields]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        fields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UserDefinedTypeField"
        ifNotExists:
          type: boolean
          default: true

    UserDefinedTypeAlteration:
      type: object
      description: CQL supports adding fields and renaming fields; it does not support dropping them.
      properties:
        addFields:
          type: array
          items:
            $ref: "#/components/schemas/UserDefinedTypeField"
        renameFields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CqlIdentifier"
          example:
            postcode: postal_code

    UdfNullHandling:
      type: string
      description: '`CALLED ON NULL INPUT` vs `RETURNS NULL ON NULL INPUT`.'
      enum: [CALLED_ON_NULL_INPUT, RETURNS_NULL_ON_NULL_INPUT]
      example: CALLED_ON_NULL_INPUT

    FunctionArgument:
      type: object
      required: [name, type]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        type:
          type: string
          example: double

    UserDefinedFunction:
      type: object
      required: [identity, name, signature, arguments, returnType, language]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        signature:
          type: string
          example: "avg_state(double,int)"
        arguments:
          type: array
          items:
            $ref: "#/components/schemas/FunctionArgument"
        returnType:
          type: string
          example: double
        language:
          type: string
          example: java
        body:
          type: string
          description: Function body. Contains semicolons — never split scripts on `;` (§5.1).
          example: "return a + b;"
        nullHandling:
          $ref: "#/components/schemas/UdfNullHandling"
        deterministic:
          type: boolean
          example: true

    UserDefinedFunctionDefinition:
      type: object
      required: [name, arguments, returnType, language, body]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        arguments:
          type: array
          items:
            $ref: "#/components/schemas/FunctionArgument"
        returnType:
          type: string
          example: double
        language:
          type: string
          enum: [java, javascript]
          example: java
        body:
          type: string
          example: "return a + b;"
        nullHandling:
          allOf:
            - $ref: "#/components/schemas/UdfNullHandling"
          default: CALLED_ON_NULL_INPUT
        orReplace:
          type: boolean
          default: false
        ifNotExists:
          type: boolean
          default: true

    UserDefinedAggregate:
      type: object
      required: [identity, name, signature, argumentTypes, stateFunction, stateType, returnType]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        signature:
          type: string
          example: "average(double)"
        argumentTypes:
          type: array
          items:
            type: string
          example: [double]
        stateFunction:
          type: string
          example: avg_state
        stateType:
          type: string
          example: "tuple<double, int>"
        finalFunction:
          type: [string, "null"]
          example: avg_final
        initCondition:
          type: [string, "null"]
          example: "(0.0, 0)"
        returnType:
          type: string
          example: double

    UserDefinedAggregateDefinition:
      type: object
      required: [name, argumentTypes, stateFunction, stateType]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        argumentTypes:
          type: array
          items:
            type: string
          example: [double]
        stateFunction:
          type: string
          example: avg_state
        stateType:
          type: string
          example: "tuple<double, int>"
        finalFunction:
          type: string
          example: avg_final
        initCondition:
          type: string
          example: "(0.0, 0)"
        orReplace:
          type: boolean
          default: false
        ifNotExists:
          type: boolean
          default: true

    Role:
      type: object
      required: [identity, name, superuser, login]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        superuser:
          type: boolean
          example: false
        login:
          type: boolean
          example: true
        memberOf:
          type: array
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [readers]
        options:
          type: object
          additionalProperties:
            type: string
      example:
        identity:
          kind: ROLE
          keyspace: system_auth
          name: app_reader
          qualifiedName: app_reader
        name: app_reader
        superuser: false
        login: true
        memberOf: [readers]

    RoleDefinition:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        password:
          type: string
          writeOnly: true
          description: Never returned. Only sent to the cluster in the generated DDL.
        superuser:
          type: boolean
          default: false
        login:
          type: boolean
          default: true
        memberOf:
          type: array
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        options:
          type: object
          additionalProperties:
            type: string
        ifNotExists:
          type: boolean
          default: true

    CqlPermission:
      type: string
      enum:
        - ALL
        - CREATE
        - ALTER
        - DROP
        - SELECT
        - MODIFY
        - AUTHORIZE
        - DESCRIBE
        - EXECUTE
      example: SELECT

    PermissionGrant:
      type: object
      required: [role, resource, permission]
      properties:
        role:
          $ref: "#/components/schemas/CqlIdentifier"
        resource:
          type: string
          description: CQL resource string.
          example: table demo.users
        resourceIdentity:
          oneOf:
            - $ref: "#/components/schemas/SchemaIdentity"
            - type: "null"
          description: Structured form of `resource` when it maps to a schema object.
        permission:
          $ref: "#/components/schemas/CqlPermission"
        grantable:
          type: boolean
          description: Whether the role may grant this on to others.
          example: false

    PermissionChangeRequest:
      type: object
      required: [role, resource, permissions]
      properties:
        role:
          $ref: "#/components/schemas/CqlIdentifier"
        resource:
          type: string
          example: table demo.users
        permissions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CqlPermission"
          example: [SELECT, MODIFY]

    TableInfo:
      type: object
      description: |
        The four always-populated tabs of the table info panel — Fields, Indexes, Comment and
        Definition (plan §4). Statistics is a separate, expensive call.
      required: [identity, fields, indexes, definition]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        fields:
          type: array
          description: Name / type / kind / comment — the FIELDS tab.
          items:
            $ref: "#/components/schemas/Column"
        indexes:
          type: array
          description: The INDEXES tab. Actually populated, unlike the prior-art prototype.
          items:
            $ref: "#/components/schemas/Index"
        comment:
          type: string
          description: The COMMENT tab. Editable via `updateTableComment`.
          example: Application users
        definition:
          type: string
          description: |
            The DEFINITION tab — `TableMetadata#describe(true)`. Requires driver 4.19.0 for
            correct `vector<float, N>` rendering (CASSJAVA-2).
          example: |
            CREATE TABLE demo.users (
                user_id uuid,
                created_at timestamp,
                email text,
                PRIMARY KEY (user_id, created_at)
            ) WITH CLUSTERING ORDER BY (created_at DESC)
                AND comment = 'Application users';
        views:
          type: array
          items:
            $ref: "#/components/schemas/SchemaIdentity"
        statisticsAvailable:
          type: boolean
          description: Whether a cached statistics snapshot exists for the STATISTICS tab.
          example: false

    TableStatistics:
      type: object
      description: |
        Output of the DSBulk `count` workflow (plan §5.4) — the panel the prior-art prototype had
        an API for but never built. Also feeds pre-flight estimates for export jobs.
      required: [identity, totalRows, computedAt, jobId]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        totalRows:
          type: integer
          format: int64
          example: 10000000
        partitionCount:
          type: [integer, "null"]
          format: int64
          example: 250000
        computedAt:
          type: string
          format: date-time
          example: "2026-08-17T11:02:33Z"
        jobId:
          type: string
          format: uuid
          description: The count job that produced this snapshot.
          example: 6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44
        durationMillis:
          type: integer
          format: int64
          example: 21400
        perReplica:
          type: array
          items:
            $ref: "#/components/schemas/ReplicaRowCount"
        perTokenRange:
          type: array
          items:
            $ref: "#/components/schemas/TokenRangeRowCount"
        largestPartitions:
          type: array
          description: Top-N largest partitions — the skew signal that drives §5.2 oversplitting.
          items:
            $ref: "#/components/schemas/PartitionSize"

    ReplicaRowCount:
      type: object
      required: [endpoint, rows]
      properties:
        endpoint:
          type: string
          example: 127.0.0.1:9042
        datacenter:
          type: string
          example: datacenter1
        rows:
          type: integer
          format: int64
          example: 3333334

    TokenRangeRowCount:
      type: object
      required: [start, end, rows]
      properties:
        start:
          type: string
          description: Token as a string — Murmur3 tokens exceed JS safe-integer range.
          example: "-9223372036854775808"
        end:
          type: string
          example: "-3074457345618258603"
        rows:
          type: integer
          format: int64
          example: 3333333
        replicas:
          type: array
          items:
            type: string
          example: [127.0.0.1:9042]

    PartitionSize:
      type: object
      required: [partitionKey, rows]
      properties:
        partitionKey:
          type: string
          description: Rendered partition key value(s).
          example: "user_id=1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
        rows:
          type: integer
          format: int64
          example: 412339
        sizeBytes:
          type: [integer, "null"]
          format: int64
          example: 89123456

    DdlObjectType:
      type: string
      enum:
        - KEYSPACE
        - TABLE
        - COLUMN
        - INDEX
        - MATERIALIZED_VIEW
        - TYPE
        - FUNCTION
        - AGGREGATE
        - ROLE
        - PERMISSION
      example: TABLE

    DdlAction:
      type: string
      enum: [CREATE, ALTER, DROP, TRUNCATE, GRANT, REVOKE]
      example: CREATE

    DdlGenerateRequest:
      type: object
      description: |
        `definition` is one of the `*Definition` schemas, selected by `objectType` — for example
        `TableDefinition` for `objectType: TABLE`, `SaiIndexDefinition` or `IndexDefinition` for
        `INDEX`. It is intentionally loose here because a single discriminated union across ten
        object types generates worse clients than a documented mapping.
      required: [objectType, action, definition]
      properties:
        objectType:
          $ref: "#/components/schemas/DdlObjectType"
        action:
          $ref: "#/components/schemas/DdlAction"
        keyspace:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Target keyspace. Required for every object type except `KEYSPACE`/`ROLE`.
        table:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Target table, for table-scoped object types.
        definition:
          type: object
          additionalProperties: true
          description: The matching `*Definition` payload.
      example:
        objectType: TABLE
        action: CREATE
        keyspace: demo
        definition:
          name: users
          columns:
            - name: user_id
              type: uuid
            - name: email
              type: text
          primaryKey:
            partitionKey: [user_id]

    DdlDescribeRequest:
      type: object
      description: Describe an existing object. `identity` carries the full qualification.
      required: [identity]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        withChildren:
          type: boolean
          description: Include dependent objects (indexes, views) — `describe(true)`.
          default: true
        formatted:
          type: boolean
          default: true
      example:
        identity:
          kind: TABLE
          keyspace: demo
          table: users
        withChildren: true

    DdlPreview:
      type: object
      description: |
        Generated CQL, always shown to the user and always editable before execution. Generated
        DDL is never executed silently (plan §4).
      required: [cql, statements]
      properties:
        cql:
          type: string
          description: The full script, ready for the preview pane.
          example: |
            CREATE TABLE IF NOT EXISTS demo.users (
                user_id uuid,
                email text,
                PRIMARY KEY (user_id)
            );
        statements:
          type: array
          description: The script split into individually executable statements.
          items:
            type: string
          example:
            - "CREATE TABLE IF NOT EXISTS demo.users (user_id uuid, email text, PRIMARY KEY (user_id));"
        warnings:
          type: array
          description: |
            Non-blocking advisories — e.g. dropping a column is irreversible, or a `vector` column
            needs driver 4.19.0 to describe correctly.
          items:
            type: string
          example: []
        targetIdentity:
          $ref: "#/components/schemas/SchemaIdentity"

    DdlExecuteRequest:
      type: object
      required: [cql]
      properties:
        cql:
          type: string
          description: User-reviewed CQL. Split with the real lexer, then executed in order.
          example: "ALTER TABLE demo.users WITH comment = 'Application users';"
        stopOnError:
          type: boolean
          default: true
        awaitSchemaAgreement:
          type: boolean
          description: Block until the cluster agrees on the new schema before returning.
          default: true
      example:
        cql: "ALTER TABLE demo.users WITH comment = 'Application users';"
        stopOnError: true

    DdlExecutionResult:
      type: object
      required: [success, executedCql]
      properties:
        success:
          type: boolean
          example: true
        executedCql:
          type: array
          description: Exactly what was sent to the cluster, in order.
          items:
            type: string
          example:
            - "ALTER TABLE demo.users WITH comment = 'Application users';"
        statementsExecuted:
          type: integer
          example: 1
        elapsedMillis:
          type: integer
          format: int64
          example: 87
        schemaAgreement:
          type: boolean
          description: Whether all nodes agreed on the resulting schema before the call returned.
          example: true
        warnings:
          type: array
          description: Server-side warnings returned by the cluster.
          items:
            type: string
          example: []
        affectedIdentity:
          $ref: "#/components/schemas/SchemaIdentity"

    ########################################################################
    # query execution (§5.1)
    ########################################################################

    ConsistencyLevel:
      type: string
      enum:
        - ANY
        - ONE
        - TWO
        - THREE
        - QUORUM
        - ALL
        - LOCAL_ONE
        - LOCAL_QUORUM
        - EACH_QUORUM
      example: LOCAL_QUORUM

    SerialConsistencyLevel:
      type: string
      description: Applies to the Paxos phase of LWT statements only.
      enum: [SERIAL, LOCAL_SERIAL]
      example: LOCAL_SERIAL

    CqlValue:
      description: |
        A single CQL value, JSON-encoded by type:

        | CQL type | JSON |
        | --- | --- |
        | `text`, `varchar`, `ascii`, `inet`, `duration` | string |
        | `int`, `smallint`, `tinyint`, `float`, `double` | number |
        | `bigint`, `varint`, `counter`, `decimal` | **string** (exceeds JS safe-integer range) |
        | `boolean` | boolean |
        | `uuid`, `timeuuid` | string |
        | `timestamp` | ISO-8601 string |
        | `date`, `time` | string |
        | `blob` | base64 string |
        | `list`, `set`, `vector` | array |
        | `map` | object, or array of `{key, value}` for non-string keys |
        | `tuple` | array |
        | UDT | object |
        | `null` | `null` |

        The literal string `"$unset"` means **unset**, which is not the same as `null` in
        Cassandra — an unset column is not written at all, whereas `null` writes a tombstone.
        Preserving that distinction is a requirement (plan §7).
      example: "ops@example.com"

    QueryRequest:
      type: object
      required: [cql]
      properties:
        cql:
          type: string
          description: A single statement. Use `splitCqlScript` first for multi-statement scripts.
          example: SELECT * FROM demo.users WHERE user_id = ?
        positionalValues:
          type: array
          description: Bind values for `?` markers.
          items:
            $ref: "#/components/schemas/CqlValue"
          example: ["1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"]
        namedValues:
          type: object
          description: Bind values for `:name` markers.
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
        keyspace:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Keyspace to run in when the statement is not fully qualified.
          example: demo
        consistency:
          allOf:
            - $ref: "#/components/schemas/ConsistencyLevel"
          default: LOCAL_ONE
        serialConsistency:
          $ref: "#/components/schemas/SerialConsistencyLevel"
        fetchSize:
          type: integer
          description: Page size. Default 500 (plan §5.1).
          minimum: 1
          maximum: 10000
          default: 500
          example: 500
        timeoutMillis:
          type: integer
          description: Per-query timeout; overrides the connection default.
          minimum: 100
          example: 30000
        tracing:
          type: boolean
          description: |
            `setTracing(true)` — the `TRACING ON` equivalent. The trace is fetched separately with
            `getQueryTrace`.
          default: false
        idempotent:
          type: boolean
          description: Marks the statement safe for speculative execution and retries.
          default: false
        pageAllRows:
          type: boolean
          description: |
            Reserved for export paths. The interactive API always returns a single page —
            full-table reads go through a bulk job, never through this endpoint.
          default: false
      example:
        cql: SELECT * FROM demo.users WHERE user_id = ?
        positionalValues: ["1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"]
        consistency: LOCAL_ONE
        fetchSize: 500
        tracing: false

    ColumnMetadata:
      type: object
      description: Result-set column descriptor, used by the grid to pick a renderer/editor.
      required: [name, type]
      properties:
        name:
          type: string
          example: email
        type:
          type: string
          example: text
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        primaryKeyColumn:
          type: boolean
          description: |
            Whether this column is part of the source table's primary key. The grid uses this to
            decide whether the result set is editable at all.
          example: false
        kind:
          oneOf:
            - $ref: "#/components/schemas/ColumnKind"
            - type: "null"
        collection:
          type: boolean
          example: false
        vector:
          type: boolean
          example: false
        vectorDimensions:
          type: [integer, "null"]
          example: null
        udt:
          type: boolean
          example: false
        similarity:
          type: boolean
          description: '`true` for `similarity_*` projections, rendered as a score column.'
          example: false

    QueryResult:
      type: object
      description: |
        One page of results plus the handles needed to page further. `nextPageToken` is `null`
        on the last page.
      required: [resultHandle, queryId, columns, rows, rowCount, hasMorePages]
      properties:
        resultHandle:
          type: string
          description: Server-side handle for this result set; pass to the paging endpoints.
          example: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW
        queryId:
          type: string
          format: uuid
          description: Identifier of this execution — used for cancellation and trace retrieval.
          example: 2c9f6a7d-4b3e-4c9d-9f21-0b7a1e5d6c33
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnMetadata"
        rows:
          type: array
          description: |
            Row-major. Each row is an object keyed by column name, values encoded per `CqlValue`.
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CqlValue"
        rowCount:
          type: integer
          description: Rows in **this page**, not in the whole result.
          example: 500
        pageNumber:
          type: integer
          description: 1-based index of this page within the current paging session.
          example: 1
        hasMorePages:
          type: boolean
          example: true
        nextPageToken:
          type: [string, "null"]
          description: |
            **Opaque.** A server-side handle onto the driver's `PagingState` — clients must never
            construct, decode or persist one beyond the result handle's TTL.
          example: eyJoIjoicnNfMDFKOFowUUY5VjNUWjJIOEc2TTRCN0sxUVciLCJwIjo0Mn0
        previousPageToken:
          type: [string, "null"]
          description: Opaque token for the preceding page; `null` on the first page.
          example: null
        applied:
          type: [boolean, "null"]
          description: |
            The LWT `[applied]` flag, surfaced distinctly from the row data so the grid can show
            it as a first-class outcome (plan §5.1). `null` for non-LWT statements.
          example: null
        wasVoid:
          type: boolean
          description: '`true` for statements that return no rows (INSERT/UPDATE/DELETE/DDL).'
          example: false
        elapsedMillis:
          type: integer
          format: int64
          example: 34
        warnings:
          type: array
          items:
            type: string
          example: []
        tracingId:
          type: [string, "null"]
          format: uuid
          description: Present when the statement ran with tracing enabled.
          example: null
        similarityColumns:
          type: array
          description: Names of similarity projections in this result set, for score rendering.
          items:
            type: string
          example: []
        coordinator:
          type: string
          example: 127.0.0.1:9042
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
      example:
        resultHandle: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW
        queryId: 2c9f6a7d-4b3e-4c9d-9f21-0b7a1e5d6c33
        columns:
          - name: user_id
            type: uuid
            keyspace: demo
            table: users
            primaryKeyColumn: true
            kind: PARTITION_KEY
          - name: email
            type: text
            keyspace: demo
            table: users
            primaryKeyColumn: false
            kind: REGULAR
        rows:
          - user_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            email: ops@example.com
        rowCount: 1
        pageNumber: 1
        hasMorePages: false
        nextPageToken: null
        previousPageToken: null
        applied: null
        wasVoid: false
        elapsedMillis: 34
        consistency: LOCAL_ONE

    PageRequest:
      type: object
      required: [pageToken]
      properties:
        pageToken:
          type: string
          description: |
            The opaque `nextPageToken` / `previousPageToken` from the previous `QueryResult`.
            Must belong to the same `resultHandle`.
          example: eyJoIjoicnNfMDFKOFowUUY5VjNUWjJIOEc2TTRCN0sxUVciLCJwIjo0Mn0
        fetchSize:
          type: integer
          description: Optionally change the page size for this and subsequent fetches.
          minimum: 1
          maximum: 10000
          example: 500

    ResultSetState:
      type: object
      required: [resultHandle, columns, expiresAt]
      properties:
        resultHandle:
          type: string
          example: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW
        cql:
          type: string
          example: SELECT * FROM demo.users
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnMetadata"
        pagesFetched:
          type: integer
          example: 3
        rowsFetched:
          type: integer
          format: int64
          example: 1500
        hasMorePages:
          type: boolean
          example: true
        editable:
          type: boolean
          description: Mirrors `checkRowEditability` — full primary key projected?
          example: true
        sourceTable:
          oneOf:
            - $ref: "#/components/schemas/SchemaIdentity"
            - type: "null"
        expiresAt:
          type: string
          format: date-time
          example: "2026-08-17T10:45:00Z"

    QueryCancellationResult:
      type: object
      required: [queryId, cancelled]
      properties:
        queryId:
          type: string
          format: uuid
        cancelled:
          type: boolean
          example: true
        state:
          type: string
          enum: [CANCELLED, ALREADY_COMPLETED, NOT_FOUND]
          example: CANCELLED
        message:
          type: string
          example: Query cancelled after 4.2s.

    QueryTrace:
      type: object
      description: The `system_traces` timeline for a traced query.
      required: [tracingId, requestType, events]
      properties:
        tracingId:
          type: string
          format: uuid
          example: 7f4c2b91-1d5e-11f0-9c3d-0242ac120002
        requestType:
          type: string
          example: Execute CQL3 query
        coordinator:
          type: string
          example: 127.0.0.1
        durationMicros:
          type: integer
          format: int64
          example: 41230
        startedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:31:02.115Z"
        parameters:
          type: object
          additionalProperties:
            type: string
          example:
            consistency_level: LOCAL_ONE
            page_size: "500"
            query: SELECT * FROM demo.users
        events:
          type: array
          items:
            $ref: "#/components/schemas/QueryTraceEvent"

    QueryTraceEvent:
      type: object
      required: [activity, source, sourceElapsedMicros]
      properties:
        activity:
          type: string
          example: Parsing SELECT * FROM demo.users
        source:
          type: string
          example: 127.0.0.1
        sourceElapsedMicros:
          type: integer
          format: int64
          example: 132
        threadName:
          type: string
          example: Native-Transport-Requests-1
        timestamp:
          type: string
          format: date-time
          example: "2026-08-17T10:31:02.115Z"

    BatchType:
      type: string
      enum: [LOGGED, UNLOGGED, COUNTER]
      example: LOGGED

    BatchRequest:
      type: object
      required: [type, statements]
      properties:
        type:
          $ref: "#/components/schemas/BatchType"
        statements:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BatchStatement"
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        serialConsistency:
          $ref: "#/components/schemas/SerialConsistencyLevel"
        timestamp:
          type: integer
          format: int64
          description: Batch-level `USING TIMESTAMP`, in microseconds since epoch.
          example: 1755424262000000
        previewOnly:
          type: boolean
          description: Assemble and analyse the batch without executing it.
          default: false
      example:
        type: LOGGED
        statements:
          - cql: "INSERT INTO demo.users (user_id, email) VALUES (?, ?)"
            positionalValues: ["1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d", "ops@example.com"]
        consistency: LOCAL_QUORUM
        previewOnly: false

    BatchStatement:
      type: object
      required: [cql]
      properties:
        cql:
          type: string
          example: "INSERT INTO demo.users (user_id, email) VALUES (?, ?)"
        positionalValues:
          type: array
          items:
            $ref: "#/components/schemas/CqlValue"
        namedValues:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"

    BatchResult:
      type: object
      required: [assembledCql, statementCount, spansMultiplePartitions, executed]
      properties:
        assembledCql:
          type: string
          example: |
            BEGIN BATCH
              INSERT INTO demo.users (user_id, email) VALUES (?, ?);
            APPLY BATCH;
        statementCount:
          type: integer
          example: 1
        spansMultiplePartitions:
          type: boolean
          description: |
            Drives the multi-partition batch anti-pattern warning. A batch spanning partitions
            costs the coordinator far more than parallel single-partition writes.
          example: false
        distinctPartitions:
          type: integer
          example: 1
        warnings:
          type: array
          items:
            type: string
          example: []
        executed:
          type: boolean
          description: '`false` when `previewOnly` was set.'
          example: true
        applied:
          type: [boolean, "null"]
          description: '`[applied]` when the batch contained conditional statements.'
          example: null
        elapsedMillis:
          type: integer
          format: int64
          example: 12

    CqlScriptSplitRequest:
      type: object
      required: [cql]
      properties:
        cql:
          type: string
          example: |
            CREATE FUNCTION demo.f(a int) RETURNS NULL ON NULL INPUT RETURNS int
              LANGUAGE java AS 'return a + 1;';
            SELECT * FROM demo.users WHERE email = 'a;b';
        cursorOffset:
          type: integer
          description: |
            Character offset of the editor caret. When present, the statement containing it is
            flagged `underCursor: true`, which is what "run statement under cursor" uses.
          example: 40
      example:
        cql: "SELECT * FROM demo.users WHERE email = 'a;b'; SELECT 1;"
        cursorOffset: 5

    CqlScriptSplitResult:
      type: object
      required: [statements]
      properties:
        statements:
          type: array
          items:
            $ref: "#/components/schemas/CqlStatementSlice"
        errors:
          type: array
          description: Lexical errors — an unterminated string literal, for instance.
          items:
            $ref: "#/components/schemas/CqlSyntaxProblem"

    CqlStatementSlice:
      type: object
      required: [cql, startOffset, endOffset, index]
      properties:
        index:
          type: integer
          example: 0
        cql:
          type: string
          example: "SELECT * FROM demo.users WHERE email = 'a;b'"
        startOffset:
          type: integer
          example: 0
        endOffset:
          type: integer
          example: 44
        startLine:
          type: integer
          example: 1
        kind:
          type: string
          description: Coarse classification used for routing and for history badges.
          enum: [SELECT, INSERT, UPDATE, DELETE, BATCH, DDL, USE, TRUNCATE, GRANT, REVOKE, OTHER]
          example: SELECT
        underCursor:
          type: boolean
          example: true

    CqlLexResult:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/CqlToken"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CqlSyntaxProblem"

    CqlToken:
      type: object
      required: [type, text, startOffset, endOffset]
      properties:
        type:
          type: string
          enum:
            - KEYWORD
            - IDENTIFIER
            - QUOTED_IDENTIFIER
            - STRING
            - NUMBER
            - OPERATOR
            - PUNCTUATION
            - COMMENT
            - WHITESPACE
            - BIND_MARKER
            - EOF
          example: KEYWORD
        text:
          type: string
          example: SELECT
        startOffset:
          type: integer
          example: 0
        endOffset:
          type: integer
          example: 6
        line:
          type: integer
          example: 1
        column:
          type: integer
          example: 1

    CqlSyntaxProblem:
      type: object
      required: [message, offset]
      properties:
        message:
          type: string
          example: Unterminated string literal.
        offset:
          type: integer
          example: 38
        line:
          type: integer
          example: 1

    QueryHistoryEntry:
      type: object
      required: [id, cql, executedAt, success]
      properties:
        id:
          type: string
          format: uuid
          example: 9e2f1a30-77c4-4a0b-8e51-2d6b4f8a1c02
        connectionId:
          type: string
          format: uuid
        connectionName:
          type: string
          example: local-dev
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        cql:
          type: string
          example: SELECT * FROM demo.users LIMIT 10
        executedAt:
          type: string
          format: date-time
          example: "2026-08-17T10:31:02Z"
        elapsedMillis:
          type: integer
          format: int64
          example: 34
        rowCount:
          type: integer
          format: int64
          example: 10
        success:
          type: boolean
          example: true
        errorMessage:
          type: [string, "null"]
          example: null
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"

    QueryHistoryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueryHistoryEntry"
        total:
          type: integer
          example: 214
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0

    SavedScriptRequest:
      type: object
      required: [name, cql]
      properties:
        name:
          type: string
          example: Daily signup count
        cql:
          type: string
          example: SELECT count(*) FROM demo.users WHERE created_at > ?
        folder:
          type: string
          description: Virtual folder path for the script tree.
          example: /reports
        favourite:
          type: boolean
          default: false
        connectionId:
          type: [string, "null"]
          format: uuid
          description: Optional default connection for this script.
        description:
          type: string

    SavedScript:
      allOf:
        - $ref: "#/components/schemas/SavedScriptRequest"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
              example: 3b6d0f9c-6d2b-4d0e-9c1a-3c7f2e1b8a90
            createdAt:
              type: string
              format: date-time
              example: "2026-08-16T14:02:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2026-08-17T09:41:12Z"

    ########################################################################
    # data browsing & editing (§7)
    ########################################################################

    RowInsertRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: |
            Column name → value. Omit a column to leave it *unset*; send `null` to write a
            tombstone; send `"$unset"` to be explicit about unset.
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
        ttlSeconds:
          type: integer
          minimum: 0
          description: '`USING TTL`. `0` or absent means no TTL.'
          example: 86400
        timestampMicros:
          type: integer
          format: int64
          description: '`USING TIMESTAMP`, microseconds since epoch.'
          example: 1755424262000000
        ifNotExists:
          type: boolean
          description: LWT insert; the result reports `applied`.
          default: false
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        serialConsistency:
          $ref: "#/components/schemas/SerialConsistencyLevel"
        previewOnly:
          type: boolean
          description: Return the generated statement without executing it.
          default: false
      example:
        values:
          user_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
          created_at: "2026-08-17T10:31:02Z"
          email: ops@example.com
        ttlSeconds: 86400
        ifNotExists: true

    RowUpdateRequest:
      type: object
      description: |
        `primaryKey` **must** contain every partition-key and clustering-key column of the table.
        Anything less is rejected with `422` and the missing column names.
      required: [primaryKey, values]
      properties:
        primaryKey:
          type: object
          description: Complete primary key of the row being updated.
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
          example:
            user_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            created_at: "2026-08-17T10:31:02Z"
        values:
          type: object
          description: Columns to set. Must not contain primary-key columns.
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
          example:
            email: new@example.com
        ttlSeconds:
          type: integer
          minimum: 0
          example: 0
        timestampMicros:
          type: integer
          format: int64
        condition:
          type: string
          description: |
            Optional LWT condition, e.g. `email = 'old@example.com'` or `IF EXISTS`. Rendered
            after `IF`.
          example: "email = 'ops@example.com'"
        ifExists:
          type: boolean
          default: false
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        serialConsistency:
          $ref: "#/components/schemas/SerialConsistencyLevel"
        previewOnly:
          type: boolean
          default: false

    RowDeleteRequest:
      type: object
      required: [primaryKey]
      properties:
        primaryKey:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
          example:
            user_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            created_at: "2026-08-17T10:31:02Z"
        columns:
          type: array
          description: |
            Delete only these columns rather than the whole row. Must not name primary-key
            columns.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: []
        timestampMicros:
          type: integer
          format: int64
        ifExists:
          type: boolean
          default: false
        condition:
          type: string
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        previewOnly:
          type: boolean
          description: Delete always shows a preview in the UI before it is executed (plan §7).
          default: false

    RowMutationResult:
      type: object
      required: [executed, cql]
      properties:
        executed:
          type: boolean
          description: '`false` when `previewOnly` was set.'
          example: true
        cql:
          type: string
          description: The exact generated statement — always shown to the user.
          example: "UPDATE demo.users USING TTL 86400 SET email = 'new@example.com' WHERE user_id = 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d AND created_at = '2026-08-17T10:31:02Z'"
        applied:
          type: [boolean, "null"]
          description: '`[applied]` for conditional statements; `null` otherwise.'
          example: null
        currentValues:
          type: [object, "null"]
          description: For a failed LWT, the values Cassandra returned alongside `[applied]=false`.
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
        elapsedMillis:
          type: integer
          format: int64
          example: 9
        warnings:
          type: array
          items:
            type: string

    StatementKind:
      type: string
      enum: [INSERT, UPDATE, DELETE]
      example: INSERT

    RowStatementGenerationRequest:
      type: object
      required: [statementKind, rows]
      properties:
        statementKind:
          $ref: "#/components/schemas/StatementKind"
        rows:
          type: array
          minItems: 1
          description: |
            The selected rows, as column→value maps. For `UPDATE`/`DELETE` each row must contain
            the complete primary key.
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CqlValue"
        columns:
          type: array
          description: Restrict generated statements to these columns; default is every column present.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        ttlSeconds:
          type: integer
          minimum: 0
        timestampMicros:
          type: integer
          format: int64
        includeIfConditions:
          type: boolean
          description: Emit `IF NOT EXISTS` (INSERT) / `IF EXISTS` (UPDATE, DELETE).
          default: false
        asBatch:
          type: boolean
          description: Wrap the output in `BEGIN BATCH … APPLY BATCH`.
          default: false
        formatted:
          type: boolean
          default: true
      example:
        statementKind: INSERT
        rows:
          - user_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            email: ops@example.com
        includeIfConditions: false
        asBatch: false

    RowStatementGenerationResult:
      type: object
      required: [statements, cql]
      properties:
        statements:
          type: array
          items:
            type: string
          example:
            - "INSERT INTO demo.users (user_id, email) VALUES (1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, 'ops@example.com');"
        cql:
          type: string
          description: All statements joined — what goes to the editor or the clipboard.
          example: "INSERT INTO demo.users (user_id, email) VALUES (1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, 'ops@example.com');"
        rowCount:
          type: integer
          example: 1
        warnings:
          type: array
          items:
            type: string
          example: []

    RowEditabilityRequest:
      type: object
      required: [projectedColumns]
      properties:
        projectedColumns:
          type: array
          description: Column names the result set actually projects.
          items:
            type: string
          example: [user_id, email]
        resultHandle:
          type: string
          description: Optional — lets the server answer from the cached result metadata instead.
          example: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW

    RowEditabilityResult:
      type: object
      required: [editable, requiredKeyColumns, missingKeyColumns]
      properties:
        editable:
          type: boolean
          example: false
        requiredKeyColumns:
          type: array
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [user_id, created_at]
        missingKeyColumns:
          type: array
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [created_at]
        reason:
          type: string
          description: |
            Shown verbatim to the user. Never fail silently — always say *why* the result set is
            read-only (plan §7).
          example: This result set does not project created_at, part of the primary key of
            demo.users, so rows cannot be edited in place. Add it to the SELECT clause.
        suggestedCql:
          type: string
          description: The same query with the missing key columns added.
          example: SELECT user_id, created_at, email FROM demo.users

    ########################################################################
    # jobs & bulk (§5.2 – §5.5)
    ########################################################################

    JobStatus:
      type: string
      description: |
        Job lifecycle: `QUEUED → RUNNING → SUCCEEDED | FAILED | CANCELLED`. The three terminal
        states are final; no job leaves them.
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
      example: RUNNING

    JobType:
      type: string
      enum:
        - UNLOAD
        - LOAD
        - COUNT
        - DUMP
        - RESTORE
        - KEYSPACE_COPY
        - DUPLICATE_TABLE
        - FILE_IMPORT
        - JDBC_IMPORT
        - EXPORT
      example: UNLOAD

    BulkOperation:
      type: string
      description: The DSBulk workflow a job maps onto.
      enum: [UNLOAD, LOAD, COUNT]
      example: UNLOAD

    BulkEngine:
      type: string
      description: |
        * `NATIVE` — cassyx's token-range parallel engine (plan §5.2).
        * `DSBULK` — the embedded DSBulk runner in a separate JVM process (plan §5.3).
        * `AUTO` — server chooses by estimated size and cluster capability.

        Both engines ship until the §11 benchmark decides the default routing.
      enum: [AUTO, NATIVE, DSBULK]
      default: AUTO
      example: AUTO

    ExportFormat:
      type: string
      description: |
        `PARQUET` is cassyx's addition and the right default for analytics handoff; `XML` and
        `XLSX` come from the NoSQL Manager parity list. Vectors encode as JSON arrays in
        CSV/JSON and as native list types in Parquet.
      enum: [CSV, JSON, JSONL, PARQUET, XML, XLSX]
      example: CSV

    SinkType:
      type: string
      enum: [DOWNLOAD, VOLUME_PATH, S3]
      example: DOWNLOAD

    UnloadSink:
      type: object
      description: |
        Where the unload writes. `DOWNLOAD` retains the artifact server-side and exposes it via
        `downloadJobArtifact` — bulk data never round-trips through the browser.
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/SinkType"
        path:
          type: string
          description: Mounted volume path, for `VOLUME_PATH`. Server-side, must be writable.
          example: /data/exports/users
        s3Uri:
          type: string
          description: Target for `S3`.
          example: s3://analytics-bucket/exports/users/
        fileNamePattern:
          type: string
          example: "users-%d.csv"
        compression:
          type: string
          enum: [NONE, GZIP, BZIP2, LZ4, SNAPPY, ZSTD, XZ, DEFLATE]
          default: NONE
          example: NONE
        maxFileSizeBytes:
          type: integer
          format: int64
          description: Roll to a new file at this size; `0` disables rolling.
          example: 0

    LoadSource:
      type: object
      description: Exactly one of `uploadId`, `path` or `s3Uri`.
      properties:
        uploadId:
          type: string
          description: Handle from `uploadBulkSourceFile`.
          example: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
        path:
          type: string
          description: Server-side mounted path.
          example: /data/imports/users.csv
        s3Uri:
          type: string
          example: s3://analytics-bucket/imports/users.csv
        format:
          allOf:
            - $ref: "#/components/schemas/ExportFormat"
          description: Source format. `PARQUET`/`XLSX` are converted before the DSBulk load step.
        compression:
          type: string
          enum: [AUTO, NONE, GZIP, BZIP2, LZ4, SNAPPY, ZSTD, XZ, DEFLATE]
          default: AUTO

    #### DSBulk settings surface — every field optional #######################

    DsbulkSettings:
      type: object
      description: |
        **The full DSBulk settings surface**, exposed as a nested object in which *every field is
        optional* (plan §5.3). Anything omitted is auto-derived and reported back with
        `auto: true`.

        The groups mirror DSBulk's own configuration namespaces one-for-one, so a value set here
        maps mechanically onto `--connector.csv.delimiter`-style arguments and onto the generated
        HOCON. Each group also carries an `extra` map for settings not modelled explicitly, so a
        new DSBulk option never requires an API change.
      properties:
        connector:
          $ref: "#/components/schemas/DsbulkConnectorSettings"
        schema:
          $ref: "#/components/schemas/DsbulkSchemaSettings"
        batch:
          $ref: "#/components/schemas/DsbulkBatchSettings"
        codec:
          $ref: "#/components/schemas/DsbulkCodecSettings"
        engine:
          $ref: "#/components/schemas/DsbulkEngineSettings"
        executor:
          $ref: "#/components/schemas/DsbulkExecutorSettings"
        log:
          $ref: "#/components/schemas/DsbulkLogSettings"
        monitoring:
          $ref: "#/components/schemas/DsbulkMonitoringSettings"
        driver:
          $ref: "#/components/schemas/DsbulkDriverSettings"
        s3:
          $ref: "#/components/schemas/DsbulkS3Settings"
        stats:
          $ref: "#/components/schemas/DsbulkStatsSettings"
        extra:
          type: object
          description: |
            Raw escape hatch — keys are full DSBulk setting paths, e.g.
            `dsbulk.connector.csv.ignoreLeadingWhitespaces`. Applied last, overriding everything.
          additionalProperties:
            type: string
          example: {}
      example:
        connector:
          csv:
            delimiter: ","
            header: true
        batch:
          mode: PARTITION_KEY
          maxBatchStatements: 32

    DsbulkConnectorSettings:
      type: object
      properties:
        name:
          type: string
          enum: [csv, json]
          example: csv
        csv:
          $ref: "#/components/schemas/DsbulkCsvConnectorSettings"
        json:
          $ref: "#/components/schemas/DsbulkJsonConnectorSettings"

    DsbulkCsvConnectorSettings:
      type: object
      description: '`connector.csv.*`. Every field optional.'
      properties:
        url:
          type: string
          description: Source or target URL; usually derived from the job's sink/source.
          example: /data/exports/users
        urlfile:
          type: string
        fileNamePattern:
          type: string
          example: "**/*.csv"
        fileNameFormat:
          type: string
          example: "output-%06d.csv"
        recursive:
          type: boolean
          example: false
        header:
          type: boolean
          example: true
        delimiter:
          type: string
          example: ","
        quote:
          type: string
          example: "\""
        escape:
          type: string
          example: "\\"
        comment:
          type: string
          example: ""
        newline:
          type: string
          example: auto
        encoding:
          type: string
          example: UTF-8
        skipRecords:
          type: integer
          format: int64
          example: 0
        maxRecords:
          type: integer
          format: int64
          description: '`-1` for unlimited.'
          example: -1
        maxConcurrentFiles:
          type: string
          description: |
            Number or `NC` multiplier form (e.g. `0.5C`). Auto-derived to the split count for
            unload (plan §5.3).
          example: AUTO
        maxCharsPerColumn:
          type: integer
          example: 4096
        maxColumns:
          type: integer
          example: 512
        ignoreLeadingWhitespaces:
          type: boolean
          example: false
        ignoreTrailingWhitespaces:
          type: boolean
          example: false
        nullValue:
          type: [string, "null"]
          example: null
        emptyValue:
          type: [string, "null"]
        normalizeLineEndingsInQuotes:
          type: boolean
          example: false
        compression:
          type: string
          example: none
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkJsonConnectorSettings:
      type: object
      description: '`connector.json.*`. Every field optional.'
      properties:
        url:
          type: string
        urlfile:
          type: string
        fileNamePattern:
          type: string
          example: "**/*.json"
        fileNameFormat:
          type: string
          example: "output-%06d.json"
        mode:
          type: string
          enum: [MULTI_DOCUMENT, SINGLE_DOCUMENT]
          example: MULTI_DOCUMENT
        recursive:
          type: boolean
        encoding:
          type: string
          example: UTF-8
        skipRecords:
          type: integer
          format: int64
        maxRecords:
          type: integer
          format: int64
        maxConcurrentFiles:
          type: string
        parserFeatures:
          type: object
          additionalProperties:
            type: boolean
        generatorFeatures:
          type: object
          additionalProperties:
            type: boolean
        serializationFeatures:
          type: object
          additionalProperties:
            type: boolean
        deserializationFeatures:
          type: object
          additionalProperties:
            type: boolean
        prettyPrint:
          type: boolean
          example: false
        compression:
          type: string
          example: none
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkSchemaSettings:
      type: object
      description: '`schema.*`. Every field optional.'
      properties:
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        query:
          type: string
          description: Custom query, mutually exclusive with `keyspace`/`table`.
          example: SELECT user_id, email FROM demo.users
        mapping:
          type: string
          description: |
            Field-to-column mapping in DSBulk's syntax, e.g.
            `0=user_id, 1=email` or `user_id=user_id, mail=email`.
          example: "user_id=user_id, email=email"
        nullToUnset:
          type: boolean
          description: Write nothing rather than a tombstone for null fields.
          example: true
        allowExtraFields:
          type: boolean
          description: >-
            Upstream DSBulk default is `true`. Examples must match the shipped defaults —
            a wrong example gets copied into implementations as if it were one.
          example: true
        allowMissingFields:
          type: boolean
          example: false
        splits:
          type: string
          description: |
            Token-range split count. Auto-derived to `nodes × cores × 8`, deliberately oversplit
            (plan §5.2, §5.3).
          example: 8C
        queryTimestamp:
          type: string
          example: ""
        queryTtl:
          type: integer
          example: -1
        preserveTimestamp:
          type: boolean
          example: false
        preserveTtl:
          type: boolean
          example: false
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkBatchSettings:
      type: object
      description: '`batch.*`. Every field optional.'
      properties:
        mode:
          type: string
          description: |
            `PARTITION_KEY` for load; `DISABLED` when the target has no clustering key
            (plan §5.3).
          enum: [DISABLED, PARTITION_KEY, REPLICA_SET]
          example: PARTITION_KEY
        maxBatchStatements:
          type: integer
          description: Auto-derived to 32; dropped to 1 for counter tables.
          example: 32
        maxSizeInBytes:
          type: integer
          format: int64
          example: -1
        bufferSize:
          type: integer
          example: -1
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkCodecSettings:
      type: object
      description: |
        `codec.*`. Timestamp/date/time formats are inferred from column types and `nullStrings`
        from a sniffed sample (plan §5.3).
      properties:
        locale:
          type: string
          example: en_US
        timeZone:
          type: string
          example: UTC
        booleanStrings:
          type: array
          items:
            type: string
          example: ["1:0", "Y:N", "T:F", "YES:NO", "TRUE:FALSE"]
        booleanNumbers:
          type: array
          items:
            type: string
          example: ["1", "0"]
        number:
          type: string
          example: "#,###.##"
        formatNumbers:
          type: boolean
          example: false
        roundingStrategy:
          type: string
          example: UNNECESSARY
        overflowStrategy:
          type: string
          example: REJECT
        timestamp:
          type: string
          example: CQL_TIMESTAMP
        date:
          type: string
          example: ISO_LOCAL_DATE
        time:
          type: string
          example: ISO_LOCAL_TIME
        unit:
          type: string
          example: MILLISECONDS
        epoch:
          type: string
          example: "1970-01-01T00:00:00Z"
        nullStrings:
          type: array
          items:
            type: string
          example: ["", "NULL", "N/A"]
        binary:
          type: string
          enum: [BASE64, HEX]
          example: BASE64
        uuidStrategy:
          type: string
          example: RANDOM
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkEngineSettings:
      type: object
      description: '`engine.*`. Every field optional.'
      properties:
        dryRun:
          type: boolean
          example: false
        executionId:
          type: string
          example: UNLOAD_20260817-120003-123456
        maxConcurrentQueries:
          type: string
          description: Auto-derived as `nodes × 32` for unload, capped by client cores.
          example: AUTO
        dataSizeSamplingEnabled:
          type: boolean
          example: true
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkExecutorSettings:
      type: object
      description: '`executor.*`. Every field optional.'
      properties:
        maxPerSecond:
          type: integer
          description: |
            Client-side throttle. Auto-derived to unthrottled (`-1`) for self-managed clusters.
            On Astra, DSBulk ≥1.9 detects and honours **server-side** rate limiting — that
            behaviour is left enabled rather than replaced by a client throttle (plan §5.3).
          example: -1
        maxInFlight:
          type: integer
          description: Auto-derived from node count × cores, capped by client cores.
          example: 1024
        maxBytesPerSecond:
          type: integer
          format: int64
          example: -1
        continuousPaging:
          $ref: "#/components/schemas/DsbulkContinuousPagingSettings"
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkContinuousPagingSettings:
      type: object
      description: DSE-only continuous paging (`executor.continuousPaging.*`).
      properties:
        enabled:
          type: boolean
          example: true
        pageSize:
          type: integer
          example: 5000
        pageUnit:
          type: string
          enum: [ROWS, BYTES]
          example: ROWS
        maxPages:
          type: integer
          example: 0
        maxPagesPerSecond:
          type: integer
          example: 0

    DsbulkLogSettings:
      type: object
      description: '`log.*`. Every field optional.'
      properties:
        directory:
          type: string
          description: Per-job log directory. Always set by cassyx so progress can be tailed.
          example: /var/lib/cassyx/jobs/6c8f2a10/logs
        verbosity:
          type: integer
          minimum: 0
          maximum: 2
          example: 1
        maxErrors:
          type: string
          description: Absolute count or a percentage string such as `1%`.
          example: "100"
        maxQueryStringLength:
          type: integer
          example: 500
        maxBoundValueLength:
          type: integer
          example: 50
        maxResultSetValueLength:
          type: integer
          example: 50
        checkpoint:
          type: object
          description: Checkpoint/resume settings, where supported.
          additionalProperties:
            type: string
        ansiMode:
          type: string
          example: normal
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkMonitoringSettings:
      type: object
      description: '`monitoring.*`. Every field optional.'
      properties:
        reportRate:
          type: string
          example: 5 seconds
        rateUnit:
          type: string
          example: SECONDS
        durationUnit:
          type: string
          example: MILLISECONDS
        expectedWrites:
          type: integer
          format: int64
          example: -1
        expectedReads:
          type: integer
          format: int64
          example: -1
        trackBytes:
          type: boolean
          example: true
        jmx:
          type: boolean
          example: false
        csv:
          type: boolean
          example: false
        console:
          type: boolean
          example: true
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkDriverSettings:
      type: object
      description: |
        `driver.*`. Connection coordinates are injected from the cassyx connection — including
        the Astra bundle — so credentials are never expressed here by the client.
      properties:
        basic:
          $ref: "#/components/schemas/DsbulkDriverBasicSettings"
        advanced:
          $ref: "#/components/schemas/DsbulkDriverAdvancedSettings"
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkDriverBasicSettings:
      type: object
      properties:
        requestConsistency:
          allOf:
            - $ref: "#/components/schemas/ConsistencyLevel"
          description: |
            Auto-derived: `LOCAL_ONE` for unload, `LOCAL_QUORUM` for load, `LOCAL_ONE` for
            Amazon Keyspaces (plan §5.3).
        requestSerialConsistency:
          $ref: "#/components/schemas/SerialConsistencyLevel"
        requestTimeout:
          type: string
          example: 5 minutes
        requestPageSize:
          type: integer
          example: 5000
        requestDefaultIdempotence:
          type: boolean
          example: true
        sessionName:
          type: string
          example: cassyx-bulk
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkDriverAdvancedSettings:
      type: object
      properties:
        protocolCompression:
          type: string
          description: Auto-derived to `lz4` (plan §5.3).
          enum: [none, lz4, snappy]
          example: lz4
        connectionPoolLocalSize:
          type: integer
          example: 4
        connectionPoolRemoteSize:
          type: integer
          example: 1
        retryPolicyClass:
          type: string
          example: com.datastax.oss.dsbulk.workflow.commons.policies.retry.MultipleRetryPolicy
        maxRetries:
          type: integer
          example: 10
        heartbeatInterval:
          type: string
          example: 30 seconds
        metadataSchemaEnabled:
          type: boolean
          example: true
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkS3Settings:
      type: object
      description: |
        `s3.*`. Credentials supplied here are write-only; the generated HOCON preview masks them.
      properties:
        clientCacheSize:
          type: integer
          example: 20
        region:
          type: string
          example: eu-west-1
        profile:
          type: string
          example: default
        accessKeyId:
          type: string
          writeOnly: true
        secretAccessKey:
          type: string
          writeOnly: true
        sessionToken:
          type: string
          writeOnly: true
        endpoint:
          type: string
          description: Custom S3-compatible endpoint (MinIO, Ceph, …).
          example: https://s3.eu-west-1.amazonaws.com
        extra:
          type: object
          additionalProperties:
            type: string

    DsbulkStatsSettings:
      type: object
      description: '`stats.*` — the count workflow''s modes (plan §5.4).'
      properties:
        modes:
          type: array
          items:
            type: string
            enum: [global, ranges, hosts, partitions]
          example: [global, ranges, hosts, partitions]
        numPartitions:
          type: integer
          description: Top-N for the largest-partitions report.
          example: 10
        extra:
          type: object
          additionalProperties:
            type: string

    #### derived defaults ####################################################

    DerivedSetting:
      type: object
      description: |
        One resolved DSBulk setting. Rendered in the UI as an editable chip; `auto: true` shows
        the "auto" marker and `rationale` is its tooltip (plan §5.3).
      required: [path, value, auto]
      properties:
        path:
          type: string
          description: Full DSBulk setting path.
          example: batch.maxBatchStatements
        value:
          type: string
          description: The resolved value, rendered as a string exactly as it reaches DSBulk.
          example: "32"
        auto:
          type: boolean
          description: '`true` when cassyx derived it; `false` when the caller supplied it.'
          example: true
        upstreamDefault:
          type: string
          description: DSBulk's own default, shown as placeholder text in the field.
          example: "32"
        rationale:
          type: string
          description: Why this value was chosen. Empty for non-derived settings.
          example: 32 statements per batch; reduced to 1 automatically for counter tables.
        docsUrl:
          type: string
          format: uri
          description: Link to the upstream settings documentation for this option.
          example: https://docs.datastax.com/en/dsbulk/docs/reference/settings.html#batch.maxBatchStatements
        group:
          type: string
          description: Accordion group in the Advanced tab.
          enum: [connector, schema, batch, codec, engine, executor, log, monitoring, driver, s3, stats]
          example: batch
      example:
        path: batch.maxBatchStatements
        value: "32"
        auto: true
        upstreamDefault: "32"
        rationale: 32 statements per batch; reduced to 1 automatically for counter tables.
        group: batch

    BulkDefaultsRequest:
      type: object
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/BulkOperation"
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        query:
          type: string
          description: For query-driven unloads instead of `keyspace`/`table`.
        format:
          $ref: "#/components/schemas/ExportFormat"
        overrides:
          allOf:
            - $ref: "#/components/schemas/DsbulkSettings"
          description: "Caller-supplied values; these come back with `auto: false`."
      example:
        operation: UNLOAD
        keyspace: demo
        table: users
        format: CSV

    DerivedSettingsResponse:
      type: object
      required: [operation, settings, probe]
      properties:
        operation:
          $ref: "#/components/schemas/BulkOperation"
        engine:
          $ref: "#/components/schemas/BulkEngine"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/DerivedSetting"
        probe:
          $ref: "#/components/schemas/BulkProbeResult"
        warnings:
          type: array
          items:
            type: string
          example: []

    BulkProbeResult:
      type: object
      description: The cluster/target facts the derivations were computed from.
      properties:
        nodeCount:
          type: integer
          example: 3
        clientCores:
          type: integer
          example: 8
        flavour:
          $ref: "#/components/schemas/ClusterFlavour"
        hasClusteringKey:
          type: boolean
          example: true
        isCounterTable:
          type: boolean
          example: false
        serverSideRateLimiting:
          type: boolean
          description: '`true` on Astra, where DSBulk honours the server''s own rate limiting.'
          example: false
        estimatedRows:
          type: [integer, "null"]
          format: int64
          description: From a cached count job, if one exists.
          example: 10000000
        recommendedSplits:
          type: integer
          example: 10000

    BulkCommandPreviewRequest:
      type: object
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/BulkOperation"
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        query:
          type: string
        format:
          $ref: "#/components/schemas/ExportFormat"
        sink:
          $ref: "#/components/schemas/UnloadSink"
        source:
          $ref: "#/components/schemas/LoadSource"
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        operation: UNLOAD
        keyspace: demo
        table: users
        format: CSV

    BulkCommandPreview:
      type: object
      required: [command, argv, hocon]
      properties:
        command:
          type: string
          description: The copyable single-line invocation, with secrets masked.
          example: dsbulk unload -k demo -t users -url /data/exports/users -f /tmp/job.conf
        argv:
          type: array
          description: |
            The exact `String[]` passed to the DSBulk runner. Note that when embedded there is no
            `conf/` directory, so cassyx always generates a HOCON file and passes `-f` (plan §5.3).
          items:
            type: string
          example: [unload, -k, demo, -t, users, -f, /var/lib/cassyx/jobs/6c8f2a10/dsbulk.conf]
        hocon:
          type: string
          description: |
            The generated per-job HOCON, written into the job's temp dir — also a downloadable,
            reproducible artifact. Secrets are masked in this preview.
          example: |
            dsbulk {
              connector.name = csv
              connector.csv.url = "/data/exports/users"
              schema.keyspace = demo
              schema.table = users
              driver.basic.request.consistency = LOCAL_ONE
              driver.advanced.protocol.compression = lz4
            }
        maskedFields:
          type: array
          description: Setting paths whose values were masked in `command` and `hocon`.
          items:
            type: string
          example: [driver.advanced.auth-provider.password]
        derivedSettings:
          type: array
          items:
            $ref: "#/components/schemas/DerivedSetting"

    BulkSourceUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        format:
          $ref: "#/components/schemas/ExportFormat"

    BulkUpload:
      type: object
      required: [uploadId, fileName, sizeBytes, uploadedAt]
      properties:
        uploadId:
          type: string
          example: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
        fileName:
          type: string
          example: users.csv
        sizeBytes:
          type: integer
          format: int64
          example: 104857600
        format:
          $ref: "#/components/schemas/ExportFormat"
        uploadedAt:
          type: string
          format: date-time
          example: "2026-08-17T11:40:00Z"
        expiresAt:
          type: string
          format: date-time
          description: Staged uploads are reaped after this time if unused.
          example: "2026-08-18T11:40:00Z"

    UnloadJobRequest:
      type: object
      description: Supply either `keyspace` + `table`, or `query`.
      required: [format, sink]
      properties:
        name:
          type: string
          example: Export demo.users
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        query:
          type: string
          description: Custom `SELECT` to unload. Mutually exclusive with `keyspace`/`table`.
          example: SELECT user_id, email FROM demo.users WHERE created_at > '2026-01-01'
        columns:
          type: array
          description: Restrict projected columns; default is all.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        format:
          $ref: "#/components/schemas/ExportFormat"
        sink:
          $ref: "#/components/schemas/UnloadSink"
        engine:
          $ref: "#/components/schemas/BulkEngine"
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        templateId:
          type: [string, "null"]
          format: uuid
          description: Apply a saved job template before `dsbulkSettings` overrides.
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Export demo.users
        keyspace: demo
        table: users
        format: CSV
        engine: AUTO
        sink:
          type: DOWNLOAD
          fileNamePattern: "users-%d.csv"
          compression: NONE

    LoadJobRequest:
      type: object
      required: [keyspace, table, source]
      properties:
        name:
          type: string
          example: Load users.csv
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        source:
          $ref: "#/components/schemas/LoadSource"
        mapping:
          type: string
          description: Shorthand for `dsbulkSettings.schema.mapping`.
          example: "user_id=user_id, email=email"
        dryRun:
          type: boolean
          description: Validate and map without writing (`engine.dryRun`).
          default: false
        templateId:
          type: [string, "null"]
          format: uuid
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Load users.csv
        keyspace: demo
        table: users
        source:
          uploadId: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
          format: CSV
        dryRun: false

    CountJobRequest:
      type: object
      required: [keyspace, table]
      properties:
        name:
          type: string
          example: Count demo.users
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        modes:
          type: array
          description: Shorthand for `dsbulkSettings.stats.modes`.
          items:
            type: string
            enum: [global, ranges, hosts, partitions]
          example: [global, ranges, hosts, partitions]
        topPartitions:
          type: integer
          default: 10
          example: 10
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        keyspace: demo
        table: users
        modes: [global, ranges, partitions]
        topPartitions: 10

    JobProgress:
      type: object
      description: The same payload delivered by the SSE `progress` event.
      properties:
        rowsProcessed:
          type: integer
          format: int64
          example: 4210000
        totalRowsEstimate:
          type: [integer, "null"]
          format: int64
          example: 10000000
        percent:
          type: [number, "null"]
          format: double
          example: 42.1
        rowsPerSecond:
          type: integer
          format: int64
          example: 186420
        bytesWritten:
          type: integer
          format: int64
          example: 901234567
        elapsedMillis:
          type: integer
          format: int64
          example: 22580
        etaMillis:
          type: [integer, "null"]
          format: int64
          example: 31100
        splitsCompleted:
          type: integer
          description: Token-range splits finished — the native engine's work-stealing counter.
          example: 4103
        splitsTotal:
          type: integer
          example: 10000
        failures:
          type: integer
          format: int64
          example: 0
        currentPhase:
          type: string
          example: UNLOADING

    JobArtifact:
      type: object
      required: [artifactId, fileName, sizeBytes, contentType]
      properties:
        artifactId:
          type: string
          example: a1
        fileName:
          type: string
          example: users.csv
        sizeBytes:
          type: integer
          format: int64
          example: 2147483648
        contentType:
          type: string
          example: text/csv
        downloadUrl:
          type: string
          format: uri-reference
          example: /api/jobs/6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44/artifact?artifactId=a1
        checksumSha256:
          type: string
          example: 3c1f9e2d5b7a8c0e1f3a5c7e9b1d3f5079a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0
        kind:
          type: string
          enum: [DATA, HOCON, LOG, ERROR_REPORT, STATISTICS]
          example: DATA
        retainedUntil:
          type: string
          format: date-time
          example: "2026-08-24T12:00:53Z"

    Job:
      type: object
      description: |
        The Job resource — the shared substrate for every long-running operation (plan §5.5).
      required: [id, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44
        name:
          type: string
          example: Export demo.users
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        engine:
          $ref: "#/components/schemas/BulkEngine"
        connectionId:
          type: [string, "null"]
          format: uuid
          example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        targetConnectionId:
          type: [string, "null"]
          format: uuid
          description: Second connection, for cluster-to-cluster jobs.
          example: null
        identity:
          oneOf:
            - $ref: "#/components/schemas/SchemaIdentity"
            - type: "null"
          description: The table or keyspace this job operates on, fully qualified.
        createdAt:
          type: string
          format: date-time
          example: "2026-08-17T12:00:00Z"
        startedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-08-17T12:00:03Z"
        finishedAt:
          type: [string, "null"]
          format: date-time
          example: null
        durationMillis:
          type: [integer, "null"]
          format: int64
          example: null
        progress:
          $ref: "#/components/schemas/JobProgress"
        derivedSettings:
          type: array
          description: |
            Every setting the job actually ran with, each marked `auto: true` when derived
            (plan §5.3). Persisted so a completed job is reproducible.
          items:
            $ref: "#/components/schemas/DerivedSetting"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/JobArtifact"
        eventsUrl:
          type: string
          format: uri-reference
          description: The SSE progress stream for this job.
          example: /api/jobs/6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44/events
        logsUrl:
          type: string
          format: uri-reference
          example: /api/jobs/6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44/logs
        exitCode:
          type: [integer, "null"]
          description: Exit status of the DSBulk child process, for `DSBULK` jobs.
          example: null
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
          description: Populated when `status` is `FAILED`. Never contains credentials.
        statistics:
          oneOf:
            - $ref: "#/components/schemas/TableStatistics"
            - type: "null"
          description: Populated on a successful `COUNT` job.
      example:
        id: 6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44
        name: Export demo.users
        type: UNLOAD
        status: RUNNING
        engine: NATIVE
        connectionId: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        identity:
          kind: TABLE
          keyspace: demo
          table: users
          qualifiedName: demo.users
        createdAt: "2026-08-17T12:00:00Z"
        startedAt: "2026-08-17T12:00:03Z"
        finishedAt: null
        progress:
          rowsProcessed: 4210000
          totalRowsEstimate: 10000000
          percent: 42.1
          rowsPerSecond: 186420
          splitsCompleted: 4103
          splitsTotal: 10000
          failures: 0
        eventsUrl: /api/jobs/6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44/events
        artifacts: []

    JobPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
          example: 37
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0

    #### SSE event payloads ##################################################

    JobEvent:
      description: |
        Union of the `data:` payloads carried by the job SSE stream. The `event:` field of the
        frame selects which member applies — `status`, `progress`, `log`, `completed`, `error`.
        Generated clients should dispatch on the SSE event name, not by structural inspection.
      oneOf:
        - $ref: "#/components/schemas/JobStatusEvent"
        - $ref: "#/components/schemas/JobProgressEvent"
        - $ref: "#/components/schemas/JobLogEvent"
        - $ref: "#/components/schemas/JobCompletedEvent"
        - $ref: "#/components/schemas/JobErrorEvent"

    JobStatusEvent:
      type: object
      description: 'SSE `event: status` — emitted on every lifecycle transition.'
      required: [jobId, status, at]
      properties:
        jobId:
          type: string
          format: uuid
          example: 6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44
        status:
          $ref: "#/components/schemas/JobStatus"
        previousStatus:
          $ref: "#/components/schemas/JobStatus"
        at:
          type: string
          format: date-time
          example: "2026-08-17T12:00:03Z"
        message:
          type: string
          example: Job started on 3 nodes with 10000 splits.

    JobProgressEvent:
      allOf:
        - type: object
          description: 'SSE `event: progress` — throttled to roughly one per second while running.'
          required: [jobId]
          properties:
            jobId:
              type: string
              format: uuid
              example: 6c8f2a10-b4f9-4a1e-9a12-5f0a7e2d3b44
        - $ref: "#/components/schemas/JobProgress"

    JobLogEvent:
      type: object
      description: 'SSE `event: log` — one retained log line.'
      required: [jobId, level, message, at]
      properties:
        jobId:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/LogLevel"
        message:
          type: string
          example: Operation UNLOAD_20260817-120003-123456 started.
        at:
          type: string
          format: date-time
          example: "2026-08-17T12:00:03Z"
        source:
          type: string
          enum: [ENGINE, DSBULK, DRIVER]
          example: DSBULK

    JobCompletedEvent:
      type: object
      description: |
        'SSE `event: completed`' — emitted exactly once, immediately before the server closes the
        stream. Clients should treat receipt of this event as end-of-stream and not reconnect.
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: One of the terminal states.
        rowsProcessed:
          type: integer
          format: int64
          example: 10000000
        durationMillis:
          type: integer
          format: int64
          example: 53640
        artifact:
          oneOf:
            - $ref: "#/components/schemas/JobArtifact"
            - type: "null"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/JobArtifact"
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"

    JobErrorEvent:
      type: object
      description: |
        'SSE `event: error`' — a non-fatal failure (a rejected record, a retried range). Fatal
        failures arrive as a `completed` event with `status: FAILED`.
      required: [jobId, problem]
      properties:
        jobId:
          type: string
          format: uuid
        problem:
          $ref: "#/components/schemas/Problem"
        recoverable:
          type: boolean
          example: true
        failureCount:
          type: integer
          format: int64
          example: 3

    LogLevel:
      type: string
      enum: [TRACE, DEBUG, INFO, WARN, ERROR]
      example: INFO

    JobLogLine:
      type: object
      required: [at, level, message]
      properties:
        at:
          type: string
          format: date-time
          example: "2026-08-17T12:00:03Z"
        level:
          $ref: "#/components/schemas/LogLevel"
        message:
          type: string
          example: Operation UNLOAD_20260817-120003-123456 started.
        source:
          type: string
          enum: [ENGINE, DSBULK, DRIVER]
          example: DSBULK

    JobLogPage:
      type: object
      required: [jobId, lines]
      properties:
        jobId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JobLogLine"
        truncated:
          type: boolean
          description: '`true` when older lines were dropped by the `tail` limit.'
          example: true
        totalLines:
          type: integer
          example: 4821

    JobTemplateRequest:
      type: object
      required: [name, operation, dsbulkSettings]
      properties:
        name:
          type: string
          example: Fast unload to Parquet
        description:
          type: string
          example: Oversplit, LZ4, 64 concurrent files.
        operation:
          $ref: "#/components/schemas/BulkOperation"
        format:
          $ref: "#/components/schemas/ExportFormat"
        engine:
          $ref: "#/components/schemas/BulkEngine"
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Fast unload to Parquet
        operation: UNLOAD
        format: PARQUET
        engine: NATIVE
        dsbulkSettings:
          schema:
            splits: 16C
          executor:
            maxInFlight: 2048

    JobTemplate:
      allOf:
        - $ref: "#/components/schemas/JobTemplateRequest"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
              example: 5d1f7b22-0c33-4c9a-8b1e-9a7d6c5f4e30
            createdAt:
              type: string
              format: date-time
              example: "2026-08-16T08:00:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2026-08-17T11:00:00Z"

    ########################################################################
    # vector / SAI / ANN (§6)
    ########################################################################

    SimilarityFunction:
      type: string
      description: |
        The `similarity_function` of a vector SAI index, emitted into `WITH OPTIONS`. `cosine` is
        Cassandra's default.
      enum: [cosine, dot_product, euclidean]
      default: cosine
      example: cosine

    VectorColumn:
      type: object
      required: [identity, name, dimensions, elementType]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        dimensions:
          type: integer
          minimum: 1
          example: 1536
        elementType:
          type: string
          description: Currently only `float` is supported by Cassandra.
          enum: [float]
          example: float
        cqlType:
          type: string
          example: "vector<float, 1536>"
        index:
          oneOf:
            - $ref: "#/components/schemas/SaiIndex"
            - type: "null"
          description: The SAI index on this column, if one exists. `null` means ANN is unavailable.
        similarityFunction:
          oneOf:
            - $ref: "#/components/schemas/SimilarityFunction"
            - type: "null"
      example:
        identity:
          kind: COLUMN
          keyspace: demo
          table: products
          column: embedding
          qualifiedName: demo.products.embedding
        name: embedding
        dimensions: 1536
        elementType: float
        cqlType: "vector<float, 1536>"
        similarityFunction: cosine

    VectorColumnDefinition:
      type: object
      required: [name, dimensions]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        dimensions:
          type: integer
          minimum: 1
          maximum: 8192
          example: 1536
        elementType:
          type: string
          enum: [float]
          default: float
        createIndex:
          type: boolean
          description: Also create an SAI index on the new column in the same operation.
          default: false
        indexName:
          $ref: "#/components/schemas/CqlIdentifier"
        similarityFunction:
          $ref: "#/components/schemas/SimilarityFunction"
        sourceModel:
          type: string
          description: |
            SAI `source_model` hint (e.g. `openai-v3-large`, `bert`, `gecko`, `other`), which
            tunes the index's internal parameters for a known embedding model.
          example: openai-v3-large
      example:
        name: embedding
        dimensions: 1536
        elementType: float
        createIndex: true
        indexName: products_embedding_idx
        similarityFunction: cosine
        sourceModel: openai-v3-large

    SaiIndex:
      type: object
      required: [identity, name, target, options]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        target:
          type: string
          example: embedding
        targetColumn:
          allOf:
            - $ref: "#/components/schemas/SchemaIdentity"
          description: Full identity of the indexed column.
        vectorIndex:
          type: boolean
          description: '`true` when the target column is a `vector<float, N>`.'
          example: true
        similarityFunction:
          oneOf:
            - $ref: "#/components/schemas/SimilarityFunction"
            - type: "null"
        sourceModel:
          type: [string, "null"]
          example: openai-v3-large
        options:
          type: object
          description: Full SAI options map as stored, including analyzer and normalization keys.
          additionalProperties:
            type: string
          example:
            similarity_function: cosine
            source_model: openai-v3-large
        className:
          type: string
          example: org.apache.cassandra.index.sai.StorageAttachedIndex

    SaiIndexDefinition:
      type: object
      description: |
        Vector indexes use `similarityFunction` and `sourceModel`; scalar indexes use the analyzer
        and normalization options. Unrecognised keys go through `options` unchanged.
      required: [name, target]
      properties:
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        target:
          type: string
          description: Column name, or a collection selector such as `values(tags)`.
          example: embedding
        similarityFunction:
          $ref: "#/components/schemas/SimilarityFunction"
        sourceModel:
          type: string
          example: openai-v3-large
        caseSensitive:
          type: boolean
          description: Scalar text indexes only.
          example: false
        normalize:
          type: boolean
          description: Scalar text indexes only — Unicode normalization.
          example: true
        asciiOnly:
          type: boolean
          example: false
        analyzer:
          type: string
          description: JSON analyzer definition for text SAI indexes.
          example: '{"tokenizer":{"name":"standard"},"filters":[{"name":"lowercase"}]}'
        options:
          type: object
          description: Additional raw SAI options, merged last.
          additionalProperties:
            type: string
        ifNotExists:
          type: boolean
          default: true
      example:
        name: products_embedding_idx
        target: embedding
        similarityFunction: cosine
        sourceModel: openai-v3-large
        ifNotExists: true

    SaiIndexStatus:
      type: object
      required: [identity, name, state]
      properties:
        identity:
          $ref: "#/components/schemas/SchemaIdentity"
        name:
          $ref: "#/components/schemas/CqlIdentifier"
        state:
          type: string
          enum: [BUILDING, QUERYABLE, FAILED, UNKNOWN]
          example: QUERYABLE
        buildProgressPercent:
          type: [number, "null"]
          format: double
          example: 100.0
        queryable:
          type: boolean
          example: true
        perNode:
          type: array
          items:
            $ref: "#/components/schemas/SaiIndexNodeStatus"
        definition:
          $ref: "#/components/schemas/SaiIndex"

    SaiIndexNodeStatus:
      type: object
      required: [endpoint, state]
      properties:
        endpoint:
          type: string
          example: 127.0.0.1:9042
        state:
          type: string
          enum: [BUILDING, QUERYABLE, FAILED, UNKNOWN]
          example: QUERYABLE

    AnnQueryVectorSource:
      type: object
      description: |
        Where the query vector comes from. Exactly one of `values`, `fromRow` or `uploadId`.
      properties:
        values:
          type: array
          description: The vector itself.
          items:
            type: number
            format: float
          example: [0.0123, -0.9871, 0.4412]
        fromRow:
          allOf:
            - $ref: "#/components/schemas/AnnQueryRowReference"
          description: Reference an existing row's vector column — "find rows similar to this one".
        uploadId:
          type: string
          description: Handle from an uploaded vector file (JSON array of floats).
          example: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK

    AnnQueryRowReference:
      type: object
      required: [primaryKey]
      properties:
        primaryKey:
          type: object
          description: Complete primary key of the reference row.
          additionalProperties:
            $ref: "#/components/schemas/CqlValue"
          example:
            product_id: 7c1a2b3d-4e5f-4061-8273-849506172839
        column:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Vector column to read from; defaults to the ANN column.

    AnnPredicate:
      type: object
      description: An SAI predicate for a hybrid query — SAI filtering plus ANN in one statement.
      required: [column, operator, value]
      properties:
        column:
          $ref: "#/components/schemas/CqlIdentifier"
        operator:
          type: string
          enum: ["=", "<", "<=", ">", ">=", "IN", "CONTAINS", "CONTAINS KEY", ":"]
          example: "="
        value:
          $ref: "#/components/schemas/CqlValue"
      example:
        column: category
        operator: "="
        value: electronics

    AnnQueryRequest:
      type: object
      required: [keyspace, table, vectorColumn, queryVector, limit]
      properties:
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        vectorColumn:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: The `vector<float, N>` column to order by. Must carry an SAI index.
        queryVector:
          $ref: "#/components/schemas/AnnQueryVectorSource"
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: The `k` of `LIMIT k`. ANN queries always require a limit.
          example: 10
        selectColumns:
          type: array
          description: Projection; empty means `SELECT *`.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [product_id, name, category]
        predicates:
          type: array
          description: SAI predicates for a hybrid query, ANDed into the `WHERE` clause.
          items:
            $ref: "#/components/schemas/AnnPredicate"
        similarityProjections:
          type: array
          description: |
            Emit `similarity_cosine(col, [...])` etc. as extra score columns, sortable in the grid.
          items:
            $ref: "#/components/schemas/SimilarityFunction"
          example: [cosine]
        includeVectorColumn:
          type: boolean
          description: Include the raw vector in the projection. Off by default — it is large.
          default: false
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        fetchSize:
          type: integer
          minimum: 1
          maximum: 10000
          default: 500
      example:
        keyspace: demo
        table: products
        vectorColumn: embedding
        queryVector:
          values: [0.0123, -0.9871, 0.4412]
        limit: 10
        selectColumns: [product_id, name, category]
        predicates:
          - column: category
            operator: "="
            value: electronics
        similarityProjections: [cosine]

    AnnQueryPreview:
      type: object
      required: [cql]
      properties:
        cql:
          type: string
          description: |
            The generated statement. The literal vector is inlined here for copy-paste fidelity;
            `executeAnnQuery` binds it instead.
          example: "SELECT product_id, name, category, similarity_cosine(embedding, [0.0123, -0.9871, 0.4412]) AS cosine_score FROM demo.products WHERE category = 'electronics' ORDER BY embedding ANN OF [0.0123, -0.9871, 0.4412] LIMIT 10"
        abbreviatedCql:
          type: string
          description: Same statement with the vector elided, for display in narrow panes.
          example: "SELECT … ORDER BY embedding ANN OF [… 1536 floats …] LIMIT 10"
        dimensions:
          type: integer
          example: 1536
        similarityColumns:
          type: array
          items:
            type: string
          example: [cosine_score]
        warnings:
          type: array
          description: |
            E.g. a dimension mismatch between the query vector and the column, or a predicate on a
            column with no SAI index.
          items:
            type: string
          example: []
        indexUsed:
          oneOf:
            - $ref: "#/components/schemas/SaiIndex"
            - type: "null"

    SimilarityRequest:
      type: object
      required: [left, right]
      properties:
        left:
          $ref: "#/components/schemas/AnnQueryVectorSource"
        right:
          $ref: "#/components/schemas/AnnQueryVectorSource"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityFunction"
          default: [cosine]
          example: [cosine, dot_product, euclidean]
        keyspace:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Required when either side uses `fromRow`.
        table:
          $ref: "#/components/schemas/CqlIdentifier"
      example:
        left:
          values: [0.0123, -0.9871, 0.4412]
        right:
          fromRow:
            primaryKey:
              product_id: 7c1a2b3d-4e5f-4061-8273-849506172839
            column: embedding
        keyspace: demo
        table: products
        functions: [cosine, euclidean]

    SimilarityResult:
      type: object
      required: [dimensions, scores]
      properties:
        dimensions:
          type: integer
          example: 1536
        scores:
          type: object
          description: Keyed by similarity function name.
          additionalProperties:
            type: number
            format: double
          example:
            cosine: 0.9231
            euclidean: 0.3912
        leftMagnitude:
          type: number
          format: double
          example: 1.0
        rightMagnitude:
          type: number
          format: double
          example: 1.0
        warnings:
          type: array
          items:
            type: string
          example: []

    ########################################################################
    # migration & advanced operations (§8)
    ########################################################################

    DumpContent:
      type: string
      enum: [SCHEMA_ONLY, DATA_ONLY, SCHEMA_AND_DATA]
      example: SCHEMA_AND_DATA

    DumpLayout:
      type: string
      description: '`SINGLE_FILE` writes one `.cql` file; `DIRECTORY_TREE` writes one file per table.'
      enum: [SINGLE_FILE, DIRECTORY_TREE]
      example: DIRECTORY_TREE

    CqlDumpRequest:
      type: object
      required: [keyspace, content]
      properties:
        name:
          type: string
          example: Nightly dump of demo
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        tables:
          type: array
          description: Per-table selection; empty or omitted dumps every table in the keyspace.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: [users, orders]
        content:
          $ref: "#/components/schemas/DumpContent"
        layout:
          $ref: "#/components/schemas/DumpLayout"
        includeViews:
          type: boolean
          default: true
        includeTypes:
          type: boolean
          default: true
        includeFunctions:
          type: boolean
          default: true
        compression:
          type: string
          enum: [NONE, GZIP, ZSTD]
          default: GZIP
        sink:
          $ref: "#/components/schemas/UnloadSink"
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Nightly dump of demo
        keyspace: demo
        tables: [users, orders]
        content: SCHEMA_AND_DATA
        layout: DIRECTORY_TREE
        compression: GZIP
        sink:
          type: DOWNLOAD

    CqlRestoreRequest:
      type: object
      description: Replays a dump. Exactly one of `uploadId` or `path`.
      required: [content]
      properties:
        name:
          type: string
          example: Restore demo from nightly dump
        uploadId:
          type: string
          example: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
        path:
          type: string
          description: Server-side path to a dump file or directory tree.
          example: /data/dumps/demo-20260817
        targetKeyspace:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Restore into a different keyspace than the dump was taken from.
          example: demo_restored
        content:
          $ref: "#/components/schemas/DumpContent"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        replication:
          allOf:
            - $ref: "#/components/schemas/ReplicationSettings"
          description: Override the dumped keyspace's replication when recreating it.
        dropExisting:
          type: boolean
          description: Drop conflicting objects before replaying schema. Destructive; defaults off.
          default: false
        stopOnError:
          type: boolean
          default: true
      example:
        name: Restore demo
        uploadId: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
        content: SCHEMA_AND_DATA
        targetKeyspace: demo_restored
        dropExisting: false

    KeyspaceCopyRequest:
      type: object
      description: |
        Cluster→cluster streaming copy. Both connections must have live sessions. Nothing is
        buffered to disk (plan §8).
      required: [sourceConnectionId, targetConnectionId, sourceKeyspace]
      properties:
        name:
          type: string
          example: Copy demo from staging to prod
        sourceConnectionId:
          type: string
          format: uuid
          example: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        targetConnectionId:
          type: string
          format: uuid
          example: 4d3c2b1a-9f8e-4d7c-8b6a-5e4d3c2b1a09
        sourceKeyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        targetKeyspace:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Defaults to `sourceKeyspace`.
        tables:
          type: array
          description: Table selection; empty copies every table.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        createSchema:
          type: boolean
          description: Recreate keyspace, types and tables on the target before copying data.
          default: true
        replicationRemap:
          type: object
          description: |
            Target replication factors keyed by **target** datacenter name — source DC names
            rarely match the target's (plan §8).
          additionalProperties:
            type: integer
            minimum: 0
          example:
            eu-west-1: 3
        copyData:
          type: boolean
          default: true
        truncateTarget:
          type: boolean
          description: Truncate each target table before copying. Destructive; defaults off.
          default: false
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Copy demo from staging to prod
        sourceConnectionId: 8f2b1c6e-2a55-4f47-9f2a-4c1c3f0d9a11
        targetConnectionId: 4d3c2b1a-9f8e-4d7c-8b6a-5e4d3c2b1a09
        sourceKeyspace: demo
        targetKeyspace: demo
        createSchema: true
        replicationRemap:
          eu-west-1: 3
        copyData: true

    DuplicateTableRequest:
      type: object
      required: [sourceKeyspace, sourceTable, targetTable]
      properties:
        name:
          type: string
          example: Duplicate demo.users
        sourceKeyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        sourceTable:
          $ref: "#/components/schemas/CqlIdentifier"
        targetKeyspace:
          allOf:
            - $ref: "#/components/schemas/CqlIdentifier"
          description: Defaults to `sourceKeyspace`. May be in the same cluster only.
        targetTable:
          $ref: "#/components/schemas/CqlIdentifier"
        copyData:
          type: boolean
          default: true
        copyIndexes:
          type: boolean
          default: true
        whereClause:
          type: string
          description: Optional filter applied to the copied rows.
          example: "created_at > '2026-01-01'"
        optionOverrides:
          $ref: "#/components/schemas/TableOptions"
      example:
        sourceKeyspace: demo
        sourceTable: users
        targetTable: users_backup
        copyData: true
        copyIndexes: true

    FileImportPreviewRequest:
      type: object
      required: [keyspace, table, source]
      properties:
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        source:
          $ref: "#/components/schemas/LoadSource"
        sampleRows:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
          example: 20
        mapping:
          type: object
          description: Explicit source-field → column mapping; omit to have one inferred.
          additionalProperties:
            $ref: "#/components/schemas/CqlIdentifier"
        sheet:
          type: string
          description: Worksheet name, for Excel sources.
          example: Sheet1
      example:
        keyspace: demo
        table: users
        source:
          uploadId: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
          format: CSV
        sampleRows: 20

    FileImportPreview:
      type: object
      description: Dry-run result — nothing has been written.
      required: [sourceFields, mapping, sampleRows]
      properties:
        sourceFields:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceField"
        mapping:
          type: object
          description: Proposed source-field → CQL column mapping.
          additionalProperties:
            $ref: "#/components/schemas/CqlIdentifier"
          example:
            user_id: user_id
            mail: email
        unmappedFields:
          type: array
          items:
            type: string
          example: [legacy_id]
        missingRequiredColumns:
          type: array
          description: Primary-key columns with no mapped source field — a blocking problem.
          items:
            $ref: "#/components/schemas/CqlIdentifier"
          example: []
        sampleRows:
          type: array
          description: The first N rows, already converted to CQL values.
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CqlValue"
        conversionErrors:
          type: array
          items:
            $ref: "#/components/schemas/ImportConversionError"
        estimatedRows:
          type: [integer, "null"]
          format: int64
          example: 250000

    ImportSourceField:
      type: object
      required: [name, inferredType]
      properties:
        name:
          type: string
          example: mail
        index:
          type: integer
          description: Positional index, for headerless sources.
          example: 1
        inferredType:
          type: string
          description: Inferred CQL type for this field.
          example: text
        nullable:
          type: boolean
          example: false
        sampleValues:
          type: array
          items:
            type: string
          example: ["ops@example.com", "dev@example.com"]

    ImportConversionError:
      type: object
      required: [row, field, message]
      properties:
        row:
          type: integer
          format: int64
          example: 7
        field:
          type: string
          example: created_at
        value:
          type: string
          example: "not-a-date"
        message:
          type: string
          example: Cannot parse 'not-a-date' as timestamp with format CQL_TIMESTAMP.

    FileImportRequest:
      type: object
      required: [keyspace, table, source]
      properties:
        name:
          type: string
          example: Import users.csv
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        source:
          $ref: "#/components/schemas/LoadSource"
        mapping:
          type: object
          description: Confirmed mapping from the preview step.
          additionalProperties:
            $ref: "#/components/schemas/CqlIdentifier"
          example:
            user_id: user_id
            mail: email
        sheet:
          type: string
          example: Sheet1
        createTable:
          type: boolean
          description: Create the target table from the inferred schema if it does not exist.
          default: false
        dryRun:
          type: boolean
          default: false
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        keyspace: demo
        table: users
        source:
          uploadId: up_01J8Z1M4C7Q9X0R2T4V6Y8B1DK
          format: CSV
        mapping:
          user_id: user_id
          mail: email
        dryRun: false

    JdbcVendor:
      type: string
      enum: [MYSQL, SQLSERVER]
      example: MYSQL

    JdbcSource:
      type: object
      description: |
        JDBC connection coordinates. `password` is **write-only** and never returned — including
        in `JdbcInspectResult` and in error responses.
      required: [vendor, url, username]
      properties:
        vendor:
          $ref: "#/components/schemas/JdbcVendor"
        url:
          type: string
          example: jdbc:mysql://mysql.internal:3306/shop
        username:
          type: string
          example: readonly
        password:
          type: string
          writeOnly: true
          description: Encrypted in transit at rest for the job's lifetime; never returned.
        properties:
          type: object
          additionalProperties:
            type: string
          example:
            useSSL: "true"

    JdbcInspectRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/JdbcSource"
        schemaName:
          type: string
          example: shop
        tableName:
          type: string
          example: customers
        query:
          type: string
          description: Inspect an arbitrary query's result shape instead of a table.
          example: SELECT id, email, created_at FROM customers
        sampleRows:
          type: integer
          default: 20
      example:
        source:
          vendor: MYSQL
          url: jdbc:mysql://mysql.internal:3306/shop
          username: readonly
          password: "REDACTED"
        schemaName: shop
        tableName: customers

    JdbcColumn:
      type: object
      required: [name, jdbcType, suggestedCqlType, nullable]
      properties:
        name:
          type: string
          example: id
        jdbcType:
          type: string
          example: BIGINT
        suggestedCqlType:
          type: string
          example: bigint
        nullable:
          type: boolean
          example: false
        primaryKeyPosition:
          type: [integer, "null"]
          description: 1-based position in the source primary key; `null` if not part of it.
          example: 1

    JdbcInspectResult:
      type: object
      description: Contains no credentials.
      required: [columns, suggestedTable]
      properties:
        vendor:
          $ref: "#/components/schemas/JdbcVendor"
        schemaName:
          type: string
          example: shop
        tableName:
          type: string
          example: customers
        columns:
          type: array
          items:
            $ref: "#/components/schemas/JdbcColumn"
        sourcePrimaryKey:
          type: array
          items:
            type: string
          example: [id]
        sourceIndexes:
          type: array
          items:
            type: string
          example: [idx_customers_email]
        suggestedTable:
          allOf:
            - $ref: "#/components/schemas/TableDefinition"
          description: |
            Proposed CQL table, with partition and clustering keys derived from the source primary
            key. Always shown for review before creation — never applied automatically.
        suggestedMapping:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CqlIdentifier"
          example:
            id: customer_id
            email: email
        estimatedRows:
          type: [integer, "null"]
          format: int64
          example: 1250000
        warnings:
          type: array
          items:
            type: string
          example:
            - "Source column `notes` is TEXT with no length bound; mapped to CQL text."

    JdbcImportRequest:
      type: object
      required: [source, keyspace, table]
      properties:
        name:
          type: string
          example: Import customers from MySQL
        source:
          $ref: "#/components/schemas/JdbcSource"
        schemaName:
          type: string
          example: shop
        tableName:
          type: string
          example: customers
        query:
          type: string
          description: Custom extract query; mutually exclusive with `tableName`.
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        createTable:
          type: boolean
          description: Create the target table from `JdbcInspectResult.suggestedTable` first.
          default: false
        tableDefinition:
          allOf:
            - $ref: "#/components/schemas/TableDefinition"
          description: The user-reviewed definition to create when `createTable` is `true`.
        mapping:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CqlIdentifier"
        fetchSize:
          type: integer
          description: JDBC fetch size for the extract phase.
          default: 5000
          example: 5000
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Import customers from MySQL
        source:
          vendor: MYSQL
          url: jdbc:mysql://mysql.internal:3306/shop
          username: readonly
          password: "REDACTED"
        schemaName: shop
        tableName: customers
        keyspace: demo
        table: customers
        createTable: true

    ExportSourceType:
      type: string
      description: |
        `RESULT_HANDLE` exports exactly what the grid shows. `TABLE` and `QUERY` run a full export
        through the native engine and are **not** bounded by the current page.
      enum: [RESULT_HANDLE, TABLE, QUERY]
      example: RESULT_HANDLE

    ResultExportRequest:
      type: object
      required: [source, format]
      properties:
        name:
          type: string
          example: Export current grid
        source:
          $ref: "#/components/schemas/ExportSourceType"
        resultHandle:
          type: string
          description: Required when `source` is `RESULT_HANDLE`.
          example: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW
        keyspace:
          $ref: "#/components/schemas/CqlIdentifier"
        table:
          $ref: "#/components/schemas/CqlIdentifier"
        query:
          type: string
          description: Required when `source` is `QUERY`.
        format:
          $ref: "#/components/schemas/ExportFormat"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/CqlIdentifier"
        sink:
          $ref: "#/components/schemas/UnloadSink"
        includeHeader:
          type: boolean
          default: true
        maxRows:
          type: integer
          format: int64
          description: Cap the export; `-1` for unlimited.
          default: -1
          example: -1
        dsbulkSettings:
          $ref: "#/components/schemas/DsbulkSettings"
      example:
        name: Export current grid
        source: RESULT_HANDLE
        resultHandle: rs_01J8Z0QF9V3TZ2H8G6M4B7K1QW
        format: CSV
        includeHeader: true
        sink:
          type: DOWNLOAD

