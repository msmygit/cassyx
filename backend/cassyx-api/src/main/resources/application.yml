spring:
  application:
    name: cassyx
  # Java 21 virtual threads: every request and every per-token-range scan task runs on one
  # (plan section 2 version pins, section 5.1 "async execution on virtual threads").
  threads:
    virtual:
      enabled: true
  # H2 in FILE mode - connections, saved scripts, history, jobs and the license live here and must
  # survive a container restart. The file sits on a mounted volume in Docker Compose.
  datasource:
    # DB_CLOSE_ON_EXIT=FALSE lets Spring close the pool on its own shutdown hook instead of H2
    # yanking the database out from under it.
    #
    # AUTO_SERVER=TRUE is deliberately NOT set: H2 2.3 rejects the two together with
    # `Feature not supported: "AUTO_SERVER=TRUE && DB_CLOSE_ON_EXIT=FALSE"` and refuses every
    # connection, so Flyway fails before the app can start. AUTO_SERVER exists to let a second
    # process attach to the same file; cassyx is a single process per data directory, so it buys
    # nothing here and would open an extra listening port in the container.
    url: jdbc:h2:file:${CASSYX_DB_PATH:./data/cassyx};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${CASSYX_DB_USER:cassyx}
    password: ${CASSYX_DB_PASSWORD:cassyx}
    hikari:
      pool-name: cassyx-h2
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Secure connect bundle / truststore uploads (plan section 3).
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${CASSYX_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # cassyx manages CqlSessions per connection; there is no single global cluster to health-check.
    cassandra:
      enabled: false

logging:
  level:
    io.cassyx: ${CASSYX_LOG_LEVEL:INFO}
    com.datastax.oss.driver: WARN

cassyx:
  license:
    enforce: ${CASSYX_LICENSE_ENFORCE:true}   # false => fully unlocked, no checks
    # BUILD-time gate on the line above (plan section 9.2), filtered in by Maven: true from the
    # `dev` profile, false from `release` (which is what backend/Dockerfile builds). When false,
    # CASSYX_LICENSE_ENFORCE=false is IGNORED and a WARN naming it is logged. Deliberately not an
    # env var: a runtime switch guarding a runtime switch guards nothing. The supported way to run
    # a release build unlocked is a free signed site licence in CASSYX_LICENSE_KEY.
    bypass-allowed: @cassyx.license.bypass.allowed@
    key:     ${CASSYX_LICENSE_KEY:}
    # Only the PUBLIC half of the Ed25519 key pair ever ships (plan section 9.1). Minting happens
    # in the separate licensing/ deployment, which holds the private key.
    #
    # The real key is the DEFAULT rather than something the operator supplies, and that is
    # deliberate. Shipping PLACEHOLDER meant 1.0.0 could verify nothing at all: no CASSYX_LICENSE_
    # PUBLIC_KEY was set anywhere in docker-compose.release.yml or .env.release.example, so every
    # customer got "This server is not configured for licensing" and no key could ever unlock it.
    # A locked box with no keyhole.
    #
    # A public key is not a secret - it is the half designed to be published - so baking it in is
    # safe, and it means verification cannot be broken by a customer editing compose. The override
    # remains for a private fork that mints its own keys.
    public-key: ${CASSYX_LICENSE_PUBLIC_KEY:MCowBQYDK2VwAyEA7n26g0ti3VRaiAaavuPPsmV6A1KHwLG7PqRB32zf0hw=}

  billing:
    enabled:          ${CASSYX_BILLING_ENABLED:false}
    provider:         stripe
    api-base-url:     ${CASSYX_BILLING_API_URL:https://api.stripe.com}
    publishable-key:  ${STRIPE_PUBLISHABLE_KEY:pk_test_PLACEHOLDER}
    secret-key:       ${STRIPE_SECRET_KEY:rk_test_PLACEHOLDER}
    webhook-secret:   ${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}
    price-id:         ${STRIPE_PRICE_ID:price_PLACEHOLDER}
    success-url:      ${CASSYX_SUCCESS_URL:http://localhost:8080/activate?session_id={CHECKOUT_SESSION_ID}}
    cancel-url:       ${CASSYX_CANCEL_URL:http://localhost:8080/pricing}

  # PATH-mode secure connect bundles resolve under this root only (plan section 3).
  scb:
    path-root: ${CASSYX_SCB_PATH_ROOT:/etc/cassyx/scb}

  # Bounded job executor (plan section 5.5).
  jobs:
    max-concurrent: ${CASSYX_MAX_CONCURRENT_JOBS:4}
    work-dir: ${CASSYX_JOB_WORK_DIR:./data/jobs}
