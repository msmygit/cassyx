# =============================================================================
# cassyx CI — the per-PR job set from plan §11.1.
#
#   contract · lint · arch · unit · integration · e2e · security
#
# `contract` runs FIRST and FAST (§11.1): it is the cheapest signal that eight
# parallel workstreams are still building against the same agreed API. It has no
# `needs:` either — it simply finishes in a minute or two while the heavy jobs
# are still pulling images.
#
# Every job runs the SAME `make` target a developer runs locally. That is the
# no-drift rule: `make verify` runs exactly this set, so there is no
# "works on my machine" gap. If you change what CI does, change the Makefile
# target — never the workflow step.
#
# All jobs are independent (no `needs:`) so they run fully in parallel.
# Branch protection should require: contract, lint, arch, unit, integration,
# e2e, security.
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never opens a browser and always runs with licensing bypassed (§9.2).
  CASSYX_NO_OPEN: "1"
  CASSYX_LICENSE_ENFORCE: "false"
  DOCKER_BUILDKIT: "1"

jobs:
  # ---------------------------------------------------------------------------
  # First and fastest (§11.1): openapi/cassyx-api.yaml is the coordination
  # artifact — a red spec breaks every workstream at once.
  contract:
    name: contract (openapi 3.1.1 · refs · redocly 0/0 · gen:api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: make contract
        run: make contract

  # ---------------------------------------------------------------------------
  lint:
    name: lint (spotless · checkstyle · eslint · tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap .env
        run: cp .env.example .env
      - name: make lint
        run: make lint

  # ---------------------------------------------------------------------------
  arch:
    name: arch (ArchUnit §2.1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: make arch
        run: make arch

  # ---------------------------------------------------------------------------
  unit:
    name: unit (mvn test · vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: make unit
        run: make unit
      - name: make unit-frontend
        run: make unit-frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: |
            backend/**/target/site/jacoco/**
            frontend/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  integration:
    name: integration (Testcontainers Cassandra 5.x)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Pre-pull Cassandra 5.x
        run: docker pull cassandra:5.0
      - name: make integration
        run: make integration
      - name: Upload surefire/failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports
          path: backend/**/target/*-reports/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Boots the real stack and asserts it serves. Deliberately separate from e2e:
  # Phase 0 shipped two defects (an invalid H2 URL, and an eagerly-built Ed25519
  # verifier that threw on the shipped placeholder key) that every unit test
  # passed and that killed the app on first boot. Playwright would have caught
  # them only as an opaque browser timeout at the end of a 45-minute job; this
  # fails in a couple of minutes naming the actual endpoint.
  smoke:
    name: smoke (stack boots and serves)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Pre-pull Cassandra 5.x
        run: docker pull cassandra:5.0
      - name: make smoke
        run: make smoke
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Pre-pull Cassandra 5.x
        run: docker pull cassandra:5.0
      - name: make e2e
        run: make e2e
      # NOT `make logs`: that target is `docker compose logs -f`, which follows the stream
      # forever. In CI it never returns, so the job burns to its 45-minute timeout and the
      # real Playwright failure is buried under a hung diagnostic step.
      - name: Stack logs on failure
        if: failure()
        timeout-minutes: 2
        run: docker compose logs --tail=200 || true
      - name: Upload Playwright report (trace + video retained on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/**
            e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: make down || true

  # ---------------------------------------------------------------------------
  # Per-commit security only: gitleaks and npm audit are commit-sensitive and fast.
  # OWASP Dependency-Check moved to .github/workflows/cve-scan.yml (weekly + on
  # dependency-manifest changes) — its verdict depends on the NVD feed, not on your
  # commits, so running it per-PR added ~20 minutes to re-ask an unchanged question
  # while giving worse coverage than a schedule during quiet periods.
  security:
    name: security (gitleaks · npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks history scan
      - run: cp .env.example .env
      - name: make secrets
        run: make secrets
      - name: make deps-audit
        run: make deps-audit

  # ---------------------------------------------------------------------------
  # Guard against the one failure mode this pipeline exists to prevent:
  # CI and `make verify` drifting apart.
  verify-parity:
    name: verify parity (CI == make verify)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The verify target must invoke exactly the per-PR CI job set
        run: bash scripts/check-verify-parity.sh
