# cassyx licensing service (plan sections 9.1, 9.3, 9.4).
#
# Every secret here is a PLACEHOLDER. Real values come from the environment - see
# licensing/.env.example. Nothing in this file may ever contain a live key: the private key alone
# is enough to mint free licences forever.

spring:
  application:
    name: cassyx-licensing
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${CASSYX_LICENSING_DB_PATH:./data/licensing};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${CASSYX_LICENSING_DB_USER:licensing}
    password: ${CASSYX_LICENSING_DB_PASSWORD:licensing}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CASSYX_LICENSING_PORT:8090}
  shutdown: graceful

logging:
  level:
    io.cassyx: ${CASSYX_LOG_LEVEL:INFO}

cassyx:
  licensing:
    # PRIVATE half of the Ed25519 pair. NEVER ships in the product image (plan section 9.1).
    private-key:    ${CASSYX_LICENSING_PRIVATE_KEY:PLACEHOLDER}
    # PUBLIC half, so every minted key is verified before it is emailed.
    public-key:     ${CASSYX_LICENSE_PUBLIC_KEY:PLACEHOLDER}
    trial-days:     ${CASSYX_LICENSING_TRIAL_DAYS:14}
    # Purchased major version written into `scope` (plan section 9.5). 0 omits the field, which
    # means "unrestricted" - start there and turn it on when you are ready to enforce upgrades.
    scope:          ${CASSYX_LICENSING_SCOPE:0}
    payload-version: ${CASSYX_LICENSING_PAYLOAD_VERSION:1}
    seats:          ${CASSYX_LICENSING_SEATS:1}
    # Shared secret cassyx-api sends as X-Cassyx-Licensing-Token on internal endpoints.
    token:          ${CASSYX_LICENSING_TOKEN:PLACEHOLDER}
    stripe:
      secret-key:     ${STRIPE_SECRET_KEY:rk_test_PLACEHOLDER}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}
      api-base-url:   ${CASSYX_BILLING_API_URL:https://api.stripe.com}
    email:
      # 'log' writes the whole email (including the key) to the log instead of sending it, so the
      # service runs end to end with no provider account. Not for production. 'smtp' is the real
      # one. Anything else fails startup rather than quietly logging keys nobody reads.
      provider:  ${CASSYX_LICENSING_EMAIL_PROVIDER:log}
      from:      ${CASSYX_LICENSING_EMAIL_FROM:licensing@cassyx.dev}
      from-name: ${CASSYX_LICENSING_EMAIL_FROM_NAME:cassyx}
      reply-to:  ${CASSYX_LICENSING_EMAIL_REPLY_TO:support@cassyx.dev}
      subject:   ${CASSYX_LICENSING_EMAIL_SUBJECT:Your cassyx licence key}
      # Both optional: blank simply omits the line from the email rather than printing a dead link.
      purchase-url: ${CASSYX_LICENSING_PURCHASE_URL:}
      recovery-url: ${CASSYX_LICENSING_RECOVERY_URL:}
      smtp:
        host:     ${CASSYX_LICENSING_SMTP_HOST:}
        port:     ${CASSYX_LICENSING_SMTP_PORT:587}
        username: ${CASSYX_LICENSING_SMTP_USERNAME:}
        password: ${CASSYX_LICENSING_SMTP_PASSWORD:}
        # starttls (587) | ssl (implicit TLS, 465) | none (local test server ONLY - 'none' sends
        # the customer's licence key over the wire in clear text).
        tls:      ${CASSYX_LICENSING_SMTP_TLS:starttls}
        # Jakarta Mail defaults every one of these to INFINITE. A hung provider must fail
        # fulfilment (the key is already persisted and recoverable), never stall it.
        connection-timeout-ms: ${CASSYX_LICENSING_SMTP_CONNECT_TIMEOUT_MS:10000}
        read-timeout-ms:       ${CASSYX_LICENSING_SMTP_READ_TIMEOUT_MS:15000}
        write-timeout-ms:      ${CASSYX_LICENSING_SMTP_WRITE_TIMEOUT_MS:15000}
        # Bounded, and small on purpose: this runs inside the Stripe webhook handler, and anything
        # beyond a couple of quick retries is POST /licensing/recover's job.
        max-attempts:   ${CASSYX_LICENSING_SMTP_MAX_ATTEMPTS:3}
        retry-delay-ms: ${CASSYX_LICENSING_SMTP_RETRY_DELAY_MS:500}
